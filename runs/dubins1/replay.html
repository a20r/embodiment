<title>Mazebot Dubins Run</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #f7f6f3;
  --surface: #fcfcfb;
  --border: #e2e0da;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #8a897f;
  --robot: #2a78d6;
  --trail: #eb6834;
  --lidar: #1baf7a;
  --hit: #e34948;
  --goal: #008300;
  --chip: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141413;
    --surface: #1a1a19;
    --border: #33322e;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #8a897f;
    --robot: #3987e5;
    --trail: #d95926;
    --lidar: #199e70;
    --hit: #e66767;
    --goal: #35b135;
    --chip: #232320;
  }
}
:root[data-theme="dark"] {
  --ground: #141413;
  --surface: #1a1a19;
  --border: #33322e;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --ink-3: #8a897f;
  --robot: #3987e5;
  --trail: #d95926;
  --lidar: #199e70;
  --hit: #e66767;
  --goal: #35b135;
  --chip: #232320;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: Archivo, system-ui, sans-serif; font-size: 15px;
  line-height: 1.5;
}
header {
  padding: 20px 22px 14px; border-bottom: 1px solid var(--border);
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px;
}
h1 {
  font-family: "Martian Mono", monospace; font-size: 19px; margin: 0;
  letter-spacing: -0.02em;
}
.sub { color: var(--ink-2); font-size: 13.5px; }
.sub code { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 22px;
  border-bottom: 1px solid var(--border); }
.chip {
  background: var(--chip); border: 1px solid var(--border);
  border-radius: 4px; padding: 5px 11px; font-size: 12px;
  color: var(--ink-2); letter-spacing: 0.02em;
}
.chip b {
  font-family: "Martian Mono", monospace; font-size: 13px;
  color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums;
}
.chip.state-solved { border-color: var(--goal); color: var(--goal); }
.chip.state-live { border-color: var(--trail); color: var(--trail); }
main {
  display: grid; grid-template-columns: minmax(340px, 56%) 1fr;
  gap: 18px; padding: 18px 22px; align-items: start;
}
@media (max-width: 880px) { main { grid-template-columns: 1fr; } }
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
}
.panel-label {
  font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--ink-3); padding: 10px 14px 0;
}
#stage { padding: 8px 12px 4px; }
#cv { width: 100%; height: auto; display: block; }
.controls {
  display: flex; align-items: center; gap: 12px; padding: 8px 14px 14px;
}
button {
  font-family: "Martian Mono", monospace; font-size: 12px;
  background: var(--chip); color: var(--ink);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 7px 16px; cursor: pointer;
}
button:hover { border-color: var(--ink-3); }
button:focus-visible { outline: 2px solid var(--robot); outline-offset: 1px; }
input[type="range"] { flex: 1; accent-color: var(--trail); }
#clock {
  font-family: "Martian Mono", monospace; font-size: 12px;
  color: var(--ink-2); min-width: 150px; text-align: right;
  font-variant-numeric: tabular-nums;
}
.legend { display: flex; gap: 14px; padding: 0 14px 12px; flex-wrap: wrap;
  font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px;
  border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.col-right { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
#feed { max-height: 520px; overflow-y: auto; padding: 6px 14px 14px; }
.ev { margin: 10px 0; }
.ev.agent { font-size: 14px; }
.ev.agent::before {
  content: "AGENT"; display: block; font-size: 10px; letter-spacing: 0.09em;
  color: var(--ink-3); margin-bottom: 2px;
}
.ev.cmd, .ev.out {
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-word;
  padding: 7px 10px; border-radius: 4px;
}
.ev.cmd { background: var(--chip); border-left: 3px solid var(--robot); }
.ev.out { color: var(--ink-2); border-left: 3px solid var(--border);
  max-height: 150px; overflow-y: auto; }
.ev.note { color: var(--ink-3); font-style: italic; font-size: 13px;
  text-align: center; }
#memlist { padding: 6px 14px 14px; }
.memfile { margin: 8px 0; }
.memfile summary {
  font-family: "IBM Plex Mono", monospace; font-size: 12.5px;
  cursor: pointer; color: var(--ink); padding: 4px 0;
}
.memfile pre {
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-word; color: var(--ink-2);
  background: var(--chip); padding: 10px; border-radius: 4px; margin: 4px 0;
}
.empty { color: var(--ink-3); padding: 10px 14px 16px; font-size: 13px; }
footer { color: var(--ink-3); font-size: 12px; padding: 4px 22px 24px; }
</style>

<header>
  <h1>Mazebot Dubins Run</h1>
  <span class="sub" id="subtitle"></span>
</header>
<div class="chips" id="chips"></div>
<main>
  <section class="panel">
    <div class="panel-label">Ground truth — top-down replay</div>
    <div id="stage"><canvas id="cv" width="960" height="960"></canvas></div>
    <div class="controls">
      <button id="play" aria-label="play or pause replay">PLAY</button>
      <input type="range" id="scrub" min="0" max="0" value="0"
        aria-label="replay position">
      <span id="clock"></span>
    </div>
    <div class="legend">
      <span><i style="background:var(--robot)"></i>robot</span>
      <span><i style="background:var(--trail)"></i>trail</span>
      <span><i style="background:var(--hit)"></i>collision</span>
      <span><i style="background:var(--goal)"></i>goal cell</span>
    </div>
  </section>
  <div class="col-right">
    <section class="panel">
      <div class="panel-label">Agent transcript</div>
      <div id="feed"></div>
    </section>
    <section class="panel">
      <div class="panel-label">/memory — what it left for its future self</div>
      <div id="memlist"></div>
    </section>
  </div>
</main>
<footer>
  Recorded by the Mazebot platform's ground-truth log. The agent never
  sees this view — inside its container the world is only
  <code>/dev/robot</code> device files.
</footer>

rs.log\nexplore3.out\nfinder.out\nlog.md\nports.md\nstrategy.md\nwf2.out\n# READ ME FIRST (written end of episode 1 \u2014 goal NOT reached)\n\n## TL;DR bootstrap\n1. Ports: see ports.md. d1=steer(write), d3=throttle(write, PERSISTS \u2014 zero it!),\n   d0=tick+goal flag, d2=16-beam lidar CSV (beam i at heading+22.5i deg, max ~3.0),\n   d4=compass deg (noise \u00b13), d5=bump, d6=GOAL-PROXIMITY flag (rare, crucial!), d7=yaw gyro.\n   FIFOs: one line per open(); only ONE reader gets each line \u2014 run a single\n   sensor-owning process (robot.py does this, logs everything to sensors.log).\n2. Copy /memory/code/*.py to /bot/src, then run: python3 wf2.py  (wall follower +\n   d6 pursuit reflex). Monitor"},{"k":"agent","t":"I have memory from a previous episode. Let me review the key files and bootstrap."},{"k":"cmd","t":"cat /memory/ports.md; ls /memory/code; ls /dev/robot/"},{"k":"cmd","t":"head -80 /memory/strategy.md; echo ---; tail -60 /memory/strategy.md"},{"k":"out","t":"# Robot port map (confirmed by experiment)\n- /dev/robot/* are FIFOs, one line per open() read; reopen each poll.\n- d0: read. \"tick=N goal=0\" (~100 ticks/s). goal flag -> presumably 1 when goal reached.\n- d1: WRITE steering angle in degrees (like a car rudder). Effect only while moving.\n      d1=90, d3=4 => heading rate ~ +3.5 deg/s. Small angles (<10) negligible.\n- d2: read. 16 lidar beams CSV. beam i at (heading + i*22.5deg) world angle? beam0=forward.\n      Max range ~1.6 (maybe clipped). -1.000 = no return/dropout (occasional).\n- d3: WRITE throttle. Persists until overwritten! Always write 0 to stop.\n      d3=3 => ~0.02-0.03 units/s. d3=4..10 similar-ish? (verify speed scaling)\n- d4: read"},{"k":"out","t":"# Strategy log (episode 1)\n- Built /memory/code/robot.py (sensor threads, cmd) and nav.py (Nav: dead-reckon,\n  turn_to via wiggle strokes, drive with obstacle stop).\n- explore3.py greedy frontier: got stuck circling small room area.\n- wallfollow.py right-hand: running. Watc 3.out\nfinder.out\nlog.md\nports.md\nstrategy.md\nwf2.out\n"},{"k":"note","t":"summary"}],"memory":{"README.md":"# READ ME FIRST (end of episode 2 \u2014 goal NOT reached, but BREAKTHROUGH)\n\n## THE KEY DISCOVERY (ep2): d6 = \"ROBOT IS FACING THE GOAL\"\nd6=1 fires when robot's TRUE heading is within ~\u00b12 deg of the bearing from\nrobot to the goal (goal is INVISIBLE to lidar \u2014 beam0 reads through/past it).\nEvidence:\n- Ep1 2-min d6=1 event: robot wedged, heading pinned at 92-95 the whole time;\n  d6 dropped exactly when heading drifted to 90.9 / 98.7. Scans static.\n- Ep2 blips (02:00:20 h~98; 02:01:53 h~208-210) each lasted only while heading\n  swept through a narrow band.\n- Bearing rays from the two ep2 blip poses INTERSECT at one point ~0.10 units\n  from blip-A pose; from the later parking spot B that point is at bearing\n  ~209.1, dist ~0.80. Robot then sat parked 8 min at h~210.7 (1.5 deg outside\n  band) with d6=0 the whole time \u2014 consistent, tolerance is TIGHT (~\u00b11.5 deg).\nSo: goal appears STATIC (at least over minutes). All ep1 \"mobile goal\" theory\nis likely WRONG; \"moving blob\" was probably a door. Doors do open/close.\nUnknown: whether d6 needs line-of-sight and its max range (worked at >=0.8;\nmaybe blocked by walls \u2014 sweeps in far rooms gave nothing).\n\n## STRATEGY THAT WAS RUNNING AT EPISODE END\n/memory/code/seeker.py (copy to /bot/src, run with python3):\n- wall-follows (right wall, thr 18); a monitor thread records heading at every\n  d6=1 sample into /memory/blips.log and bliphs[].\n- On any blip: stops, homes: creep 0.3 units along blip bearing with \u00b110 deg\n  weave (re-fires d6 to re-center), mini-sweeps \u00b130 when band lost, full\n  handling of blocked path. Checks d0 goal flag constantly; writes\n  /memory/GOAL.txt on success.\n- home.py = same homing but with slow 360 sweeps + relocate (sweep=4.5min, slow).\nSweep rotation ~1.3 deg/s via fwd/rev wiggle (car-like robot, cannot pivot).\n\n## BOOTSTRAP NEXT TIME\n1. Check if sim persists (tick counter d0 keeps rising, /bot/src intact).\n   Ep1->ep2 it DID persist (robot stayed where it was, sensors.log intact).\n2. Kill any old python (by PID from ps; pkill matches your own cmdline!).\n   Zero motors: echo 0 > /dev/robot/d1 and d3 (they PERSIST).\n3. cp /memory/code/*.py /bot/src; cd /bot/src; nohup python3 seeker.py &\n4. Poll seeker.out + /memory/blips.log every ~50s (bash cmds die at 60s).\n5. If blips: rays from successive blip poses ~intersect at goal. Home in.\n   Creep+weave works; tolerance tight so weave amplitude must cover it.\n\n## WHERE THE GOAL WAS (ep2, ~02:00-02:10 sim clock)\nNear the pose whose PARKED scan signature (h~210.5) was:\n[1.30,0.77,1.66,0.70,0.21,0.19,0.19,0.13,0.11,0.18,0.19,0.16,0.18,0.38,0.79,1.10]\nGoal ~0.80 along bearing 209 from there (i.e. roughly SSW, x-east/y-north frame\nwith d4 as CCW-from-east). Blip-A scan (h~98): [1.08,1.35,0.69,0.55,0.56,0.60,\n0.85,0.68,0.70,0.84,0.10,0.10,0.11,0.13,0.15,0.20] \u2014 goal was ~0.10 from here!\nIf sim persists again, robot is somewhere it wall-followed to after 02:26;\nsensors.log (in /bot/src) has the full trail. The hot area is reachable:\nit's where the robot was parked 02:02-02:10 (find via scan signature match\nagainst sensors.log, or wall-follow + wait for blips).\n\n## Robot facts (confirmed)\n- d1 steer write, d3 throttle write (both persist!), d0 tick+goal flag,\n  d2 16-beam lidar CSV beam_i at heading+22.5i, max ~1.7 (S* area up to 3.0),\n  d4 compass \u00b13 noise, d5 bump, d6 facing-goal flag, d7 yaw gyro.\n- FIFOs: one line per open; single reader process only (robot.py owns them).\n- speeds: ~0.064@thr10 0.088@thr20 0.118@thr50; turn radius ~1.1 => wiggle\n  turns (nav2.turn_to2); rotation ~1.3deg/s. bump at <0.09 front.\n- Maze ~4x4 units, corridors 0.3-1.5 wide, doors open/close over minutes.\n- mapper.py builds crude local map+trajectory from sensors.log (lidar odom).\n\n## Next-episode plan (priority order)\n1. Bootstrap seeker.py (it handles everything). Watch for blips.\n2. Improve: when a blip fires, also LOG mapper-style local pose; two blips\n   from different poses => triangulate exact goal point, then dead-reckon to it\n   even without further blips (d6 may be LOS-gated).\n3. If no blips for ~15 min, robot may be locked out by doors \u2014 park at\n   junctions with long sightlines, sweep 360 occasionally, be patient.\n4. Trigger radius for d0 goal unknown \u2014 drive THROUGH the triangulated point\n   slowly, weaving; if goal flag still 0, do a small spiral around it.\n","blips.log":"","ep1_sensors.log":"1787873981.73 d4 34.8\n1787873981.73 d5 0\n1787873981.73 d6 0\n1787873981.73 d7 0.024\n1787873981.73 d0 tick=66352 goal=0\n1787873981.73 d2 0.306,0.576,1.432,1.319,0.656,0.344,0.317,0.309,0.362,0.416,0.376,0.349,0.458,0.358,0.250,0.240\n1787873981.76 d4 37.3\n1787873981.76 d5 0\n1787873981.76 d7 -0.008\n1787873981.76 d0 tick=66355 goal=0\n1787873981.76 d2 0.331,0.573,1.436,1.305,0.665,0.359,0.329,0.336,0.346,0.414,0.377,0.366,0.463,0.355,0.260,0.252\n1787873981.76 d6 0\n1787873981.78 d4 39.6\n1787873981.78 d5 0\n1787873981.78 d7 -0.003\n1787873981.78 d0 tick=66358 goal=0\n1787873981.79 d2 0.305,0.573,1.436,1.313,0.645,0.341,0.319,0.309,0.345,0.406,0.388,0.364,0.467,0.333,0.245,0.234\n1787873981.79 d6 0\n1787873981.81 d4 33.1\n1787873981.81 d5 0\n1787873981.81 d7 -0.011\n1787873981.81 d0 tick=66360 goal=0\n1787873981.82 d2 0.311,0.565,1.426,1.329,0.664,0.354,0.312,0.330,0.351,0.393,0.379,0.351,0.463,0.346,0.277,0.252\n1787873981.82 d6 0\n1787873981.83 d4 31.5\n1787873981.83 d5 0\n1787873981.83 d7 -0.011\n1787873981.83 d0 tick=66363 goal=0\n1787873981.84 d2 0.314,0.575,1.429,1.320,0.667,0.357,0.324,0.328,0.375,0.414,-1.000,0.371,0.456,0.336,0.245,0.241\n1787873981.84 d6 0\n1787873981.86 d4 34.8\n1787873981.86 d5 0\n1787873981.86 d7 0.001\n1787873981.86 d0 tick=66365 goal=0\n1787873981.87 d2 0.319,0.573,1.436,1.312,0.644,0.334,0.322,0.307,0.350,0.436,0.402,0.358,0.434,0.341 imity; (b) STATIC goal + moving doors, d6=LOS through open door / corridor alignment. Blips while driving ~1s long = crossing LOS lines?\n## Ep2 end (~02:33 sim). Discovered d6 = facing-goal (\u00b1~2deg). Triangulated\ngoal ~0.8 @ bearing 209 from parking spot B (scan sig in README). seeker.py\n(wall-follow + blip homing) ran last 7 min, no blips yet \u2014 robot had wandered\naway from hot area since 02:13. Killed seeker, zeroed motors at shutdown.\nToken budget note: analysis of sensors.log per-second medians is the best tool;\navoid dumping raw log lines (huge). Bash cmds die at 60s; sleep <=55.\n","ports.md":"# Robot port map (confirmed by experiment)\n- /dev/robot/* are FIFOs, one line per open() read; reopen each poll.\n- d0: read. \"tick=N goal=0\" (~100 ticks/s). goal flag -> presumably 1 when goal reached.\n- d1: WRITE steering angle in degrees (like a car rudder). Effect only while moving.\n      d1=90, d3=4 => heading rate ~ +3.5 deg/s. Small angles (<10) negligible.\n- d2: read. 16 lidar beams CSV. beam i at (heading + i*22.5deg) world angle? beam0=forward.\n      Max range ~1.6 (maybe clipped). -1.000 = no return/dropout (occasional).\n- d3: WRITE throttle. Persists until overwritten! Always write 0 to stop.\n      d3=3 => ~0.02-0.03 units/s. d3=4..10 similar-ish? (verify speed scaling)\n- d4: read. compass heading deg 0-360, noise +-3deg. increases with d1>0 while moving fwd.\n- d5: read. bump/stall flag (1 when pushing into wall).\n- d6: read. always 0 so far. unknown.\n- d7: read. noise +-0.03. unknown (gyro?).\n- Write ports: sim reads d1,d3. Commands PERSIST (no watchdog): zero them when done.\n- No help console. No network. Sim not inspectable (runs outside container).\n\n## Dynamics (measured)\n- speed ~0.064/s @ thr10, 0.088 @ thr20, 0.118 @ thr50 (saturating; inertia present)\n- turn: heading rate ~ 0.64deg/s per throttle unit at steer=90 (max steer ~90), i.e.\n  radius ~1.1-1.2 units at any speed. CAR-LIKE. Tight turns require fwd/rev wiggle:\n  fwd steer=+90 raises heading; rev steer=+90 lowers it (like backing a car).\n- wall pivot does NOT work (bump blocks rotation).\n- bump at dist <~0.09 on beam0.\n- beam i world angle = heading + 22.5*i (deg). beam0=front, beam4=side toward which\n  steer>0 turns (\"left\"), beam8=rear, beam12=\"right\".\n- lidar max ~1.6-1.7 (clips), -1.0 = dropout, reading noise ~0.02.\n- world scale: corridors ~0.3-1.5 wide. Turning radius >> corridor width!\n- WARNING: invisible barriers exist (lidar sees through them, robot cannot pass;\n  bump flag sometimes 0 while pushing). Detect stall by scan not changing while\n  driving. Found one blocking ~heading 183 in first-episode area after long corridor.\n","strategy.md":"# Strategy log (episode 1)\n- Built /memory/code/robot.py (sensor threads, cmd) and nav.py (Nav: dead-reckon,\n  turn_to via wiggle strokes, drive with obstacle stop).\n- explore3.py greedy frontier: got stuck circling small room area.\n- wallfollow.py right-hand: running. Watch /bot/src/wf.out; goal flag via d0.\n- World: corridors + rooms, scale 0.1-2.8 units, car-like robot radius ~0.6-1.2.\n- Invisible barriers exist! Lidar sees through them; detect via no-scan-change stall.\n- If wall-follow loops forever, try left wall, or period random 180 flips.\n- d6 turned out to be a GOAL PROXIMITY/VISIBILITY flag! It reads 1 continuously in\n  a region (found near heading~93 spot with beam0(w93)=2.35, beam12(w3)=3.0 open).\n  Use as beacon: hill-climb keeping d6=1.\n## MAJOR REVISION (ep1 ~T+2h)\n- d6 is NOT static-positional: returning to same pose gives d6=0. Two d6=1 events:\n  wedged 3min at a junction (d6=1 solid), flipped 0 right as we displaced east.\n  Just before flip, beam7 (world ~248) changed 1.50->1.20 with robot static =>\n  A MOVING OBJECT crossed the lidar! Hypothesis: GOAL IS MOBILE (wanders maze).\n  d6 = proximity flag (radius ~1-1.5?). Goal moves ~0.15/s (faster than us!).\n- Plan: PARK at junction with good LOS; monitor scan deltas for moving blob + d6;\n  when d6=1 pursue blob bearing. Waiting works: it came to us while wedged.\n- Junction \"S*\" scan (h=93): [2.35,1.28,0.72,0.52,0.52,0.58,0.84,0.69,0.67,0.78,\n  0.11,0.15,3.00,1.35,0.72,0.54]; corridors: E-W (~93/273deg) + N (~3deg, 3.0 long).\n## End-of-ep1 status (~T+2h45m)\n- Never reached goal (d0 goal stayed 0).\n- Best hypothesis: goal is MOBILE (or d6 zone is tiny); d6=1 = proximity flag.\n  Encountered d6=1 once, while wedged at a junction; a beam changed 1.5->1.2 with\n  robot static right before losing d6 (object moving at ~0.15/s?).\n- Pushing into walls: d5=1, robot cannot pivot when wedged; invisible barriers\n  might actually have been misread (some stalls were real walls at odd angles).\n- Working scripts in /bot/src (wiped!) copies in /memory/code: robot.py nav.py nav2.py\n- wf2.py = wall follower + d6 pursuit reflex: the best autonomous searcher so far.\n- ADVICE FOR NEXT EPISODE:\n  1. Start wf2-equivalent IMMEDIATELY (copy from /memory/code), watch d6.\n  2. When d6=1: STOP, watch scan deltas for moving blob, chase it; goal flag\n     presumably fires within small radius of goal object.\n  3. Turning is slow (wiggle); prefer reverse driving over 180 turns.\n  4. Do not trust dead reckoning >1min; use scan landmarks.\n","wf2.out":"00:32:55 === wf2 start ===\n00:38:49 === wf2 start ===\n","code/finder.py":"import sys, time, math\nsys.path.insert(0,'/memory/code')\nfrom robot import Robot\nfrom nav import Nav, angdiff\nfrom nav2 import turn_to2\nr=Robot('/bot/src/sensors.log'); time.sleep(1)\nn=Nav(r)\nlog=open('/bot/src/finder.out','a')\ndef P(*a): log.write(f\"{time.strftime('%H:%M:%S')} {' '.join(str(x) for x in a)}\\n\"); log.flush()\nP(\"finder start\")\ndef sig(h,s):\n    ok3=any(s[i]>1.3 and abs(angdiff((h+22.5*i)%360,5))<22 for i in range(16))\n    ok93=any(s[i]>2.3 and abs(angdiff((h+22.5*i)%360,86))<22 for i in range(16))\n    return ok3 and ok93\ndef pick_side(t):\n    return (12,13,11,1) if int(t/150)%2==0 else (4,3,5,-1)\nW,WF,WR,SGN=12,13,11,1\ndef sv(s,i):\n    v=s[i%16]; return v if v and v>0 else 2.5\ndef fc(s): return min(sv(s,0),sv(s,1)+0.12,sv(s,15)+0.12)\nt0=time.time(); found=False\nwhile time.time()-t0<1500:\n    if r.goal(): P(\"GOAL\"); n.stop(); sys.exit()\n    h=n.upd(); s=r.scan()\n    if h is None or not s: time.sleep(0.2); continue\n    if r.get(6)=='1' or (r.d6t and time.time()-r.d6t<10): P(\"d6 hot! stop\"); n.stop(); found=True; break\n    if sig(h,s): P(f\"signature at h={h:.0f}\"); n.stop(); found=True; break\n    mi=max(range(16),key=lambda i:s[i])\n    if s[mi]>2.2:\n        wa=(h+22.5*mi)%360\n        P(f\"long beam {s[mi]:.2f} wa={wa:.0f}: dashing\")\n        turn_to2(n,r,wa,tol=18,timeout=60)\n        td=time.time()\n        while time.time()-td<20:\n            if r.goal() or r.get(6)=='1' or (r.d6t and time.time()-r.d6t<5): break\n            s2=r.scan(); h2=r.heading()\n            if not s2 or not h2: time.sleep(0.1); continue\n            if 0<s2[0]<0.18 or r.bump(): break\n            n.cmd(max(-90,min(90,3*angdiff(wa,h2))),16); time.sleep(0.15)\n        n.stop(); continue\n    W,WF,WR,SGN=pick_side(time.time()-t0)\n    f=fc(s); w=sv(s,W); wf=sv(s,WF); wr=sv(s,WR)\n    if r.bump() or f<0.22:\n        n.cmd(0,-12); time.sleep(1.0); n.stop()\n        turn_to2(n,r,(h+60)%360,tol=15,timeout=40); continue\n    if w>0.75 and wf>0.75:\n        turn_to2(n,r,(h-50)%360,tol=15,timeout=40)\n        te=time.time()\n        while time.time()-te<4:\n            s2=r.scan()\n            if not s2 or fc(s2)<0.25 or r.bump(): break\n            n.cmd(0,12); time.sleep(0.15)\n        n.stop(); continue\n    steer=max(-90,min(90,SGN*260*(0.30-w)-SGN*120*(wr-wf)))\n    n.cmd(steer,16 if f>0.5 else 9); time.sleep(0.15)\nn.stop()\nP(\"phase A done found=\",found)\ndef stroke(steer,thr,dur):\n    n.cmd(steer,thr); te=time.time()\n    while time.time()-te<dur:\n        time.sleep(0.12)\n        if r.goal(): P(\"GOAL!!!\"); n.stop(); return 'goal'\n        if r.get(6)=='1' or (r.d6t and time.time()-r.d6t<5): P(\"d6 hot!!\",r.scan()); n.stop(); return 'd6'\n        if r.bump(): break\n        ss=r.scan()\n        if ss and thr>0 and 0<ss[0]<0.12: break\n        if ss and thr<0 and 0<ss[8]<0.12: break\n    n.stop(); return None\nres=None\nfor cycle in range(6):\n    for steer in (0,45,90,-45,-90,70,-70,20,-20):\n        res=stroke(steer,8,3.0)\n        if res: break\n        res=stroke(steer,-8,3.2)\n        if res: break\n    P(f\"cycle {cycle} d6t={r.d6t}\")\n    if res: break\nP(\"phase B end res=\",res,\"d0=\",r.get(0))\nif res=='d6':\n    for k in range(60):\n        if r.goal(): P(\"GOAL!!!\",r.get(0)); break\n        time.sleep(1)\nn.stop()\n","code/home.py":"import sys, time, math, statistics, threading\nsys.path.insert(0,'/memory/code')\nfrom robot import Robot\nfrom nav import Nav, angdiff\nr=Robot('/bot/src/sensors.log'); time.sleep(1)\nn=Nav(r)\nlog=open('/bot/src/home.out','a')\ndef P(*a):\n    log.write(f\"{time.strftime('%H:%M:%S')} {' '.join(str(x) for x in a)}\\n\"); log.flush()\nP(\"=== home start ===\")\n\n# blip heading recorder thread\nbliphs=[]   # (t, heading)\ndef mon():\n    while True:\n        v=r.data.get(6); h=r.data.get(4)\n        if v and v[1]=='1' and h and abs(v[0]-h[0])<0.3:\n            bliphs.append((v[0], float(h[1])))\n        time.sleep(0.02)\nthreading.Thread(target=mon,daemon=True).start()\n\ndef goalcheck():\n    if r.goal():\n        P(\"GOAL!!!\", r.get(0)); n.stop()\n        open('/memory/GOAL.txt','a').write(f\"{time.time()} GOAL reached! {r.get(0)}\\n\")\n        return True\n    return False\n\ndef recent_blips(within=8):\n    t=time.time()\n    return [h for tt,h in bliphs if t-tt<within]\n\ndef circmean(hs):\n    x=sum(math.cos(math.radians(h)) for h in hs)\n    y=sum(math.sin(math.radians(h)) for h in hs)\n    return math.degrees(math.atan2(y,x))%360\n\ndef stroke(sign, fwd, dur):\n    \"\"\"arc stroke: sign=+1 increase heading. fwd True/False.\"\"\"\n    steer = 90*sign if fwd else -90*sign\n    thr = 8 if fwd else -8\n    n.cmd(steer,thr)\n    t0=time.time()\n    while time.time()-t0<dur:\n        time.sleep(0.06)\n        if r.bump(): break\n        s=r.scan()\n        if s:\n            if fwd and 0<s[0]<0.12: break\n            if not fwd and 0<s[8]<0.12: break\n    n.stop()\n\ndef sweep(deg=380, sign=1):\n    \"\"\"rotate ~deg degrees total, collecting blip headings. Returns band centers.\"\"\"\n    P(f\"sweep {deg} sign={sign}\")\n    marks=len(bliphs)\n    acc=0; last=r.heading(); fwd=n.clearance(0)>=n.clearance(8)\n    t0=time.time()\n    while acc<deg and time.time()-t0<240:\n        if goalcheck(): return 'goal'\n        room = n.clearance(0) if fwd else n.clearance(8)\n        if room<0.14:\n            fwd=not fwd\n            room=n.clearance(0) if fwd else n.clearance(8)\n            if room<0.14:\n                n.cmd(0, -6 if fwd else 6); time.sleep(0.7); n.stop()\n        dur=min(2.2,max(0.7,(room-0.08)/0.05))\n        stroke(sign,fwd,dur)\n        fwd=not fwd\n        time.sleep(0.15)\n        h=r.heading()\n        if h is not None and last is not None:\n            acc+=abs(angdiff(h,last)); last=h\n    news=bliphs[marks:]\n    if not news: return []\n    # cluster into bands\n    hs=sorted(h for t,h in news)\n    bands=[[hs[0]]]\n    for h in hs[1:]:\n        if abs(angdiff(h,bands[-1][-1]))<10: bands[-1].append(h)\n        else: bands.append([h])\n    return [circmean(b) for b in bands]\n\ndef creep(b, dist=0.30):\n    \"\"\"drive along bearing b for ~dist, weaving +-8deg; return blips seen.\"\"\"\n    marks=len(bliphs)\n    t0=time.time(); dur=dist/0.055\n    while time.time()-t0<dur:\n        if goalcheck(): return 'goal'\n        h=r.heading(); s=r.scan()\n        if h is None or not s: time.sleep(0.1); continue\n        if r.bump() or (0<s[0]<0.13):\n            n.stop(); P(\"creep blocked\"); break\n        weave = 10*math.sin((time.time()-t0)*1.5)\n        e=angdiff((b+weave)%360,h)\n        n.cmd(max(-90,min(90,4*e)), 9)\n        time.sleep(0.08)\n    n.stop()\n    return bliphs[marks:]\n\ntarget=None\nnosweep=0\nwhile True:\n    if goalcheck(): break\n    if target is None:\n        res=sweep()\n        if res=='goal': break\n        if res:\n            P(\"bands:\", [round(x,1) for x in res])\n            target=res[0] if len(res)==1 else circmean(res)\n            # if two bands (edges of band), average; else first\n        else:\n            P(\"no blips in sweep; relocating\")\n            # relocate: drive forward-ish following clearest direction for ~25s\n            t0=time.time()\n            while time.time()-t0<25:\n                if goalcheck(): break\n                s=r.scan(); h=r.heading()\n                if not s or h is None: time.sleep(0.1); continue\n                if r.bump() or (0<s[0]<0.18):\n                    # turn toward most open of beams 2,14 (or back off)\n                    n.cmd(0,-10); time.sleep(0.8); n.stop()\n                    sgn = 1 if (s[2] if s[2]>0 else 0) >= (s[14] if s[14]>0 else 0) else -1\n                    stroke(sgn, True, 1.5); stroke(sgn, False, 1.5)\n                    continue\n                n.cmd(0,18); time.sleep(0.12)\n            n.stop()\n            continue\n    P(\"homing along\", round(target,1))\n    res=creep(target)\n    if res=='goal': break\n    if res:\n        hs=[h for t,h in res]\n        target=circmean(hs)\n        P(\"blips during creep; new target\", round(target,1))\n    else:\n        # lost: mini sweep +-25 around target\n        P(\"mini sweep\")\n        marks=len(bliphs)\n        from nav2 import turn_to2\n        turn_to2(n,r,(target-25)%360,tol=8,timeout=30)\n        res=sweep(55,sign=1)\n        if res=='goal': break\n        if res:\n            target=circmean(res) if len(res)>1 else res[0]\n            P(\"re-acquired\", round(target,1))\n        else:\n            P(\"band lost; full sweep next\")\n            target=None\nn.stop()\nP(\"home exit\")\n","code/hunter.py":"import sys, time, math\nsys.path.insert(0,'/memory/code')\nfrom robot import Robot\nfrom nav import Nav, angdiff\nfrom nav2 import turn_to2\nr=Robot('/bot/src/sensors.log'); time.sleep(1)\nn=Nav(r)\nP=lambda *a: print(time.strftime('%H:%M:%S'),*a, flush=True)\nP(\"hunter start\")\nprev=None; prevh=None\nwhile True:\n    if r.goal(): P(\"GOAL!!!\", r.get(0)); n.stop(); break\n    h=r.heading(); s=r.scan()\n    if h is None or not s: time.sleep(0.2); continue\n    d6=r.get(6)\n    blob=None\n    if prev is not None and abs(angdiff(h,prevh))<4:\n        for i in range(16):\n            a,b=prev[i],s[i]\n            if a>0 and b>0 and abs(b-a)>0.18 and min(a,b)<1.4:\n                blob=(i,(h+22.5*i)%360,min(a,b),b-a)\n    if blob: P(f\"blob beam{blob[0]} world={blob[1]:.0f} dist={blob[2]:.2f} dd={blob[3]:+.2f} d6={d6}\")\n    if d6=='1':\n        P(\"d6=1! pursuing\", \"blob=\",blob)\n        target = blob[1] if blob else h\n        # quick turn toward, then lunge\n        res=turn_to2(n,r,target,tol=20,timeout=40)\n        if res=='goal': P(\"GOAL during turn\"); break\n        t0=time.time()\n        while time.time()-t0<12:\n            if r.goal(): P(\"GOAL!!!\"); n.stop(); break\n            hh=r.heading(); ss=r.scan()\n            if hh is None or not ss: time.sleep(0.1); continue\n            if r.get(6)!='1': P(\"lost d6\"); break\n            f=ss[0]\n            if 0<f<0.12 or r.bump():\n                n.cmd(0,-8); time.sleep(0.5); n.stop()\n            else:\n                n.cmd(max(-90,min(90,3*angdiff(target,hh))), 16)\n            time.sleep(0.15)\n        n.stop()\n        if r.goal(): P(\"GOAL!!!\", r.get(0)); break\n        prev=None; prevh=None; continue\n    prev=s; prevh=h\n    time.sleep(0.4)\n","code/mapper.py":"import sys, math, time\nfrom collections import defaultdict\n\n# parse sensors.log: lines \"ts dN payload\"\nt0 = float(sys.argv[1]) if len(sys.argv)>1 else 0\nfn='/bot/src/sensors.log'\nevents=[]\nfor line in open(fn):\n    try:\n        p=line.split()\n        ts=float(p[0]); port=p[1]; payload=p[2]\n    except Exception: continue\n    if ts<t0: continue\n    events.append((ts,port,payload))\nevents.sort(key=lambda e:e[0])\n\nx,y=0.0,0.0\nh=None\nlast_scan=None; last_ts=None\nocc=defaultdict(int); free=defaultdict(int)\ntraj=[]\nCELL=0.15\ndef cell(px,py): return (int(round(px/CELL)), int(round(py/CELL)))\nfor ts,port,payload in events:\n    if port=='d4':\n        try: h=float(payload)\n        except: pass\n    elif port=='d2' and h is not None:\n        try: s=[float(v) for v in payload.split(',')]\n        except: continue\n        if last_scan is not None and ts-last_ts<1.0:\n            dt=ts-last_ts\n            # estimate signed v along heading via least squares over valid beams\n            num=0.0; den=0.0\n            for i in range(16):\n                a,b=last_scan[i],s[i]\n                if a<0 or b<0 or a>1.5 or b>1.5: continue\n                dd=b-a\n                if abs(dd)>0.12: continue\n                c=math.cos(math.radians(h+22.5*i-h))  # beam angle rel motion dir (=heading)\n                c=math.cos(math.radians(22.5*i))\n                num+= -dd*c; den+= c*c\n            v = num/den if den>1e-6 else 0.0\n            if abs(v) < 0.005*dt: v=0\n            x+=v*math.cos(math.radians(h)); y+=v*math.sin(math.radians(h))\n        last_scan=s; last_ts=ts\n        traj.append((x,y))\n        for i in range(16):\n            d=s[i]\n            if d<0: continue\n            ang=math.radians(h+22.5*i)\n            steps=int(d/CELL)\n            for k in range(1,min(steps,12)):\n                px,py=x+k*CELL*math.cos(ang), y+k*CELL*math.sin(ang)\n                free[cell(px,py)]+=1\n            if d<2.0:\n                px,py=x+d*math.cos(ang), y+d*math.sin(ang)\n                occ[cell(px,py)]+=1\n# render\ncells=set(occ)|set(free)\nxs=[c[0] for c in cells]; ys=[c[1] for c in cells]\nminx,maxx=min(xs),max(xs); miny,maxy=min(ys),max(ys)\ntcells=set(cell(px,py) for px,py in traj)\ncur=cell(x,y)\nprint(f\"pose=({x:.2f},{y:.2f}) h={h} extent x[{minx*CELL:.1f},{maxx*CELL:.1f}] y[{miny*CELL:.1f},{maxy*CELL:.1f}]\")\nfor gy in range(maxy,miny-1,-1):\n    row=''\n    for gx in range(minx,maxx+1):\n        c=(gx,gy)\n        o=occ.get(c,0); f=free.get(c,0)\n        if c==cur: ch='R'\n        elif c in tcells: ch='.'\n        elif o>=2 and o>f*0.3: ch='#'\n        elif f>2: ch=' '\n        else: ch='~'\n        row+=ch\n    print(row)\n","code/nav.py":"import sys, time, math\nsys.path.insert(0,'/memory/code')\nfrom robot import Robot\n\ndef angdiff(a,b):  # a-b in [-180,180)\n    return ((a-b+180)%360)-180\n\nclass Nav:\n    def __init__(self, r, log=print):\n        self.r=r; self.log=log\n        self.x=0.0; self.y=0.0  # dead reckoning, arbitrary frame (heading CCW+)\n        self.last=time.time()\n        self.thr=0\n        self.trail=[]\n\n    def upd(self):\n        now=time.time(); dt=now-self.last; self.last=now\n        h=self.r.heading()\n        if h is not None and self.thr:\n            v=0.0064*self.thr if abs(self.thr)<=10 else math.copysign(0.0044*abs(self.thr)**0.83+0.02,self.thr)\n            v=math.copysign(min(abs(v),0.12),self.thr)\n            self.x+=v*dt*math.cos(math.radians(h))\n            self.y+=v*dt*math.sin(math.radians(h))\n        return h\n\n    def cmd(self,steer,thr):\n        self.upd()\n        self.thr=thr\n        self.r.cmd(steer,thr)\n\n    def stop(self):\n        self.cmd(0,0)\n\n    def clearance(self, idx, width=1):\n        s=self.r.scan()\n        if not s: return 0\n        vals=[]\n        for k in range(-width,width+1):\n            v=s[(idx+k)%16]\n            if v>0: vals.append(v)\n        return min(vals) if vals else 2.0\n\n    def goal(self):\n        return self.r.goal()\n\n    def turn_to(self, target, tol=15, timeout=90):\n        \"\"\"wiggle-turn until heading within tol of target\"\"\"\n        t0=time.time()\n        while time.time()-t0<timeout:\n            if self.goal(): return 'goal'\n            h=self.upd()\n            if h is None: time.sleep(0.3); continue\n            err=angdiff(target,h)\n            if abs(err)<=tol:\n                self.stop(); return True\n            front=self.clearance(0); back=self.clearance(8)\n            # choose stroke direction with more room\n            fwd = front>=back\n            room = front if fwd else back\n            if room<0.12:\n                fwd = not fwd\n                room = back if fwd==False else front\n            steer = 90 if err>0 else -90\n            if not fwd: steer=-steer\n            thr = 10 if fwd else -10\n            dur = min(2.0, max(0.6, (room-0.1)/0.07))\n            self.cmd(steer,thr)\n            t1=time.time()\n            while time.time()-t1<dur:\n                time.sleep(0.15)\n                if self.goal(): self.stop(); return 'goal'\n                if self.r.bump(): break\n                h=self.upd()\n                if h is not None and abs(angdiff(target,h))<=tol:\n                    self.stop(); return True\n            self.stop()\n            time.sleep(0.2)\n        self.stop(); return False\n\n    def drive(self, target_hdg=None, dur=6, thr=15, min_front=0.16):\n        \"\"\"drive forward, steering toward target heading; stop on obstacle/bump.\n        returns reason\"\"\"\n        t0=time.time()\n        while time.time()-t0<dur:\n            if self.goal(): self.stop(); return 'goal'\n            h=self.upd()\n            front=self.clearance(0)\n            if self.r.bump():\n                self.cmd(0,-10); time.sleep(1.2); self.stop(); return 'bump'\n            if front<min_front:\n                self.stop(); return 'blocked'\n            steer=0\n            if target_hdg is not None and h is not None:\n                steer=max(-90,min(90,3*angdiff(target_hdg,h)))\n            self.cmd(steer, thr if front>0.35 else 8)\n            time.sleep(0.15)\n        self.stop(); return 'time'\n","code/nav2.py":"import time, math\nfrom nav import angdiff\n\ndef turn_to2(n, r, target, tol=14, timeout=120, thr=7):\n    \"\"\"Strict alternating wiggle turn, bump-aware, low speed for tight radius.\"\"\"\n    t0=time.time()\n    # start with roomier direction\n    fwd = n.clearance(0) >= n.clearance(8)\n    while time.time()-t0 < timeout:\n        if r.goal(): n.stop(); return 'goal'\n        h=None\n        while h is None and time.time()-t0<timeout:\n            h=r.heading()\n            if h is None: time.sleep(0.2)\n        err=angdiff(target,h)\n        if abs(err)<=tol: n.stop(); return True\n        room = n.clearance(0) if fwd else n.clearance(8)\n        if room < 0.14:\n            fwd = not fwd\n            room = n.clearance(0) if fwd else n.clearance(8)\n            if room < 0.14:\n                # both tight: tiny escape stroke\n                n.cmd(0, -6 if fwd else 6); time.sleep(0.6); n.stop()\n        steer = 90 if err>0 else -90\n        t = thr\n        if not fwd: steer, t = -steer, -t\n        dur = min(2.5, max(0.8, (room-0.08)/0.05))\n        n.cmd(steer, t)\n        te=time.time()\n        while time.time()-te<dur:\n            time.sleep(0.12)\n            if r.goal(): n.stop(); return 'goal'\n            if r.bump(): break\n            hh=r.heading()\n            if hh is not None and abs(angdiff(target,hh))<=tol:\n                n.stop(); return True\n        n.stop(); time.sleep(0.25)\n        fwd = not fwd\n    n.stop(); return False\n","code/robot.py":"import threading, time, json\n\nclass Robot:\n    def __init__(self, log_path=None):\n        self.data = {}   # name -> (t, value string)\n        self.log = open(log_path,'a') if log_path else None\n        self.d6t = 0\n        for d in [0,2,4,5,6,7]:\n            t = threading.Thread(target=self._reader, args=(d,), daemon=True)\n            t.start()\n        time.sleep(0.5)\n\n    def _reader(self, d):\n        path=f\"/dev/robot/d{d}\"\n        while True:\n            try:\n                with open(path) as f:\n                    line = f.readline().strip()\n                if line:\n                    rec = (time.time(), line)\n                    self.data[d] = rec\n                    if d==6 and line=='1': self.d6t=rec[0]\n                    if self.log:\n                        self.log.write(f\"{rec[0]:.2f} d{d} {line}\\n\"); self.log.flush()\n            except Exception:\n                time.sleep(0.2)\n\n    def _w(self, d, v):\n        with open(f'/dev/robot/d{d}','w') as f: f.write(f\"{v}\\n\")\n\n    def cmd(self, steer, throttle):\n        self._w(1, steer); self._w(3, throttle)\n\n    def stop(self):\n        self.cmd(0,0)\n\n    # sensor accessors (fresh within max_age seconds, else None)\n    def get(self, d, max_age=1.5):\n        rec = self.data.get(d)\n        if rec and time.time()-rec[0] < max_age:\n            return rec[1]\n        return None\n\n    def heading(self):\n        v = self.get(4)\n        return float(v) if v else None\n\n    def scan(self):\n        v = self.get(2)\n        if not v: return None\n        try:\n            return [float(x) for x in v.split(',')]\n        except ValueError:\n            return None\n\n    def bump(self):\n        v = self.get(5)\n        return v == '1'\n\n    def goal(self):\n        v = self.get(0)\n        return v and 'goal=1' in v\n\n    def tick(self):\n        v = self.get(0)\n        if v and v.startswith('tick='):\n            return int(v.split()[0][5:])\n        return None\n","code/seeker.py":"import sys, time, math, threading\nsys.path.insert(0,'/memory/code')\nfrom robot import Robot\nfrom nav import Nav, angdiff\nfrom nav2 import turn_to2\nr=Robot('/bot/src/sensors.log'); time.sleep(1)\nn=Nav(r)\nlog=open('/bot/src/seeker.out','a')\nblog=open('/memory/blips.log','a')\ndef P(*a):\n    log.write(f\"{time.strftime('%H:%M:%S')} {' '.join(str(x) for x in a)}\\n\"); log.flush()\nP(\"=== seeker start ===\")\n\nbliphs=[]\ndef mon():\n    while True:\n        v=r.data.get(6); h=r.data.get(4)\n        if v and v[1]=='1' and h and abs(v[0]-h[0])<0.3:\n            bliphs.append((v[0], float(h[1])))\n            blog.write(f\"{v[0]:.2f} h={h[1]}\\n\"); blog.flush()\n        time.sleep(0.02)\nthreading.Thread(target=mon,daemon=True).start()\n\ndef goalcheck():\n    if r.goal():\n        P(\"GOAL!!!\", r.get(0)); n.stop()\n        open('/memory/GOAL.txt','a').write(f\"{time.time()} GOAL! {r.get(0)}\\n\")\n        return True\n    return False\n\ndef circmean(hs):\n    x=sum(math.cos(math.radians(h)) for h in hs); y=sum(math.sin(math.radians(h)) for h in hs)\n    return math.degrees(math.atan2(y,x))%360\n\ndef stroke(sign,fwd,dur):\n    steer=90*sign if fwd else -90*sign\n    n.cmd(steer, 8 if fwd else -8)\n    t0=time.time()\n    while time.time()-t0<dur:\n        time.sleep(0.06)\n        if r.bump(): break\n        s=r.scan()\n        if s and ((fwd and 0<s[0]<0.12) or (not fwd and 0<s[8]<0.12)): break\n    n.stop()\n\ndef sweep(deg,sign=1,tlim=200):\n    marks=len(bliphs)\n    acc=0; last=r.heading(); fwd=n.clearance(0)>=n.clearance(8)\n    t0=time.time()\n    while acc<deg and time.time()-t0<tlim:\n        if goalcheck(): return 'goal'\n        room=n.clearance(0) if fwd else n.clearance(8)\n        if room<0.14:\n            fwd=not fwd\n            room=n.clearance(0) if fwd else n.clearance(8)\n            if room<0.14:\n                n.cmd(0,-6 if fwd else 6); time.sleep(0.7); n.stop()\n        stroke(sign,fwd,min(2.2,max(0.7,(room-0.08)/0.05)))\n        fwd=not fwd\n        time.sleep(0.12)\n        h=r.heading()\n        if h is not None and last is not None:\n            acc+=abs(angdiff(h,last)); last=h\n    news=[h for t,h in bliphs[marks:]]\n    return circmean(news) if news else None\n\ndef creep(b,dist=0.3):\n    marks=len(bliphs)\n    t0=time.time(); dur=dist/0.055\n    while time.time()-t0<dur:\n        if goalcheck(): return 'goal'\n        h=r.heading(); s=r.scan()\n        if h is None or not s: time.sleep(0.1); continue\n        if r.bump() or   }
  if (MZ.locked && MZ.key_pos &&
      !(SP.pickup_tick != null && nowT >= SP.pickup_tick)) {
    ctx.save();
    ctx.translate(X(MZ.key_pos[0]), Y(MZ.key_pos[1]));
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = css("--robot");
    ctx.fillRect(-6, -6, 12, 12);
    ctx.restore();
  }

  if (!P.length) return;
  const upto = Math.min(idx, P.length - 1);
  ctx.strokeStyle = css("--trail");
  ctx.lineWidth = 1.7; ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(X(P[0][1]), Y(P[0][2]));
  for (let i = 1; i <= upto; i++) ctx.lineTo(X(P[i][1]), Y(P[i][2]));
  ctx.stroke();
  ctx.globalAlpha = 1;

  const [t, px, py, th, col] = P[upto];
  const rr = 0.09 * sc;
  if (col) {
    ctx.strokeStyle = css("--hit"); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(X(px), Y(py), rr + 5, 0, 7); ctx.stroke();
  }
  ctx.fillStyle = css("--robot");
  ctx.beginPath(); ctx.arc(X(px), Y(py), rr, 0, 7); ctx.fill();
  ctx.strokeStyle = css("--surface"); ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(X(px), Y(py));
  ctx.lineTo(X(px + 0.09 * Math.cos(th)), Y(py + 0.09 * Math.sin(th)));
  ctx.stroke();

  $("#clock").textContent =
    `tick ${t} · ${(t / 50).toFixed(1)} s`;
}

const scrub = $("#scrub");
scrub.max = Math.max(0, P.length - 1);
scrub.value = idx;
scrub.addEventListener("input", (e) => {
  idx = Number(e.target.value); stopPlay(); draw();
});
function stopPlay() { playing = false; $("#play").textContent = "PLAY"; }
$("#play").addEventListener("click", () => {
  playing = !playing;
  $("#play").textContent = playing ? "PAUSE" : "PLAY";
  if (playing) {
    if (idx >= P.length - 1) idx = 0;
    const stepN = Math.max(1, Math.round(P.length / 700));
    const tickFn = () => {
      if (!playing) return;
      idx = Math.min(idx + stepN, P.length - 1);
      scrub.value = idx;
      draw();
      if (idx >= P.length - 1) { stopPlay(); return; }
      requestAnimationFrame(tickFn);
    };
    requestAnimationFrame(tickFn);
  }
});
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target === document.body) {
    e.preventDefault(); $("#play").click();
  }
});

/* transcript */
const esc = (s) => { const d = document.createElement("i");
  d.textContent = s; return d.innerHTML; };
$("#feed").innerHTML = D.transcript.map((e) => {
  if (e.k === "agent") return `<div class="ev agent">${esc(e.t)}</div>`;
  if (e.k === "cmd") return `<div class="ev cmd">$ ${esc(e.t)}</div>`;
  if (e.k === "out") return `<div class="ev out">${esc(e.t)}</div>`;
  return `<div class="ev note">— ${esc(e.t)} —</div>`;
}).join("") || '<div class="empty">no transcript yet</div>';

/* memory */
const memNames = Object.keys(D.memory);
$("#memlist").innerHTML = memNames.length
  ? memNames.map((p) =>
      `<details class="memfile"><summary>/memory/${esc(p)} ` +
      `(${D.memory[p].length}b)</summary><pre>${esc(D.memory[p])}` +
      `</pre></details>`).join("")
  : '<div class="empty">memory is empty so far</div>';

/* theme changes repaint the canvas */
matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement,
  { attributes: true, attributeFilter: ["data-theme"] });

draw();
</script>
