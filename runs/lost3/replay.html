<title>Mazebot Drift Run</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #f7f6f3;
  --surface: #fcfcfb;
  --border: #e2e0da;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #8a897f;
  --robot: #2a78d6;
  --trail: #eb6834;
  --lidar: #1baf7a;
  --hit: #e34948;
  --goal: #008300;
  --chip: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141413;
    --surface: #1a1a19;
    --border: #33322e;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #8a897f;
    --robot: #3987e5;
    --trail: #d95926;
    --lidar: #199e70;
    --hit: #e66767;
    --goal: #35b135;
    --chip: #232320;
  }
}
:root[data-theme="dark"] {
  --ground: #141413;
  --surface: #1a1a19;
  --border: #33322e;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --ink-3: #8a897f;
  --robot: #3987e5;
  --trail: #d95926;
  --lidar: #199e70;
  --hit: #e66767;
  --goal: #35b135;
  --chip: #232320;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: Archivo, system-ui, sans-serif; font-size: 15px;
  line-height: 1.5;
}
header {
  padding: 20px 22px 14px; border-bottom: 1px solid var(--border);
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px;
}
h1 {
  font-family: "Martian Mono", monospace; font-size: 19px; margin: 0;
  letter-spacing: -0.02em;
}
.sub { color: var(--ink-2); font-size: 13.5px; }
.sub code { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 22px;
  border-bottom: 1px solid var(--border); }
.chip {
  background: var(--chip); border: 1px solid var(--border);
  border-radius: 4px; padding: 5px 11px; font-size: 12px;
  color: var(--ink-2); letter-spacing: 0.02em;
}
.chip b {
  font-family: "Martian Mono", monospace; font-size: 13px;
  color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums;
}
.chip.state-solved { border-color: var(--goal); color: var(--goal); }
.chip.state-live { border-color: var(--trail); color: var(--trail); }
main {
  display: grid; grid-template-columns: minmax(340px, 56%) 1fr;
  gap: 18px; padding: 18px 22px; align-items: start;
}
@media (max-width: 880px) { main { grid-template-columns: 1fr; } }
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
}
.panel-label {
  font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--ink-3); padding: 10px 14px 0;
}
#stage { padding: 8px 12px 4px; }
#cv { width: 100%; height: auto; display: block; }
.controls {
  display: flex; align-items: center; gap: 12px; padding: 8px 14px 14px;
}
button {
  font-family: "Martian Mono", monospace; font-size: 12px;
  background: var(--chip); color: var(--ink);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 7px 16px; cursor: pointer;
}
button:hover { border-color: var(--ink-3); }
button:focus-visible { outline: 2px solid var(--robot); outline-offset: 1px; }
input[type="range"] { flex: 1; accent-color: var(--trail); }
#clock {
  font-family: "Martian Mono", monospace; font-size: 12px;
  color: var(--ink-2); min-width: 150px; text-align: right;
  font-variant-numeric: tabular-nums;
}
.legend { display: flex; gap: 14px; padding: 0 14px 12px; flex-wrap: wrap;
  font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px;
  border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.col-right { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
#feed { max-height: 520px; overflow-y: auto; padding: 6px 14px 14px; }
.ev { margin: 10px 0; }
.ev.agent { font-size: 14px; }
.ev.agent::before {
  content: "AGENT"; display: block; font-size: 10px; letter-spacing: 0.09em;
  color: var(--ink-3); margin-bottom: 2px;
}
.ev.cmd, .ev.out {
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-word;
  padding: 7px 10px; border-radius: 4px;
}
.ev.cmd { background: var(--chip); border-left: 3px solid var(--robot); }
.ev.out { color: var(--ink-2); border-left: 3px solid var(--border);
  max-height: 150px; overflow-y: auto; }
.ev.note { color: var(--ink-3); font-style: italic; font-size: 13px;
  text-align: center; }
#memlist { padding: 6px 14px 14px; }
.memfile { margin: 8px 0; }
.memfile summary {
  font-family: "IBM Plex Mono", monospace; font-size: 12.5px;
  cursor: pointer; color: var(--ink); padding: 4px 0;
}
.memfile pre {
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-word; color: var(--ink-2);
  background: var(--chip); padding: 10px; border-radius: 4px; margin: 4px 0;
}
.empty { color: var(--ink-3); padding: 10px 14px 16px; font-size: 13px; }
footer { color: var(--ink-3); font-size: 12px; padding: 4px 22px 24px; }
</style>

<header>
  <h1>Mazebot Drift Run</h1>
  <span class="sub" id="subtitle"></span>
</header>
<div class="chips" id="chips"></div>
<main>
  <section class="panel">
    <div class="panel-label">Ground truth — top-down replay</div>
    <div id="stage"><canvas id="cv" width="960" height="960"></canvas></div>
    <div class="controls">
      <button id="play" aria-label="play or pause replay">PLAY</button>
      <input type="range" id="scrub" min="0" max="0" value="0"
        aria-label="replay position">
      <span id="clock"></span>
    </div>
    <div class="legend">
      <span><i style="background:var(--robot)"></i>robot</span>
      <span><i style="background:var(--trail)"></i>trail</span>
      <span><i style="background:var(--hit)"></i>collision</span>
      <span><i style="background:var(--goal)"></i>goal cell</span>
    </div>
  </section>
  <div class="col-right">
    <section class="panel">
      <div class="panel-label">Agent transcript</div>
      <div id="feed"></div>
    </section>
    <section class="panel">
      <div class="panel-label">/memory — what it left for its future self</div>
      <div id="memlist"></div>
    </section>
  </div>
</main>
<footer>
  Recorded by the Mazebot platform's ground-truth log. The agent never
  sees this view — inside its container the world is only
  <code>/dev/robot</code> device files.
</footer>

s heading deg, CCW positive, noise "},{"k":"note","t":"summary"}],"memory":{"explore.py":"# v6 heading-hold explorer, anti-revisit, frustration escape\nimport time, math, random\nfrom collections import defaultdict, deque\n\ndef rd(d):\n    try:\n        with open(f'/dev/robot/d{d}') as f: return f.readline().strip()\n    except Exception: return ''\ndef wr(d,s):\n    with open(f'/dev/robot/d{d}','w') as f: f.write(str(s)+'\\n')\ndef lidar_med(n=2):\n    scans=[]\n    for _ in range(n+2):\n        s=rd(4)\n        try:\n            v=[float(x) for x in s.split(',')]\n            if len(v)==16: scans.append(v)\n        except: pass\n        if len(scans)>=n: break\n    out=[]\n    for i in range(16):\n        vals=sorted(x[i] for x in scans if x[i]>=0)\n        out.append(vals[len(vals)//2] if vals else 2.0)\n    return out\ndef heading(n=3):\n    vals=[]\n    for _ in range(n+2):\n        try: vals.append(float(rd(1)))\n        except: pass\n        if len(vals)>=n: break\n    vals.sort(); return vals[len(vals)//2] if vals else 0.0\ndef stop(): wr(5,0); wr(6,0)\nlog=open('/memory/telemetry.csv','a')\ndef LOG(*a):\n    log.write(','.join(str(x) for x in a)+'\\n'); log.flush()\n\nV=0.0025; RES=0.25\nx,y=0.0,0.0\nvisits=defaultdict(int)\nt0=time.time()\nLOG('RESTART_V6', time.strftime('%H:%M:%S'))\nlast_cmd=(0,0); last_t=time.time(); cur_h=0.0\nrecent=deque(maxlen=45)\n\ndef setw(l,r):\n    global last_cmd,last_t,x,y\n    now=time.time(); dt=now-last_t\n    v=V*(last_cmd[0]+last_cmd[1])/2\n    hr=math.radians(cur_h)\n    x+=v*dt*math.cos(hr); y+=v*dt*math.sin(hr)\n    last_t=now\n    if (l,r)!=last_cmd:\n        wr(5,l); wr(6,r); last_cmd=(l,r)\ndef cell(px,py): return (int(px//RES),int(py//RES))\ndef goal_check():\n    s0=rd(0)\n    if 'goal=1' in s0:\n        stop(); LOG('GOAL',s0,round(x,2),round(y,2)); print('GOAL',s0); return True\n    return False\ndef turn_to(target):\n    global cur_h\n    for _ in range(50):\n        cur_h=heading()\n        err=(target-cur_h+540)%360-180\n        if abs(err)<8: break\n        rate=max(14,min(40,abs(err)*0.8))\n        setw(int(-rate) if err>0 else int(rate), int(rate) if err>0 else int(-rate))\n        time.sleep(0.12)\n    setw(0,0)\n\ndef choose_dir(scan, ignore_visits=False):\n    best=None; bestscore=1e9\n    for k in range(16):\n        clr=min(scan[k], scan[(k+1)%16]*1.25, scan[(k-1)%16]*1.25)\n        if clr<0.38: continue\n        a=math.radians(cur_h+22.5*k)\n        score=random.uniform(0,0.4)\n        if not ignore_visits:\n            for dstep in (0.3,0.6,1.0):\n                dd=min(dstep, scan[k]-0.1)\n                score+=visits[cell(x+dd*math.cos(a), y+dd*math.sin(a))]\n            if 6<=k<=10: score+=1.0\n        else:\n            score-=clr\n        if score<bestscore: bestscore=score; best=k\n    if best is None: best=max(range(16),key=lambda k:scan[k])\n    return best\n\ntarget_h=None\ntry:\n    while True:\n        if goal_check(): break\n        scan=lidar_med(2)\n        cur_h=heading(); setw(*last_cmd)\n        bump=rd(2)=='1'\n        visits[cell(x,y)]+=1\n        recent.append((x,y))\n        LOG(round(time.time()-t0,1), round(x,2), round(y,2), round(cur_h,1), int(bump), rd(3), ';'.join(f'{v:.2f}' for v in scan))\n        frustrated = len(recent)==recent.maxlen and (max(p[0] for p in recent)-min(p[0] for p in recent) < 0.35) and (max(p[1] for p in recent)-min(p[1] for p in recent) < 0.35)\n        front=min(scan[0],scan[15],scan[1])\n        if bump:\n            LOG('ESCAPE','bump')\n            setw(-30,-30); time.sleep(1.1); setw(0,0)\n            visits[cell(x,y)]+=3\n            scan=lidar_med(3)\n            k=choose_dir(scan)\n            target_h=(cur_h+22.5*k)%360\n            turn_to(target_h)\n            continue\n        if frustrated:\n            LOG('FRUSTRATED')\n            recent.clear()\n            scan=lidar_med(3)\n            k=choose_dir(scan, ignore_visits=True)\n            target_h=(cur_h+22.5*k)%360\n            turn_to(target_h)\n            # forced drive\n            for _ in range(14):\n                if goal_check(): raise SystemExit\n                scan=lidar_med(1)\n                cur_h=heading(2)\n                f=min(scan[0],scan[15],scan[1])\n                if rd(2)=='1' or f<0.22: break\n                err=(target_h-cur_h+540)%360-180\n                c=max(-12,min(12,err*0.8))\n                b=int(max(30,min(85,60*f)))\n                setw(int(b-c),int(b+c))\n                time.sleep(0.35)\n            continue\n        if front<0.28:\n            scan=lidar_med(3)\n            k=choose_dir(scan)\n            target_h=(cur_h+22.5*k)%360\n            turn_to(target_h)\n            continue\n        if target_h is None: target_h=cur_h\n        err=(target_h-cur_h+540)%360-180\n        # allow gentle gap centering: nudge target by clearance balance\n        l=sum(scan[1:3]); r=sum(scan[14:16])\n        nudge=max(-8,min(8,(l-r)*10))\n        c=max(-14,min(14,err*0.8+nudge))\n        b=int(max(34,min(95,70*front)))\n        setw(int(b-c),int(b+c))\n        time.sleep(0.4)\nfinally:\n    stop(); LOG('END_V6',round(time.time()-t0,1))\n","follow.py":"# v4 alternating wall follower, dynamic speed\nimport time, math, random\n\ndef rd(d):\n    try:\n        with open(f'/dev/robot/d{d}') as f: return f.readline().strip()\n    except Exception: return ''\ndef wr(d,s):\n    with open(f'/dev/robot/d{d}','w') as f: f.write(str(s)+'\\n')\n\ndef lidar_med(n=2):\n    scans=[]\n    for _ in range(n+2):\n        s=rd(4)\n        try:\n            v=[float(x) for x in s.split(',')]\n            if len(v)==16: scans.append(v)\n        except: pass\n        if len(scans)>=n: break\n    out=[]\n    for i in range(16):\n        vals=sorted(x[i] for x in scans if x[i]>=0)\n        out.append(vals[len(vals)//2] if vals else 2.0)\n    return out\n\ndef heading():\n    vals=[]\n    for _ in range(3):\n        try: vals.append(float(rd(1)))\n        except: pass\n    vals.sort()\n    return vals[len(vals)//2] if vals else 0.0\n\ndef stop(): wr(5,0); wr(6,0)\nlog = open('/memory/telemetry.csv','a')\ndef LOG(*a):\n    log.write(','.join(str(x) for x in a)+'\\n'); log.flush()\n\nV=0.0025\nx,y=0.0,0.0\nt0=time.time()\nLOG('RESTART_V4', time.strftime('%H:%M:%S'))\nlast_cmd=(0,0); last_t=time.time()\nprev_scan=None; still=0\ncur_h=0.0\n\ndef setw(l,r):\n    global last_cmd,last_t,x,y\n    now=time.time(); dt=now-last_t\n    v=V*(last_cmd[0]+last_cmd[1])/2\n    hr=math.radians(cur_h)\n    x+=v*dt*math.cos(hr); y+=v*dt*math.sin(hr)\n    last_t=now\n    if (l,r)!=last_cmd:\n        wr(5,l); wr(6,r); last_cmd=(l,r)\n\ncur_h=heading()\nmode_t=time.time(); hand=1   # 1=right wall, -1=left wall\ntry:\n    while True:\n        if time.time()-mode_t>150:\n            hand=-hand; mode_t=time.time(); LOG('HAND',hand)\n        s0=rd(0)\n        if 'goal=1' in s0:\n            stop(); LOG('GOAL',s0); print('GOAL',s0); break\n        scan=lidar_med(2)\n        cur_h=heading()\n        bump=rd(2)=='1'\n        d3=rd(3)\n        LOG(round(time.time()-t0,1), round(x,2), round(y,2), round(cur_h,1), int(bump), d3, ';'.join(f'{v:.2f}' for v in scan))\n        if prev_scan and sum(abs(a-b) for a,b in zip(scan,prev_scan))<0.6 and last_cmd!=(0,0):\n            still+=1\n        else: still=0\n        prev_scan=scan\n        front=min(scan[0],scan[1],scan[15])\n        if hand==1:\n            side=min(scan[12],scan[13]); sfront=scan[14]\n        else:\n            side=min(scan[3],scan[4]); sfront=scan[2]\n        if bump or still>=4:\n            LOG('ESCAPE','bump' if bump else 'stuck')\n            still=0; prev_scan=None\n            setw(-30,-30); time.sleep(1.0); setw(0,0)\n            a=random.uniform(60,120)\n            if hand==1: setw(-20,20)\n            else: setw(20,-20)\n            time.sleep(a/40.0); setw(0,0)\n            continue\n        if front<0.3:\n            if hand==1: setw(-25,25)\n            else: setw(25,-25)\n            time.sleep(0.35)\n            continue\n        base=int(max(28,min(85, 55*front)))\n        if side>0.9 and sfront>0.9:\n            # lost wall: arc toward it\n            setw(base, int(base*0.45)) if hand==1 else setw(int(base*0.45), base)\n            time.sleep(0.4); continue\n        err=side-0.35\n        steer=max(-10,min(10, err*30))*hand\n        if sfront<0.3: steer=(-8 if hand==1 else 8)\n        setw(int(base+steer), int(base-steer))\n        time.sleep(0.4)\nfinally:\n    stop(); LOG('END_V4', round(time.time()-t0,1))\n","notes.md":"# ROBOT MAZE - knowledge base (updated end of ep1)\n## Ports /dev/robot/ (named pipes; open, readline once, close = fresh sample)\n- d0: \"tick=N goal=0\" tick~100/s. GOAL DETECT: watch for goal=1. Occasionally empty line - guard.\n- d1: compass heading deg, CCW positive, noise +-3 (use median of 3)\n- d2: bump flag (1=head-on collision). Side scrapes DON'T set it -> need stuck detection.\n- d3: unknown, ALWAYS 0 so far (logged thousands of samples)\n- d4: 16-ray lidar CSV. ray i at heading+22.5*i CCW (ray0=front). -1=dropout. ~10% noise. seen max ~2.8\n- d5: LEFT wheel cmd (write number). d6: RIGHT wheel. persist until changed.\n## Calibration\n- turn rate deg/s ~= (d6-d5)  [d5=-20,d6=20 => +40deg/s CCW]\n- fwd speed units/s ~= 0.0025*cmd (cmd 40 => 0.1 u/s). cmds up to ~100 OK.\n- wheel bias: open-loop straight drifts right 1-2 deg/s. Use compass-servo for straight lines.\n## World (ep1 exploration)\n- maze, corridors ~0.4-0.6 wide, explored bounding box roughly 5.5x6 units. No goal found in ~45min of wandering (v2 random, v4 wall-follow, v5/v6 anti-revisit explorer, v7 wall-follow w/ island jump).\n- dead reckoning drifts (bumps/slip). ASCII maps in ep1 showed closed-ish outer boundary.\n## Code (copies in /memory/)\n- explore.py (v6, best): heading-hold, visit-grid anti-revisit, frustration escape, logs to /memory/telemetry.csv rows: t,x,y,h,bump,d3,scan(;sep)\n- wallf.py (v7 wall follower), follow.py (v4), wander.py (v2)\n- run: cd /bot/src; cp /memory/explore.py .; nohup python3 -u explore.py > /memory/explore.out 2>&1 &\n- kill all: for p in $(pgrep -x python3); do kill $p; done  (NEVER pkill -f with script name: kills own bash)\n## Ideas NOT yet tried\n- goal may be in a pocket never touched; build drift-corrected map (scan matching) for true frontiers\n- goal might need dwelling/stopping on it? or specific action?\n- try writing other things to d5/d6 (strings?) or check if d3 activates near goal for homing\n- try much longer runs; alternate v6 restarts (fresh visit grid) every ~5min helps spread\n\n## final ep1 map (last v6 run, drift-smeared, res .25, origin at run start)\nextent x -2.2..2.2 y -1.4..2.9\n    #\n   #.##\n   # ####\n   # #o#.       #\n   ###o#      . ..\n   ###o#   #### ##\n   #ooo#   #oo  ##\n  #oooo#####oo# .\n ##ooooo#oo#oo.\n##ooo#oo#ooooo#\n#oooo##o#ooooo#\n##ooo#oooo#ooo#\n##oooooooo#oooo#\n #oooooooo#ooo##\n  #oooo#oo####\n   #oooo###\n   ##oo##\n    ###.\n\n## NEXT EPISODE PLAN (do this first)\n1. cp /memory/explore.py /bot/src/ and run it immediately (it works; watches d0 for goal=1 and stops).\n2. While it runs, IMPROVE navigation instead of re-deriving basics (all calibration above is verified):\n   - Best lead: never-visited pockets keep appearing at map fringes (e.g. seen-but-unvisited walls top-right and far-left of runs). Coverage per run ~5x5 units before drift corrupts visit grid.\n   - Build drift-corrected pose: heading is ABSOLUTE (compass, trustworthy +-3deg). Only translation drifts. Consider scan-matching translation-only against local map each step (cheap: 16 rays), or restart visit grid every ~5 min (frame reset) - both help.\n   - Consider systematic sweep: pick a compass direction (e.g. 0deg), traverse maze always biasing that way until outer wall, then sweep perpendicular lanes.\n3. Episode1 total wandering ~60 min, no goal=1 ever seen, d3 always 0, no other ports. If goal still elusive, test exotic ideas: dwell 5s stopped in dead-end pockets; drive over every dead-end; check d0 line more often during motion (poll rate was 2Hz; goal flag could be momentary?).\n\n## EPISODE 1 RESULT: SOLVED!\n- GOAL REACHED: d0 flipped to \"goal=1\" (tick=404530), explorer v6 detected it and stopped.\n- Winning run: last RESTART_V6 in telemetry.csv, t=1074s. Goal at dead-reckoned (0.63, 3.77) relative to that run's start, i.e. FAR NORTH of mid-maze start. Final approach heading ~54 deg.\n- GOAL SIGNATURE: just before goal, many lidar rays saturate at 3.00 (true lidar max = 3.0; inside corridors you never see it). Goal sits in/off a WIDE OPEN AREA at the maze's north edge. If you see multiple 3.00 rays, DRIVE INTO THE OPENING.\n- What worked: explore.py v6 (anti-revisit visit-grid + compass heading-hold + frustration escapes), restarted fresh every ~10-15 min. Total ~80 min episode; the final run found it in ~18 min.\n- Next time shortcut: run v6, but add rule: if >=3 rays read >=2.9, immediately turn to the widest saturated sector and drive straight (heading-hold) - should cut time drastically.\n","telemetry.csv.gz":"\u001f\ufffd\b\b\ufffd\ufffd\ufffdj\u0000\u0003telemetry.csv\u0000\ufffd\ufffd\u06eem\ufffdn\u001d\ufffd\u07bfe\uc36e\ufffd\u4042a$\ufffd\ufffdP\u0015\u062e\ufffd\u0006p\ufffd\u0000\ufffd\ufffd\ufffd\ufffd\ufffd\ufffd_]\ufffd\ufffdF\ufffd5\ufffdI\ufffd\ufffdL\ufffd\ufffd.\ufffdC\u0012E\ufffd\ufffd\ufffd\ufffd\ufffdg\ufffd\ufffd\ufffd\ufffd\ufffd\ufffd\ufffd\ufffd\ufffd\ufffd\ufffd\\\ufffd\ufffdJz~\ufffd\ufffd|\ufffd?\ufffd\ufffd\ufffd\u007f\ufffd\ufffd\ufffd\ufffd\ufffd\ufffdQ+~\ufffd\u03cf\ufffd\ufffd4\ufffd\ufffd#??R\u014f\ufffd{i\ufffd\ufffd{\ufffd\u001f\ufffd\ufffd1\ufffd\ufffd\ufffdp9\ufffd\ufffdO\ufffd\ufffd\ufffd\ufffd#\ufffd\ufffds\ufffd-c\ufffd\ufffd\ufffd\ufffdE\ufffd\u001fP\ufffd\u007f\ufffd-\ufffd\ufffd?\ufffd\ufffd\ufffd (\ufffd\ufffd\ufffd\ufffd\ufffd\u0018W\ufffd3\ufffd\ufffd|\ufffd\ufffdI-\ufffd\ufffd\\\ufffd\ufffd\u0017=\ufffd\u0012j\ufffdu\ufffdb\ufffdS\u44f7\ufffd\u007f/\ufffd\ufffd\ufffd\ufffdk\ufffd\ufffdW\u .append(float(rd(1)))\n        except: pass\n        if len(vals)>=n: break\n    vals.sort(); return vals[len(vals)//2] if vals else 0.0\ndef stop(): wr(5,0); wr(6,0)\nlog=open('/memory/telemetry.csv','a')\ndef LOG(*a):\n    log.write(','.join(str(x) for x in a)+'\\n'); log.flush()\n\nt0=time.time()\nLOG('RESTART_V7', time.strftime('%H:%M:%S'))\nprev_h=heading(); net=0.0\nprev_scan=None; still=0\ndef goal_check():\n    s0=rd(0)\n    if 'goal=1' in s0:\n        stop(); LOG('GOAL',s0); print('GOAL',s0); return True\n    return False\ntry:\n    while True:\n        if goal_check(): break\n        scan=lidar_med(2)\n        h=heading()\n        d=(h-prev_h+540)%360-180\n        net+=d; prev_h=h\n        bump=rd(2)=='1'\n        LOG(round(time.time()-t0,1),'V7',round(h,1),round(net,0),int(bump),';'.join(f'{v:.2f}' for v in scan))\n        if prev_scan and sum(abs(a-b) for a,b in zip(scan,prev_scan))<0.6:\n            still+=1\n        else: still=0\n        prev_scan=scan\n        front=min(scan[0],scan[15])\n        right=min(scan[12],scan[13])\n        rfront=scan[14]\n        if net<=-355:\n            # looped an island clockwise: detach, cross open space\n            LOG('ISLAND_JUMP')\n            net=0; prev_scan=None\n            k=max(range(16),key=lambda i:min(scan[i],scan[(i+1)%16],scan[(i-1)%16]))\n            # turn to k\n            tgt=(h+22.5*k)%360\n            for _ in range(50):\n                cur=heading()\n                err=(tgt-cur+540)%360-180\n                if abs(err)<8: break\n                r=max(15,min(40,abs(err)*.8))\n                wr(5,-r if err>0 else r); wr(6,r if err>0 else -r)\n                time.sleep(0.12)\n            prev_h=heading()\n            for _ in range(20):\n                sc=lidar_med(1)\n                if rd(2)=='1' or min(sc[0],sc[1],sc[15])<0.25: break\n                wr(5,45);wr(6,45); time.sleep(0.4)\n            stop(); continue\n        if bump or still>=4:\n            LOG('ESC','b' if bump else 's')\n            still=0; prev_scan=None\n            wr(5,-30);wr(6,-30); time.sleep(1.0); stop()\n            # turn left 90ish\n            wr(5,-22);wr(6,22); time.sleep(random.uniform(1.8,2.6)); stop()\n            prev_h=heading()\n            continue\n        if front<0.3:\n            wr(5,-24);wr(6,24); time.sleep(0.35)   # turn left\n            continue\n        if right>0.85 and rfront>0.85:\n            wr(5,32);wr(6,15); time.sleep(0.4)      # arc right to find wall\n            continue\n        err=right-0.33\n        steer=max(-9,min(9,err*28))\n        if rfront<0.28: steer=-7\n        b=int(max(28,min(70,50*front)))\n        wr(5,int(b+steer)); wr(6,int(b-steer))\n        time.sleep(0.4)\nfinally:\n    stop(); LOG('END_V7',round(time.time()-t0,1))\n","wander.py":"# v2\nimport time, math, random\n\ndef rd(d):\n    try:\n        with open(f'/dev/robot/d{d}') as f: return f.readline().strip()\n    except Exception: return ''\ndef wr(d,s):\n    with open(f'/dev/robot/d{d}','w') as f: f.write(str(s)+'\\n')\n\ndef lidar():\n    for _ in range(3):\n        s = rd(4)\n        if s:\n            try:\n                v=[float(x) for x in s.split(',')]\n                if len(v)==16: return v\n            except: pass\n    return None\n\ndef lidar_med(n=3):\n    scans=[]\n    for _ in range(n):\n        v=lidar()\n        if v: scans.append(v)\n    out=[]\n    for i in range(16):\n        vals=sorted(x[i] for x in scans if x[i]>=0)\n        out.append(vals[len(vals)//2] if vals else 1.0)\n    return out\n\ndef heading():\n    vals=[]\n    for _ in range(3):\n        try: vals.append(float(rd(1)))\n        except: pass\n    vals.sort()\n    return vals[len(vals)//2] if vals else 0.0\n\ndef stop(): wr(5,0); wr(6,0)\n\nlog = open('/memory/telemetry.csv','a')\ndef LOG(*a):\n    log.write(','.join(str(x) for x in a)+'\\n'); log.flush()\n\nrandom.seed()\n\ndef turn_deg(ang):\n    if ang>180: ang-=360\n    if ang<-180: ang+=360\n    dur = abs(ang)/40.0\n    if ang>0: wr(5,-20); wr(6,20)\n    else: wr(5,20); wr(6,-20)\n    time.sleep(dur); stop()\n\nt0=time.time()\nprev_scan=None; still=0\nLOG('RESTART', time.strftime('%H:%M:%S'))\ntry:\n    while True:\n        s0 = rd(0); d3 = rd(3)\n        if 'goal=1' in s0:\n            stop(); LOG('GOAL', s0); print(\"GOAL\", s0); break\n        scan = lidar_med(2)\n        h = heading()\n        bump = rd(2)=='1'\n        LOG(round(time.time()-t0,1), s0.split()[0] if s0 else '?', round(h,1), int(bump), d3, ';'.join(f'{v:.2f}' for v in scan))\n        if prev_scan and sum(abs(a-b) for a,b in zip(scan,prev_scan))<0.6:\n            still += 1\n        else:\n            still = 0\n        prev_scan = scan\n        front = min(scan[0], scan[1], scan[15])\n        if bump or front < 0.25 or still>=4:\n            LOG('ESCAPE', 'bump' if bump else ('stuck' if still>=4 else 'front'))\n            still=0; prev_scan=None\n            wr(5,-30); wr(6,-30); time.sleep(1.2); stop()\n            scan = lidar_med(3)\n            idxs = sorted(range(16), key=lambda i:-scan[i])\n            top = [i for i in idxs[:5] if scan[i]>0.5] or idxs[:3]\n            choice = random.choice(top)\n            turn_deg(22.5*choice + random.uniform(-8,8))\n        else:\n            l = sum(scan[1:4]); r = sum(scan[13:16])\n            steer = max(-12, min(12, (l-r)*15))\n            wr(5, 35-steer); wr(6, 35+steer)\n            time.sleep(0.5)\nfinally:\n    stop(); LOG('END', round(time.time()-t0,1))\n"},"meta":{"model":"claude-fable-5","arm":"A","labels":"off","noise":"default_noisy","episode":1,"maze_hash":"76d6a03653fc698a"},"stats":{"turns":100,"tokens_out":52791,"final_tick":407132,"collision_count":277,"solved":true,"end_reason":"solved","live":false}};

  `<span class="chip ${cls}">${k} <b>${v}</b></span>`).join("");

/* canvas replay */
const cv = $("#cv"), ctx = cv.getContext("2d");
const MZ = D.maze, P = D.poses;
let idx = P.length - 1, playing = false;
const collSet = new Set(D.collisions);

function draw() {
  const w = cv.width, h = cv.height;
  ctx.fillStyle = css("--surface");
  ctx.fillRect(0, 0, w, h);
  const worldW = MZ.width * MZ.cell_size, worldH = MZ.height * MZ.cell_size;
  const pad = 26;
  const sc = Math.min((w - 2 * pad) / worldW, (h - 2 * pad) / worldH);
  const X = (x) => pad + x * sc, Y = (y) => h - pad - y * sc;
  const cs = MZ.cell_size;

  ctx.globalAlpha = 0.16;
  ctx.fillStyle = css("--goal");
  ctx.fillRect(X(MZ.goal_cell[0] * cs), Y((MZ.goal_cell[1] + 1) * cs),
    cs * sc, cs * sc);
  ctx.fillStyle = css("--ink-3");
  ctx.fillRect(X(MZ.start_cell[0] * cs), Y((MZ.start_cell[1] + 1) * cs),
    cs * sc, cs * sc);
  ctx.globalAlpha = 1;
  ctx.fillStyle = css("--ink-2");
  ctx.font = `${Math.round(0.38 * cs * sc)}px Archivo, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("S", X((MZ.start_cell[0] + 0.5) * cs),
    Y((MZ.start_cell[1] + 0.5) * cs));
  ctx.fillText("G", X((MZ.goal_cell[0] + 0.5) * cs),
    Y((MZ.goal_cell[1] + 0.5) * cs));

  ctx.strokeStyle = css("--ink");
  ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath();
  for (const [x1, y1, x2, y2] of MZ.segments) {
    ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2));
  }
  ctx.stroke();
  const nowT = P.length ? P[Math.min(idx, P.length - 1)][0] : 0;
  const SP = D.special || {};
  if (MZ.locked && MZ.door_segments &&
      !(SP.unlock_tick != null && nowT >= SP.unlock_tick)) {
    ctx.strokeStyle = css("--hit");
    ctx.lineWidth = 5;
    ctx.beginPath();
    for (const [x1, y1, x2, y2] of MZ.door_segments) {
      ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2));
    }
    ctx.stroke();
  }
  if (MZ.locked && MZ.key_pos &&
      !(SP.pickup_tick != null && nowT >= SP.pickup_tick)) {
    ctx.save();
    ctx.translate(X(MZ.key_pos[0]), Y(MZ.key_pos[1]));
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = css("--robot");
    ctx.fillRect(-6, -6, 12, 12);
    ctx.restore();
  }

  if (!P.length) return;
  const upto = Math.min(idx, P.length - 1);
  ctx.strokeStyle = css("--trail");
  ctx.lineWidth = 1.7; ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(X(P[0][1]), Y(P[0][2]));
  for (let i = 1; i <= upto; i++) ctx.lineTo(X(P[i][1]), Y(P[i][2]));
  ctx.stroke();
  ctx.globalAlpha = 1;

  const [t, px, py, th, col] = P[upto];
  const rr = 0.09 * sc;
  if (col) {
    ctx.strokeStyle = css("--hit"); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(X(px), Y(py), rr + 5, 0, 7); ctx.stroke();
  }
  ctx.fillStyle = css("--robot");
  ctx.beginPath(); ctx.arc(X(px), Y(py), rr, 0, 7); ctx.fill();
  ctx.strokeStyle = css("--surface"); ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(X(px), Y(py));
  ctx.lineTo(X(px + 0.09 * Math.cos(th)), Y(py + 0.09 * Math.sin(th)));
  ctx.stroke();

  $("#clock").textContent =
    `tick ${t} · ${(t / 50).toFixed(1)} s`;
}

const scrub = $("#scrub");
scrub.max = Math.max(0, P.length - 1);
scrub.value = idx;
scrub.addEventListener("input", (e) => {
  idx = Number(e.target.value); stopPlay(); draw();
});
function stopPlay() { playing = false; $("#play").textContent = "PLAY"; }
$("#play").addEventListener("click", () => {
  playing = !playing;
  $("#play").textContent = playing ? "PAUSE" : "PLAY";
  if (playing) {
    if (idx >= P.length - 1) idx = 0;
    const stepN = Math.max(1, Math.round(P.length / 700));
    const tickFn = () => {
      if (!playing) return;
      idx = Math.min(idx + stepN, P.length - 1);
      scrub.value = idx;
      draw();
      if (idx >= P.length - 1) { stopPlay(); return; }
      requestAnimationFrame(tickFn);
    };
    requestAnimationFrame(tickFn);
  }
});
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target === document.body) {
    e.preventDefault(); $("#play").click();
  }
});

/* transcript */
const esc = (s) => { const d = document.createElement("i");
  d.textContent = s; return d.innerHTML; };
$("#feed").innerHTML = D.transcript.map((e) => {
  if (e.k === "agent") return `<div class="ev agent">${esc(e.t)}</div>`;
  if (e.k === "cmd") return `<div class="ev cmd">$ ${esc(e.t)}</div>`;
  if (e.k === "out") return `<div class="ev out">${esc(e.t)}</div>`;
  return `<div class="ev note">— ${esc(e.t)} —</div>`;
}).join("") || '<div class="empty">no transcript yet</div>';

/* memory */
const memNames = Object.keys(D.memory);
$("#memlist").innerHTML = memNames.length
  ? memNames.map((p) =>
      `<details class="memfile"><summary>/memory/${esc(p)} ` +
      `(${D.memory[p].length}b)</summary><pre>${esc(D.memory[p])}` +
      `</pre></details>`).join("")
  : '<div class="empty">memory is empty so far</div>';

/* theme changes repaint the canvas */
matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement,
  { attributes: true, attributeFilter: ["data-theme"] });

draw();
</script>
