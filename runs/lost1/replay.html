<title>Mazebot Lost Run</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #f7f6f3;
  --surface: #fcfcfb;
  --border: #e2e0da;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #8a897f;
  --robot: #2a78d6;
  --trail: #eb6834;
  --lidar: #1baf7a;
  --hit: #e34948;
  --goal: #008300;
  --chip: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141413;
    --surface: #1a1a19;
    --border: #33322e;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #8a897f;
    --robot: #3987e5;
    --trail: #d95926;
    --lidar: #199e70;
    --hit: #e66767;
    --goal: #35b135;
    --chip: #232320;
  }
}
:root[data-theme="dark"] {
  --ground: #141413;
  --surface: #1a1a19;
  --border: #33322e;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --ink-3: #8a897f;
  --robot: #3987e5;
  --trail: #d95926;
  --lidar: #199e70;
  --hit: #e66767;
  --goal: #35b135;
  --chip: #232320;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: Archivo, system-ui, sans-serif; font-size: 15px;
  line-height: 1.5;
}
header {
  padding: 20px 22px 14px; border-bottom: 1px solid var(--border);
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px;
}
h1 {
  font-family: "Martian Mono", monospace; font-size: 19px; margin: 0;
  letter-spacing: -0.02em;
}
.sub { color: var(--ink-2); font-size: 13.5px; }
.sub code { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 22px;
  border-bottom: 1px solid var(--border); }
.chip {
  background: var(--chip); border: 1px solid var(--border);
  border-radius: 4px; padding: 5px 11px; font-size: 12px;
  color: var(--ink-2); letter-spacing: 0.02em;
}
.chip b {
  font-family: "Martian Mono", monospace; font-size: 13px;
  color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums;
}
.chip.state-solved { border-color: var(--goal); color: var(--goal); }
.chip.state-live { border-color: var(--trail); color: var(--trail); }
main {
  display: grid; grid-template-columns: minmax(340px, 56%) 1fr;
  gap: 18px; padding: 18px 22px; align-items: start;
}
@media (max-width: 880px) { main { grid-template-columns: 1fr; } }
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
}
.panel-label {
  font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--ink-3); padding: 10px 14px 0;
}
#stage { padding: 8px 12px 4px; }
#cv { width: 100%; height: auto; display: block; }
.controls {
  display: flex; align-items: center; gap: 12px; padding: 8px 14px 14px;
}
button {
  font-family: "Martian Mono", monospace; font-size: 12px;
  background: var(--chip); color: var(--ink);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 7px 16px; cursor: pointer;
}
button:hover { border-color: var(--ink-3); }
button:focus-visible { outline: 2px solid var(--robot); outline-offset: 1px; }
input[type="range"] { flex: 1; accent-color: var(--trail); }
#clock {
  font-family: "Martian Mono", monospace; font-size: 12px;
  color: var(--ink-2); min-width: 150px; text-align: right;
  font-variant-numeric: tabular-nums;
}
.legend { display: flex; gap: 14px; padding: 0 14px 12px; flex-wrap: wrap;
  font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px;
  border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.col-right { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
#feed { max-height: 520px; overflow-y: auto; padding: 6px 14px 14px; }
.ev { margin: 10px 0; }
.ev.agent { font-size: 14px; }
.ev.agent::before {
  content: "AGENT"; display: block; font-size: 10px; letter-spacing: 0.09em;
  color: var(--ink-3); margin-bottom: 2px;
}
.ev.cmd, .ev.out {
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-word;
  padding: 7px 10px; border-radius: 4px;
}
.ev.cmd { background: var(--chip); border-left: 3px solid var(--robot); }
.ev.out { color: var(--ink-2); border-left: 3px solid var(--border);
  max-height: 150px; overflow-y: auto; }
.ev.note { color: var(--ink-3); font-style: italic; font-size: 13px;
  text-align: center; }
#memlist { padding: 6px 14px 14px; }
.memfile { margin: 8px 0; }
.memfile summary {
  font-family: "IBM Plex Mono", monospace; font-size: 12.5px;
  cursor: pointer; color: var(--ink); padding: 4px 0;
}
.memfile pre {
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-word; color: var(--ink-2);
  background: var(--chip); padding: 10px; border-radius: 4px; margin: 4px 0;
}
.empty { color: var(--ink-3); padding: 10px 14px 16px; font-size: 13px; }
footer { color: var(--ink-3); font-size: 12px; padding: 4px 22px 24px; }
</style>

<header>
  <h1>Mazebot Lost Run</h1>
  <span class="sub" id="subtitle"></span>
</header>
<div class="chips" id="chips"></div>
<main>
  <section class="panel">
    <div class="panel-label">Ground truth — top-down replay</div>
    <div id="stage"><canvas id="cv" width="960" height="960"></canvas></div>
    <div class="controls">
      <button id="play" aria-label="play or pause replay">PLAY</button>

      <span id="clock"></span>

    <div class="legend">
      <span><i style="background:var(--robot)"></i>robot</span>
      <span><i style="background:var(--trail)"></i>trail</span>

    <section class="panel">

      <div id="memlist"></div>

  </div>
</main>
<footer>

 bearing; forward motion doesn't change it.\n- Distance: ~333 encoder ticks per lidar unit (rough). speed v -> 2.5*v ticks/s -> v/133 units/s.\n- Turning: wheels(+v,-v) = clockwise = heading increases at ~0.95v deg/s.\n- Corridors ~0.2-0.4 units wide; robot radius ~0.12 (bump at front lidar ~0.13). Lidar max seen ~0.86.\n- Strategy: wall following + check d4 goal flag.\nCORRECTION: forward = beam 3 (not 4). right=beam7, back=beam11, left=beam15.\nBeam i bearing = forward + (i-3)*22.5 deg clockwise.\nLidar max ~0.9 (capped). Contact when front beam ~0.13. Reverse works.\nEncoders integrate commanded speed even when stalled vs wall (unreliable when bumping).\nEpisode 1 run: right-wall follower (src/follow.py) started ~15:01, works well.\nBash commands limited to 60s (sleep<=50). Reading pipes races with controller (2 readers).\nTrajectory so far spans x 0..16, y -1..17 units (dead reckoning w/ ang=heading; offset arbitrary).\nd0 always 0 so far (rear bump? unknown). d5 front bump confirmed.\nWorking code saved: /memory/rc.py, /memory/follow3.py (wall follower with\nperiodic escape every 100s + side switch + stuck detection; checks d4 goal flag).\nUsage next episode: cp /memory/*.py /bot/src/; cd /bot/src; nohup python3 follow3.py &\nMaze is LARGE: traveled y range ~40+ units. Corridors + open rooms + pillars.\nGoal flag never fired yet as of 15:29 ep1 (~30min in).\n\n=== END OF EPISODE 1 SUMMARY (wallclock ran out, goal NOT found) ===\nWhat works (verified):\n- rc.py helpers: lidar/heading/enc/wheels/turn_to. follow3.py: wall follower\n  with bump recovery, stuck detection, escape every 100s + side switch.\n- Robot moved continuously for ~35 min without failures. goal flag (d4) never fired.\n\nKey facts (re-verify quickly but trust these):\n- d6/d7 write left/right wheel speed (persist). d2/d8 encoders (~2.5 ticks per\n  unit speed per sec; ~333 ticks per lidar unit). d3 compass deg CW-positive.\n- d1: 16 lidar beams; beam 3 = FORWARD, beam 7 = right, 11 = back, 15 = left.\n  -1 = dropout. Contact at front reading ~0.13. d5=1 front bump. d0 unknown always 0.\n- Speed 45 cruising works; 100 ok for turns. wheels(+v,-v)=turn right (heading increases).\n\nMaze: HUGE (explored span roughly 60 x 45 units this episode; corridors ~0.2-0.5\nwide, open rooms, pillars). Episode 1 spent too long orbiting small wall loops\nbefore adding escapes.\n\nADVICE FOR NEXT EPISODE:\n1. cp /memory/rc.py /memory/follow3.py /bot/src/; cd /bot/src; nohup python3 follow3.py > follow.out 2>&1 &\n   Then poll: sleep 50; tail follow.log; head -1 /dev/robot/d4  (goal=1 means done).\n2. START IMMEDIATELY (5 min setup max). Don't redo calibration.\n3. Consider improving coverage: episode 1 wandered locally. Ideas:\n   - Bias escapes toward unexplored odometry quadrants (track visited grid in the\n     controller, choose escape direction toward least-visited side).\n   - Or pick one compass direction (e.g. keep heading ~180-270) and push far, since\n     goal is probably far from start. Ep1 start region explored heavily: within\n     ~15 units of start (many pillar rooms). Far SW (-60,-45 in run3 frame) reached at end.\n   - Trajectory of run3 in /memory/traj_ep1_run3.txt (start3 frame, start=(0,0)).\n     Run3 went: south ~35, then west ~60. Unknown if same map/start next episode.\n4. Watch out: commands killed at 60s (sleep<=50). Don't pkill with pattern matching\n   your own command line. Two readers on one pipe race (controller + your reads OK\n   since controller retries).\n5. Log odometry grid to /memory periodically so a killed episode still leaves a map.\n","rc.py":"import time\n\ndef readline(port):\n    with open(f'/dev/robot/{port}') as f:\n        return f.readline().strip()\n\ndef lidar():\n    for _ in range(50):\n        s = readline('d1')\n        try:\n            v = [float(x) for x in s.split(',')]\n            if len(v) == 16: return v\n        except: pass\n        time.sleep(0.02)\n    raise RuntimeError('lidar fail')\n\ndef heading():\n    for _ in range(50):\n        try: return float(readline('d3'))\n        except: time.sleep(0.02)\n    raise RuntimeError('heading fail')\n\ndef enc():\n    for _ in range(50):\n        try: return int(readline('d2')), int(readline('d8'))\n        except: time.sleep(0.02)\n    raise RuntimeError('enc fail')\n\ndef status():\n    return readline('d4')\n\ndef goal():\n    for _ in range(50):\n        s = readline('d4')\n        if 'goal=' in s: return int(s.split('goal=')[1])\n        time.sleep(0.02)\n    return 0\n\ndef wheels(l, r):\n    with open('/dev/robot/d6','w') as f: f.write(f'{l}\\n')\n    with open('/dev/robot/d7','w') as f: f.write(f'{r}\\n')\n\ndef stop(): wheels(0,0)\n\ndef avg_lidar(n=8):\n    samples=[]\n    for _ in range(n):\n        samples.append(lidar()); time.sleep(0.05)\n    out=[]\n    for i in range(16):\n        vals=[s[i] for s in samples if s[i]>=0]\n        out.append(sum(vals)/len(vals) if vals else 9.9)\n    return out\n\ndef turn_to(target, speed=40, tol=4):\n    t0=time.time()\n    while time.time()-t0<20:\n        h=heading()\n        d=(target-h)%360\n        if d>180: d-=360\n        if abs(d)<tol:\n            stop(); return True\n        s=speed if d>0 else -speed\n        # heading increases with clockwise (left fwd, right back)\n        wheels(s,-s)\n        time.sleep(0.05)\n    stop(); return False\n","traj_ep1_run3.txt":"[(-0.3, -0.4), (-0.9, -0.3), (-1.1, 0.2), (-0.8, 0.6), (-0.2, 0.7), (0.2, 0.3), (0.2, -0.2), (-0.4, -0.5), (-0.8, -0.1), (-0.8, 0.5), (-0.2, 0.7), (0.2, 0.4), (0.2, -0.2), (-0.3, -0.5), (0.7, -1.1), (0.9, -1.5), (0.7, -2.0), (0.6, -2.6), (0.5, -3.2), (0.6, -3.8), (0.6, -4.4), (0.6, -5.1), (0.6, -5.7), (0.6, -6.3), (0.6, -6.9), (0.6, -7.5), (0.6, -8.1), (0.6, -8.7), (0.6, -9.3), (0.6, -10.0), (0.6, -10.6), (0.6, -11.2), (0.6, -11.8), (0.6, -12.4), (0.6, -13.0), (0.6, -13.6), (0.6, -14.2), (0.6, -14.8), (0.6, -15.4), (0.6, -16.1), (0.6, -16.7), (0.6, -17.3), (0.6, -17.9), (0.7, -18.5), (0.7, -19.1), (0.7, -19. const $ = (s) => document.querySelector(s);
const css = (n) => getComputedStyle(document.documentElement)
  .getPropertyValue(n).trim();

/* header */
const st = D.stats, m = D.meta;
$("#subtitle").textContent =
  `episode ${m.episode} · arm ${m.arm} · labels ${m.labels} · ` +
  `${m.noise} · maze ${m.maze_hash} · ${m.model}`;
const chips = [
  st.live ? ["status", "IN PROGRESS", "state-live"]
          : st.solved ? ["status", "SOLVED", "state-solved"]
                      : ["status", (st.end_reason || "ended").toUpperCase(), ""],
  ["sim time", (st.final_tick / 50).toFixed(0) + " s", ""],
  st.solved && D.goal_tick ? ["solved at", (D.goal_tick / 50).toFixed(0) + " s", "state-solved"] : null,
  ["turns", st.turns, ""],
  ["output tokens", (st.tokens_out || 0).toLocaleString(), ""],
  ["collisions", st.collision_count, ""],
  (D.special && D.special.pickup_tick != null)
    ? ["key picked up", (D.special.pickup_tick / 50).toFixed(0) + " s",
       "state-solved"] : (D.maze.locked ? ["key", "not found", ""] : null),
  (D.special && D.special.unlock_tick != null)
    ? ["door unlocked", (D.special.unlock_tick / 50).toFixed(0) + " s",
       "state-solved"] : (D.maze.locked ? ["door", "locked", ""] : null),
];
$("#chips").innerHTML = chips.filter(Boolean).map(([k, v, cls]) =>
  `<span class="chip ${cls}">${k} <b>${v}</b></span>`).join("");

/* canvas replay */
const cv = $("#cv"), ctx = cv.getContext("2d");
const MZ = D.maze, P = D.poses;
let idx = P.length - 1, playing = false;
const collSet = new Set(D.collisions);

function draw() {
  const w = cv.width, h = cv.height;
  ctx.fillStyle = css("--surface");
  ctx.fillRect(0, 0, w, h);
  const worldW = MZ.width * MZ.cell_size, worldH = MZ.height * MZ.cell_size;
  const pad = 26;
  const sc = Math.min((w - 2 * pad) / worldW, (h - 2 * pad) / worldH);
  const X = (x) => pad + x * sc, Y = (y) => h - pad - y * sc;
  const cs = MZ.cell_size;

  ctx.globalAlpha = 0.16;
  ctx.fillStyle = css("--goal");
  ctx.fillRect(X(MZ.goal_cell[0] * cs), Y((MZ.goal_cell[1] + 1) * cs),
    cs * sc, cs * sc);
  ctx.fillStyle = css("--ink-3");
  ctx.fillRect(X(MZ.start_cell[0] * cs), Y((MZ.start_cell[1] + 1) * cs),
    cs * sc, cs * sc);
  ctx.globalAlpha = 1;
  ctx.fillStyle = css("--ink-2");
  ctx.font = `${Math.round(0.38 * cs * sc)}px Archivo, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("S", X((MZ.start_cell[0] + 0.5) * cs),
    Y((MZ.start_cell[1] + 0.5) * cs));
  ctx.fillText("G", X((MZ.goal_cell[0] + 0.5) * cs),
    Y((MZ.goal_cell[1] + 0.5) * cs));

  ctx.strokeStyle = css("--ink");
  ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath();
  for (const [x1, y1, x2, y2] of MZ.segments) {
    ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2));
  }
  ctx.stroke();
  const nowT = P.length ? P[Math.min(idx, P.length - 1)][0] : 0;
  const SP = D.special || {};
  if (MZ.locked && MZ.door_segments &&
      !(SP.unlock_tick != null && nowT >= SP.unlock_tick)) {
    ctx.strokeStyle = css("--hit");
    ctx.lineWidth = 5;
    ctx.beginPath();
    for (const [x1, y1, x2, y2] of MZ.door_segments) {
      ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2));
    }
    ctx.stroke();
  }
  if (MZ.locked && MZ.key_pos &&
      !(SP.pickup_tick != null && nowT >= SP.pickup_tick)) {
    ctx.save();
    ctx.translate(X(MZ.key_pos[0]), Y(MZ.key_pos[1]));
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = css("--robot");
    ctx.fillRect(-6, -6, 12, 12);
    ctx.restore();
  }

  if (!P.length) return;
  const upto = Math.min(idx, P.length - 1);
  ctx.strokeStyle = css("--trail");
  ctx.lineWidth = 1.7; ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(X(P[0][1]), Y(P[0][2]));
  for (let i = 1; i <= upto; i++) ctx.lineTo(X(P[i][1]), Y(P[i][2]));
  ctx.stroke();
  ctx.globalAlpha = 1;

  const [t, px, py, th, col] = P[upto];
  const rr = 0.09 * sc;
  if (col) {
    ctx.strokeStyle = css("--hit"); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(X(px), Y(py), rr + 5, 0, 7); ctx.stroke();
  }
  ctx.fillStyle = css("--robot");
  ctx.beginPath(); ctx.arc(X(px), Y(py), rr, 0, 7); ctx.fill();
  ctx.strokeStyle = css("--surface"); ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(X(px), Y(py));
  ctx.lineTo(X(px + 0.09 * Math.cos(th)), Y(py + 0.09 * Math.sin(th)));
  ctx.stroke();

  $("#clock").textContent =
    `tick ${t} · ${(t / 50).toFixed(1)} s`;
}

const scrub = $("#scrub");
scrub.max = Math.max(0, P.length - 1);
scrub.value = idx;
scrub.addEventListener("input", (e) => {
  idx = Number(e.target.value); stopPlay(); draw();
});
function stopPlay() { playing = false; $("#play").textContent = "PLAY"; }
$("#play").addEventListener("click", () => {
  playing = !playing;
  $("#play").textContent = playing ? "PAUSE" : "PLAY";
  if (playing) {
    if (idx >= P.length - 1) idx = 0;
    const stepN = Math.max(1, Math.round(P.length / 700));
    const tickFn = () => {
      if (!playing) return;
      idx = Math.min(idx + stepN, P.length - 1);
      scrub.value = idx;
      draw();
      if (idx >= P.length - 1) { stopPlay(); return; }
      requestAnimationFrame(tickFn);
    };
    requestAnimationFrame(tickFn);
  }
});
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target === document.body) {
    e.preventDefault(); $("#play").click();
  }
});

/* transcript */
const esc = (s) => { const d = document.createElement("i");
  d.textContent = s; return d.innerHTML; };
$("#feed").innerHTML = D.transcript.map((e) => {
  if (e.k === "agent") return `<div class="ev agent">${esc(e.t)}</div>`;
  if (e.k === "cmd") return `<div class="ev cmd">$ ${esc(e.t)}</div>`;
  if (e.k === "out") return `<div class="ev out">${esc(e.t)}</div>`;
  return `<div class="ev note">— ${esc(e.t)} —</div>`;
}).join("") || '<div class="empty">no transcript yet</div>';

/* memory */
const memNames = Object.keys(D.memory);
$("#memlist").innerHTML = memNames.length
  ? memNames.map((p) =>
      `<details class="memfile"><summary>/memory/${esc(p)} ` +
      `(${D.memory[p].length}b)</summary><pre>${esc(D.memory[p])}` +
      `</pre></details>`).join("")
  : '<div class="empty">memory is empty so far</div>';

/* theme changes repaint the canvas */
matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement,
  { attributes: true, attributeFilter: ["data-theme"] });

draw();
</script>
