<title>Mazebot Haiku Run</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #f7f6f3;
  --surface: #fcfcfb;
  --border: #e2e0da;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #8a897f;
  --robot: #2a78d6;
  --trail: #eb6834;
  --lidar: #1baf7a;
  --hit: #e34948;
  --goal: #008300;
  --chip: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141413;
    --surface: #1a1a19;
    --border: #33322e;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #8a897f;
    --robot: #3987e5;
    --trail: #d95926;
    --lidar: #199e70;
    --hit: #e66767;
    --goal: #35b135;
    --chip: #232320;
  }
}
:root[data-theme="dark"] {
  --ground: #141413;
  --surface: #1a1a19;
  --border: #33322e;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --ink-3: #8a897f;
  --robot: #3987e5;
  --trail: #d95926;
  --lidar: #199e70;
  --hit: #e66767;
  --goal: #35b135;
  --chip: #232320;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: Archivo, system-ui, sans-serif; font-size: 15px;
  line-height: 1.5;
}
header {
  padding: 20px 22px 14px; border-bottom: 1px solid var(--border);
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px;
}
h1 {
  font-family: "Martian Mono", monospace; font-size: 19px; margin: 0;
  letter-spacing: -0.02em;
}
.sub { color: var(--ink-2); font-size: 13.5px; }
.sub code { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 22px;
  border-bottom: 1px solid var(--border); }
.chip {
  background: var(--chip); border: 1px solid var(--border);
  border-radius: 4px; padding: 5px 11px; font-size: 12px;
  color: var(--ink-2); letter-spacing: 0.02em;
}
.chip b {
  font-family: "Martian Mono", monospace; font-size: 13px;
  color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums;
}
.chip.state-solved { border-color: var(--goal); color: var(--goal); }
.chip.state-live { border-color: var(--trail); color: var(--trail); }
main {
  display: grid; grid-template-columns: minmax(340px, 56%) 1fr;
  gap: 18px; padding: 18px 22px; align-items: start;
}
@media (max-width: 880px) { main { grid-template-columns: 1fr; } }
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
}
.panel-label {
  font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--ink-3); padding: 10px 14px 0;
}
#stage { padding: 8px 12px 4px; }
#cv { width: 100%; height: auto; display: block; }
.controls {
  display: flex; align-items: center; gap: 12px; padding: 8px 14px 14px;
}
button {
  font-family: "Martian Mono", monospace; font-size: 12px;
  background: var(--chip); color: var(--ink);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 7px 16px; cursor: pointer;
}
button:hover { border-color: var(--ink-3); }
button:focus-visible { outline: 2px solid var(--robot); outline-offset: 1px; }
input[type="range"] { flex: 1; accent-color: var(--trail); }
#clock {
  font-family: "Martian Mono", monospace; font-size: 12px;
  color: var(--ink-2); min-width: 150px; text-align: right;
  font-variant-numeric: tabular-nums;
}
.legend { display: flex; gap: 14px; padding: 0 14px 12px; flex-wrap: wrap;
  font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px;
  border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.col-right { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
#feed { max-height: 520px; overflow-y: auto; padding: 6px 14px 14px; }
.ev { margin: 10px 0; }
.ev.agent { font-size: 14px; }
.ev.agent::before {
  content: "AGENT"; display: block; font-size: 10px; letter-spacing: 0.09em;
  color: var(--ink-3); margin-bottom: 2px;
}
.ev.cmd, .ev.out {
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-word;
  padding: 7px 10px; border-radius: 4px;
}
.ev.cmd { background: var(--chip); border-left: 3px solid var(--robot); }
.ev.out { color: var(--ink-2); border-left: 3px solid var(--border);
  max-height: 150px; overflow-y: auto; }
.ev.note { color: var(--ink-3); font-style: italic; font-size: 13px;
  text-align: center; }
#memlist { padding: 6px 14px 14px; }
.memfile { margin: 8px 0; }
.memfile summary {
  font-family: "IBM Plex Mono", monospace; font-size: 12.5px;
  cursor: pointer; color: var(--ink); padding: 4px 0;
}
.memfile pre {
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-word; color: var(--ink-2);
  background: var(--chip); padding: 10px; border-radius: 4px; margin: 4px 0;
}
.empty { color: var(--ink-3); padding: 10px 14px 16px; font-size: 13px; }
footer { color: var(--ink-3); font-size: 12px; padding: 4px 22px 24px; }
</style>

<header>
  <h1>Mazebot Haiku Run</h1>
  <span class="sub" id="subtitle"></span>
</header>
<div class="chips" id="chips"></div>
<main>
  <section class="panel">
    <div class="panel-label">Ground truth — top-down replay</div>
    <div id="stage"><canvas id="cv" width="960" height="960"></canvas></div>
    <div class="controls">
      <button id="play" aria-label="play or pause replay">PLAY</button>
      <input type="range" id="scrub" min="0" max="0" value="0"
        aria-label="replay position">
      <span id="clock"></span>
    </div>
    <div class="legend">
      <span><i style="background:var(--robot)"></i>robot</span>
      <span><i style="background:var(--trail)"></i>trail</span>
      <span><i style="background:var(--hit)"></i>collision</span>
      <span><i style="background:var(--goal)"></i>goal cell</span>
    </div>
  </section>
  <div class="col-right">
    <section class="panel">
      <div class="panel-label">Agent transcript</div>
      <div id="feed"></div>
    </section>
    <section class="panel">
      <div class="panel-label">/memory — what it left for its future self</div>
      <div id="memlist"></div>
    </section>
  </div>
</main>
<footer>
  Recorded by the Mazebot platform's ground-truth log. The agent never
  sees this view — inside its container the world is only
  <code>/dev/robot</code> device files.
</footer>

-ready maze solver\n- `final_status.txt` - Detailed progress and metrics\n- `usage_instructions.txt` - Comprehensive instructions for continuation\n\n**For Future Episodes:**\nThe solver can be immediately resumed and potentially reach the goal by increasing it"},{"k":"note","t":"summary"}],"memory":{"best_solver.py":"#!/usr/bin/env python3\n\"\"\"\nExtended maze solver with higher iteration limit.\n\"\"\"\n\nimport time\nimport sys\n\nLIDAR_DEV = \"/dev/robot/lidar\"\nSTATUS_DEV = \"/dev/robot/status\"\nMOTOR_LEFT_DEV = \"/dev/robot/motor_left\"\nMOTOR_RIGHT_DEV = \"/dev/robot/motor_right\"\n\ndef read_device(device_path):\n    try:\n        with open(device_path, 'r') as f:\n            return f.read().strip()\n    except:\n        return None\n\ndef write_motor(left, right):\n    try:\n        with open(MOTOR_LEFT_DEV, 'w') as f:\n            f.write(str(int(left)) + '\\n')\n        with open(MOTOR_RIGHT_DEV, 'w') as f:\n            f.write(str(int(right)) + '\\n')\n    except:\n        pass\n\ndef parse_lidar(s):\n    try:\n        return [float(x) for x in s.split(',')]\n    except:\n        return None\n\ndef check_goal():\n    s = read_device(STATUS_DEV)\n    return s and \"goal=1\" in s\n\nprint(\"Extended solver started\", file=sys.stderr, flush=True)\n\niteration = 0\nmax_iter = 15000  # Extended limit\nbase_speed = 165\n\nwhile iteration < max_iter:\n    if check_goal():\n        print(\"GOAL REACHED!\", file=sys.stderr, flush=True)\n        write_motor(0, 0)\n        sys.exit(0)\n    \n    lidar_str = read_device(LIDAR_DEV)\n    if not lidar_str:\n        time.sleep(0.01)\n        iteration += 1\n        continue\n    \n    ranges = parse_lidar(lidar_str)\n    if not ranges or len(ranges) < 16:\n        time.sleep(0.01)\n        iteration += 1\n        continue\n    \n    for i in range(len(ranges)):\n        if ranges[i] < 0:\n            ranges[i] = 2.5\n    \n    f = ranges[0]\n    fl = ranges[3]\n    fr = ranges[13]\n    \n    lm = base_speed\n    rm = base_speed\n    \n    if f < 0.32:\n        lm = base_speed\n        rm = 35\n        c = \"H\"\n    elif f < 0.42:\n        lm = base_speed\n        rm = 75\n        c = \"R\"\n    elif f < 0.52:\n        lm = base_speed\n        rm = 105\n        c = \"r\"\n    elif fl < 0.26:\n        lm = base_speed + 40\n        rm = base_speed - 40\n        c = \"L\"\n    elif fr < 0.26:\n        lm = base_speed - 40\n        rm = base_speed + 40\n        c = \"R\"\n    else:\n        c = \"F\"\n    \n    write_motor(lm, rm)\n    \n    iteration += 1\n    \n    if iteration % 300 == 0 or iteration % 1000 < 50:\n        st = read_device(STATUS_DEV)\n        print(f\"I={iteration} F={f:.2f} L={fl:.2f} {c} {st}\", file=sys.stderr, flush=True)\n        sys.stderr.flush()\n    \n    time.sleep(0.011)\n\nwrite_motor(0, 0)\nprint(\"Max iterations reached\", file=sys.stderr, flush=True)\n","final_status.txt":"MAZE NAVIGATION - FINAL STATUS\n==============================\n\nEpisode Status: INCOMPLETE - Goal not reached\nTime Elapsed: ~15 minutes\nFinal Tick Count: 42656\nFinal Iteration: 10039\n\nAlgorithm Used: Adaptive Obstacle Avoidance with Wall-Following\n- 16-beam LiDAR scanner (360\u00b0 coverage)\n- Forward, Left 45\u00b0, Right 45\u00b0 measurements for decision making\n- Hard right turn at 0.32m (HR)\n- Right turn at 0.42m (R)\n- Light right turn at 0.52m (r)\n- Left avoidance when wall detected (L)\n- Forward when path clear (F)\n- Base motor speed: 165 PWM units\n\nKey Observations:\n1. Maze is very large and complex\n2. Robot continuously navigated using wall-following strategy\n3. No dead-ends encountered recently (minimal backtracking near end)\n4. Steady forward progress through iterations\n5. Lidar readings show narrow passages (0.2-0.6m walls)\n\nPerformance Metrics:\n- Started at: tick=231, goal=0\n- Ended at: tick=42656, goal=0\n- Total ticks traversed: ~42,425\n- Iterations completed: 10,039 out of 15,000\n- Average speed: Maintained around 160 PWM\n\nRunning Process:\n- Script: src/extended_solver.py\n- PID: Check with ps aux\n- Still running in background with nohup\n- Can continue for additional 5,000 iterations if time permits\n\nNext Steps for Future Episodes:\n1. Continue extended_solver.py or implement even longer run (30,000+ iterations)\n2. Consider more aggressive turning for dead-ends\n3. Implement memory-based exploration to avoid revisiting areas\n4. May need to reduce iteration delay further to complete maze faster\n5. Robot status device working reliably throughout\n6. Motor control responsive and stable\n\nThe maze appears to be a complex labyrinth requiring substantial distance traversal to find goal.\n","navigation_log.txt":"Started maze navigation with basic obstacle avoidance algorithm.\nThe robot is using wall-following logic to navigate through the maze.\nCurrent status: Running\n","progress.txt":"Maze Navigation Progress:\n========================\n\nCurrent Status: In Progress\nTick Count: 16394\nGoal Reached: No\n\nAlgorithm: Adaptive wall-following with obstacle avoidance\n- Uses 16-beam lidar for 360-degree sensing\n- Detects walls at multiple angles\n- Turns right when obstacles detected ahead\n- Adjusts for diagonal walls\n- Base speed: 160 PWM units\n\nMaze Pattern Observations:\n- Many sharp turns and narrow passages\n- Multiple dead-ends detected (robot backs up and turns)\n- Complex layout requiring continuous wall-following\n- Robot is making progress but maze is large\n\nNext Steps:\n- Run solver for extended duration (no timeouts)\n- Consider implementing memory-based exploration\n- May need more aggressive turning strategy for tight maze\n","usage_instructions.txt":"HOW TO CONTINUE MAZE NAVIGATION\n================================\n\n1. To restart the solver:\n   python3 /memory/best_solver.py\n\n2. To run in background with output:\n   nohup python3 /memory/best_solver.py > /tmp/solver.log 2>&1 &\n\n3. To monitor progress:\n   tail -f /tmp/solver.log\n\n4. To increase iteration limit further:\n   - Edit max_iter variable in best_solver.py\n   - Current: 15,000 iterations\n   - Recommended: Try 30,000-50,000 for complex maze\n\n5. To speed up (reduce delay):\n   - Change time.sleep(0.011) to time.sleep(0.008) or lower\n   - Each 0.001s reduction saves ~11 seconds per 10,000 iterations\n\n6. Device paths (read-only):\n   /dev/robot/lidar\n   /dev/robot/status\n   /dev/robot/heading\n   /dev/robot/encoder_left\n   /dev/robot/encoder_right\n   /dev/robot/bump_front\n   /dev/robot/bump_rear\n\n7. Device paths (write-only):\n   /dev/robot/motor_left (signed PWM -255 to 255)\n   /dev/robot/motor_right (signed PWM -255 to 255)\n\n8. Status check command:\n   cat /dev/robot/status\n\n9. Expected output when goal reached:\n   goal=1 (visible in status output)\n\nThe solver uses right-hand wall-following with:\n- 16 LiDAR beams for 360\u00b0 sensing\n- Reactive turning based on distance thresholds\n- Base speed 165 PWM\n- ~12ms per control iteration\n"},"meta":{"model":"claude-haiku-4-5","arm":"A","labels":"on","noise":"default_noisy","episode":1,"maze_hash":"a80368043dbff2e4"},"stats":{"turns":63,"tokens_out":16021,"final_tick":43551,"collision_count":337,"solved":false,"end_reason":"max_turns","live":false}};
const $ = (s) => document.querySelector(s);
const css = (n) => getComputedStyle(document.documentElement)
  .getPropertyValue(n).trim();

/* header */
const st = D.stats, m = D.meta;
$("#subtitle").textContent =
  `episode ${m.episode} · arm ${m.arm} · labels ${m.labels} · ` +
  `${m.noise} · maze ${m.maze_hash} · ${m.model}`;
const chips = [
  st.live ? ["status", "IN PROGRESS", "state-live"]
          : st.solved ? ["status", "SOLVED", "state-solved"]
                      : ["status", (st.end_reason || "ended").toUpperCase(), ""],
  ["sim time", (st.final_tick / 50).toFixed(0) + " s", ""],
  st.solved && D.goal_tick ? ["solved at", (D.goal_tick / 50).toFixed(0) + " s", "state-solved"] : null,
  ["turns", st.turns, ""],
  ["output tokens", (st.tokens_out || 0).toLocaleString(), ""],
  ["collisions", st.collision_count, ""],
  (D.special && D.special.pickup_tick != null)
    ? ["key picked up", (D.special.pickup_tick / 50).toFixed(0) + " s",
       "state-solved"] : (D.maze.locked ? ["key", "not found", ""] : null),
  (D.special && D.special.unlock_tick != null)
    ? ["door unlocked", (D.special.unlock_tick / 50).toFixed(0) + " s",
       "state-solved"] : (D.maze.locked ? ["door", "locked", ""] : null),
];
$("#chips").innerHTML = chips.filter(Boolean).map(([k, v, cls]) =>
  `<span class="chip ${cls}">${k} <b>${v}</b></span>`).join("");

/* canvas replay */
const cv = $("#cv"), ctx = cv.getContext("2d");
const MZ = D.maze, P = D.poses;
let idx = P.length - 1, playing = false;
const collSet = new Set(D.collisions);

function draw() {
  const w = cv.width, h = cv.height;
  ctx.fillStyle = css("--surface");
  ctx.fillRect(0, 0, w, h);
  const worldW = MZ.width * MZ.cell_size, worldH = MZ.height * MZ.cell_size;
  const pad = 26;
  const sc = Math.min((w - 2 * pad) / worldW, (h - 2 * pad) / worldH);
  const X = (x) => pad + x * sc, Y = (y) => h - pad - y * sc;
  const cs = MZ.cell_size;

  ctx.globalAlpha = 0.16;
  ctx.fillStyle = css("--goal");
  ctx.fillRect(X(MZ.goal_cell[0] * cs), Y((MZ.goal_cell[1] + 1) * cs),
    cs * sc, cs * sc);
  ctx.fillStyle = css("--ink-3");
  ctx.fillRect(X(MZ.start_cell[0] * cs), Y((MZ.start_cell[1] + 1) * cs),
    cs * sc, cs * sc);
  ctx.globalAlpha = 1;
  ctx.fillStyle = css("--ink-2");
  ctx.font = `${Math.round(0.38 * cs * sc)}px Archivo, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("S", X((MZ.start_cell[0] + 0.5) * cs),
    Y((MZ.start_cell[1] + 0.5) * cs));
  ctx.fillText("G", X((MZ.goal_cell[0] + 0.5) * cs),
    Y((MZ.goal_cell[1] + 0.5) * cs));

  ctx.strokeStyle = css("--ink");
  ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath();
  for (const [x1, y1, x2, y2] of MZ.segments) {
    ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2));
  }
  ctx.stroke();
  const nowT = P.length ? P[Math.min(idx, P.length - 1)][0] : 0;
  const SP = D.special || {};
  if (MZ.locked && MZ.door_segments &&
      !(SP.unlock_tick != null && nowT >= SP.unlock_tick)) {
    ctx.strokeStyle = css("--hit");
    ctx.lineWidth = 5;
    ctx.beginPath();
    for (const [x1, y1, x2, y2] of MZ.door_segments) {
      ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2));
    }
    ctx.stroke();
  }
  if (MZ.locked && MZ.key_pos &&
      !(SP.pickup_tick != null && nowT >= SP.pickup_tick)) {
    ctx.save();
    ctx.translate(X(MZ.key_pos[0]), Y(MZ.key_pos[1]));
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = css("--robot");
    ctx.fillRect(-6, -6, 12, 12);
    ctx.restore();
  }

  if (!P.length) return;
  const upto = Math.min(idx, P.length - 1);
  ctx.strokeStyle = css("--trail");
  ctx.lineWidth = 1.7; ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(X(P[0][1]), Y(P[0][2]));
  for (let i = 1; i <= upto; i++) ctx.lineTo(X(P[i][1]), Y(P[i][2]));
  ctx.stroke();
  ctx.globalAlpha = 1;

  const [t, px, py, th, col] = P[upto];
  const rr = 0.09 * sc;
  if (col) {
    ctx.strokeStyle = css("--hit"); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(X(px), Y(py), rr + 5, 0, 7); ctx.stroke();
  }
  ctx.fillStyle = css("--robot");
  ctx.beginPath(); ctx.arc(X(px), Y(py), rr, 0, 7); ctx.fill();
  ctx.strokeStyle = css("--surface"); ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(X(px), Y(py));
  ctx.lineTo(X(px + 0.09 * Math.cos(th)), Y(py + 0.09 * Math.sin(th)));
  ctx.stroke();

  $("#clock").textContent =
    `tick ${t} · ${(t / 50).toFixed(1)} s`;
}

const scrub = $("#scrub");
scrub.max = Math.max(0, P.length - 1);
scrub.value = idx;
scrub.addEventListener("input", (e) => {
  idx = Number(e.target.value); stopPlay(); draw();
});
function stopPlay() { playing = false; $("#play").textContent = "PLAY"; }
$("#play").addEventListener("click", () => {
  playing = !playing;
  $("#play").textContent = playing ? "PAUSE" : "PLAY";
  if (playing) {
    if (idx >= P.length - 1) idx = 0;
    const stepN = Math.max(1, Math.round(P.length / 700));
    const tickFn = () => {
      if (!playing) return;
      idx = Math.min(idx + stepN, P.length - 1);
      scrub.value = idx;
      draw();
      if (idx >= P.length - 1) { stopPlay(); return; }
      requestAnimationFrame(tickFn);
    };
    requestAnimationFrame(tickFn);
  }
});
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target === document.body) {
    e.preventDefault(); $("#play").click();
  }
});

/* transcript */
const esc = (s) => { const d = document.createElement("i");
  d.textContent = s; return d.innerHTML; };
$("#feed").innerHTML = D.transcript.map((e) => {
  if (e.k === "agent") return `<div class="ev agent">${esc(e.t)}</div>`;
  if (e.k === "cmd") return `<div class="ev cmd">$ ${esc(e.t)}</div>`;
  if (e.k === "out") return `<div class="ev out">${esc(e.t)}</div>`;
  return `<div class="ev note">— ${esc(e.t)} —</div>`;
}).join("") || '<div class="empty">no transcript yet</div>';

/* memory */
const memNames = Object.keys(D.memory);
$("#memlist").innerHTML = memNames.length
  ? memNames.map((p) =>
      `<details class="memfile"><summary>/memory/${esc(p)} ` +
      `(${D.memory[p].length}b)</summary><pre>${esc(D.memory[p])}` +
      `</pre></details>`).join("")
  : '<div class="empty">memory is empty so far</div>';

/* theme changes repaint the canvas */
matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement,
  { attributes: true, attributeFilter: ["data-theme"] });

draw();
</script>
