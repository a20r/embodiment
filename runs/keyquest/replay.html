<title>Mazebot Key Quest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #f7f6f3;
  --surface: #fcfcfb;
  --border: #e2e0da;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #8a897f;
  --robot: #2a78d6;
  --trail: #eb6834;
  --lidar: #1baf7a;
  --hit: #e34948;
  --goal: #008300;
  --chip: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141413;
    --surface: #1a1a19;
    --border: #33322e;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #8a897f;
    --robot: #3987e5;
    --trail: #d95926;
    --lidar: #199e70;
    --hit: #e66767;
    --goal: #35b135;
    --chip: #232320;
  }
}
:root[data-theme="dark"] {
  --ground: #141413;
  --surface: #1a1a19;
  --border: #33322e;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --ink-3: #8a897f;
  --robot: #3987e5;
  --trail: #d95926;
  --lidar: #199e70;
  --hit: #e66767;
  --goal: #35b135;
  --chip: #232320;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: Archivo, system-ui, sans-serif; font-size: 15px;
  line-height: 1.5;
}
header {
  padding: 20px 22px 14px; border-bottom: 1px solid var(--border);
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px;
}
h1 {
  font-family: "Martian Mono", monospace; font-size: 19px; margin: 0;
  letter-spacing: -0.02em;
}
.sub { color: var(--ink-2); font-size: 13.5px; }
.sub code { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 22px;
  border-bottom: 1px solid var(--border); }
.chip {
  background: var(--chip); border: 1px solid var(--border);
  border-radius: 4px; padding: 5px 11px; font-size: 12px;
  color: var(--ink-2); letter-spacing: 0.02em;
}
.chip b {
  font-family: "Martian Mono", monospace; font-size: 13px;
  color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums;
}
.chip.state-solved { border-color: var(--goal); color: var(--goal); }
.chip.state-live { border-color: var(--trail); color: var(--trail); }
main {
  display: grid; grid-template-columns: minmax(340px, 56%) 1fr;
  gap: 18px; padding: 18px 22px; align-items: start;
}
@media (max-width: 880px) { main { grid-template-columns: 1fr; } }
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
}
.panel-label {
  font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--ink-3); padding: 10px 14px 0;
}
#stage { padding: 8px 12px 4px; }
#cv { width: 100%; height: auto; display: block; }
.controls {
  display: flex; align-items: center; gap: 12px; padding: 8px 14px 14px;
}
button {
  font-family: "Martian Mono", monospace; font-size: 12px;
  background: var(--chip); color: var(--ink);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 7px 16px; cursor: pointer;
}
button:hover { border-color: var(--ink-3); }
button:focus-visible { outline: 2px solid var(--robot); outline-offset: 1px; }
input[type="range"] { flex: 1; accent-color: var(--trail); }
#clock {
  font-family: "Martian Mono", monospace; font-size: 12px;
  color: var(--ink-2); min-width: 150px; text-align: right;
  font-variant-numeric: tabular-nums;
}
.legend { display: flex; gap: 14px; padding: 0 14px 12px; flex-wrap: wrap;
  font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px;
  border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.col-right { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
#feed { max-height: 520px; overflow-y: auto; padding: 6px 14px 14px; }
.ev { margin: 10px 0; }
.ev.agent { font-size: 14px; }
.ev.agent::before {
  content: "AGENT"; display: block; font-size: 10px; letter-spacing: 0.09em;
  color: var(--ink-3); margin-bottom: 2px;
}
.ev.cmd, .ev.out {
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-word;
  padding: 7px 10px; border-radius: 4px;
}
.ev.cmd { background: var(--chip); border-left: 3px solid var(--robot); }
.ev.out { color: var(--ink-2); border-left: 3px solid var(--border);
  max-height: 150px; overflow-y: auto; }
.ev.note { color: var(--ink-3); font-style: italic; font-size: 13px;
  text-align: center; }
#memlist { padding: 6px 14px 14px; }
.memfile { margin: 8px 0; }
.memfile summary {
  font-family: "IBM Plex Mono", monospace; font-size: 12.5px;
  cursor: pointer; color: var(--ink); padding: 4px 0;
}
.memfile pre {
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-word; color: var(--ink-2);
  background: var(--chip); padding: 10px; border-radius: 4px; margin: 4px 0;
}
.empty { color: var(--ink-3); padding: 10px 14px 16px; font-size: 13px; }
footer { color: var(--ink-3); font-size: 12px; padding: 4px 22px 24px; }
</style>

<header>
  <h1>Mazebot Key Quest</h1>
  <span class="sub" id="subtitle"></span>
</header>
<div class="chips" id="chips"></div>
<main>
  <section class="panel">
    <div class="panel-label">Ground truth — top-down replay</div>
    <div id="stage"><canvas id="cv" width="960" height="960"></canvas></div>
    <div class="controls">
      <button id="play" aria-label="play or pause replay">PLAY</button>
      <input type="range" id="scrub" min="0" max="0" value="0"
        aria-label="replay position">
      <span id="clock"></span>
    </div>
    <div class="legend">
      <span><i style="background:var(--robot)"></i>robot</span>
      <span><i style="background:var(--trail)"></i>trail</span>
      <span><i style="background:var(--hit)"></i>collision</span>
      <span><i style="background:var(--goal)"></i>goal cell</span>
    </div>
  </section>
  <div class="col-right">
    <section class="panel">
      <div class="panel-label">Agent transcript</div>
      <div id="feed"></div>
    </section>
    <section class="panel">
      <div class="panel-label">/memory — what it left for its future self</div>
      <div id="memlist"></div>
    </section>
  </div>
</main>
<footer>
  Recorded by the Mazebot platform's ground-truth log. The agent never
  sees this view — inside its container the world is only
  <code>/dev/robot</code> device files.
</footer>

1554.5,325.0,0.426\n1554.0,325.1,0.448\n1554.0,325.2,0.437\n1553.5,325.2,0.432\n1553.0,32","ports.md":"# Robot port map (learned by experiment)\n- /dev/robot/d0: read, compass heading degrees (noisy +-3)\n- /dev/robot/d1: read, bump sensor (1 when hitting wall)\n- /dev/robot/d2: read, LEFT wheel encoder (counts up when d3 driven)\n- /dev/robot/d3: write, LEFT wheel speed (e.g. -10..10; 5 => ~25 counts/s)\n- /dev/robot/d4: read, ~0.02-0.04 constant even when moving; unknown (battery? speed?)\n- /dev/robot/d5: write, RIGHT wheel speed\n- /dev/robot/d6: read, RIGHT wheel encoder\n- /dev/robot/d7: read, lidar 16 beams CSV, range ~0..1.0 (units?), -1.000 = dropout/noise\n- /dev/robot/d8: read, 0 so far (another bump? goal sensor?)\n- /dev/robot/d9: read, \"tick=N goal=0\" - goal flag presumably ->1 at goal\n- d3=+,d5=- turns heading DOWN (clockwise?); d3=-,d5=+ heading UP\n- Driving fwd (both +5): beams 0-3,14,15 shrank => front is around beam ~1\n- Pipes: reads block if no writer; use timeouts. Writes persist (motor keeps speed).\n## Corrections\n- Encoder swap: d6 counts wheel driven by d3(left cmd); d2 counts wheel driven by d5(right cmd).\n- Reads sometimes return empty string -> always retry.\n- Beam i world bearing = heading + i*22.5 deg. drive(+,-) decreases heading, drive(-,+) increases.\n- Speed cmd 5-6 => ~25-30 encoder counts/s. Rotation (5,-5) ~ -9 deg/s.\n- Lidar max ~1.0 (units unknown, corridors ~0.2-0.9 wide).\n- Controller: /bot/src/wander.py (reactive: forward if front>0.22 else turn to widest beam). Trace -> /memory/trace.csv (t,x,y,hdg,front) in encoder counts.\n## Strategy notes (ep1)\n- d4 = scalar signal, hypothesized goal proximity. Spawn ~0.02-0.04, elsewhere 0.10-0.16. NOISY (+-0.01).\n- seek2.py: obstacle avoid + gradient-fit chemotaxis + return-to-best. Points logged /memory/points.csv (x,y,s in encoder counts, frame resets each process start!).\n- BEWARE: pgrep/pkill -f patterns match your own bash -c command -> self-kill. Kill in separate tool call with pattern not in start command.\n## Goal localization (ep1, follow/goto frame = pose.json frame)\n- d4 signal fits s = k*r^-1.6 around a point source, r2=0.99\n- Estimated goal position in pose.json frame: see below (refined)\n- Scale: ~760 encoder counts per lidar unit\n## EPISODE 1 SUMMARY / NEXT STEPS (IMPORTANT)\n- GOAL NOT REACHED this episode. Best signal s(d4) max ~0.78.\n- WINNING ROUTE (fast): run right-hand wall follower (/bot copy in /memory/src_backup) from spawn.\n  It reaches s~0.42 in ~2min, keep following ~25+ min total: s dips to 0.06 then rises:\n  0.10 -> 0.31 -> 0.78 as it rounds NE. Peak s=0.78. Goal compound walls near there.\n- At peak area: NE directions blocked by wall ~150-250 counts. Increases seen bearing ~38deg.\n  Entrance to goal compound NOT FOUND yet. Try: continue right-follow PAST the 0.78 peak\n  (we aborted at 0.65 dropping) - the follower may round the compound and find entrance.\n  Or explore north wall gap: at peak room, north walls at 0.28-0.34 units.\n- s field fits s = k*r^-1.5 roughly (k~26000 counts-units). s=0.78 => r~1200 counts (crude).\n- hill.py (run-and-tumble) works in open areas but walls defeat it; followL.py spins in open areas (buggy arc-left).\n- Controllers in /memory/src_backup/: lib.py (robust IO), follow.py (right wall follower + pose.json + points.csv logging), goto.py (target from /bot/target.json + wall-follow escape), hill.py, east.py, nav.py (mapper, unfinished).\n- Episode used all 120min mostly on gradient flailing. NEXT TIME: immediately start follow.py,\n  poll d9 for goal=1, and let it run 30+ min before interfering. Log s; near peak switch to\n  tracing the compound wall CLOSELY (right-hand) until goal flag trips.\n## FINAL ep1 observations (frame = last pose.json, drifted!)\n- Right-follow near end: s=0.70 at (1502,4426), dropped to 0.38 at (1673,2989) going south.\n- s=0.78 peak recorded near (2034,3693); room at (2060,3600) s=0.70-0.77 walled NE.\n- The compound wall seems to enclo lace until clear\n        drive(-5,5); time.sleep(0.25)\n        continue\n    # wall follow right at ~0.25\n    if right>0.55 and rfront>0.4:\n        # right opening: arc right\n        drive(6,2)\n    elif right<0.16:\n        drive(3,6)\n    elif right>0.32:\n        drive(6,3)\n    else:\n        drive(6,6)\n    time.sleep(0.25)\n","src_backup/followL.py":"import sys, time, math, json\nsys.path.insert(0,'/bot/src')\nfrom lib import *\nLOG=open('/bot/followL.log','a',buffering=1)\ndef log(*a): print(time.strftime('%H:%M:%S'),*a,file=LOG)\nprev=[0.5]*16\ndef lid():\n    global prev\n    v=lidar()\n    if v is None: return prev\n    v=[prev[i] if v[i]<0 else v[i] for i in range(16)]\n    prev=v; return v\nstep=0\nt0=time.time()\nsmax=0\nwhile True:\n    step+=1\n    if goal():\n        drive(0,0); log('GOAL!')\n        open('/memory/GOAL.txt','a').write('GOAL by followL\\n')\n        break\n    v=lid()\n    front=min(v[15],v[0],v[1])\n    left=min(v[3],v[4])\n    lfront=v[2]\n    s=rdf(4)\n    if s and step%8==0:\n        smax=max(smax,s)\n        log(f'step{step} s={s} smax={smax} front={front:.2f} left={left:.2f}')\n    if front<0.22:\n        drive(5,-5); time.sleep(0.25); continue  # turn right\n    if left>0.55 and lfront>0.4:\n        drive(2,6)   # arc left\n    elif left<0.16:\n        drive(6,3)\n    elif left>0.32:\n        drive(3,6)\n    else:\n        drive(6,6)\n    time.sleep(0.25)\n","src_backup/goto.py":"import sys, time, math, json\nsys.path.insert(0,'/bot/src')\nfrom lib import *\nLOG=open('/bot/goto.log','a',buffering=1)\ndef log(*a): print(time.strftime('%H:%M:%S'),*a,file=LOG)\ndef angdiff(a,b):\n    d=(a-b)%360\n    return d-360 if d>180 else d\nprev=[0.5]*16\ndef lid():\n    global prev\n    v=lidar()\n    if v is None: return prev\n    v=[prev[i] if v[i]<0 else v[i] for i in range(16)]\n    prev=v; return v\ndef enc():\n    l=rdf(6); r=rdf(2)\n    return (l,r) if l is not None and r is not None else None\ndef turn_to(target,tol=14,tmax=10):\n    t0=time.time()\n    while time.time()-t0<tmax:\n        h=hdg(); d=angdiff(target,h)\n        if abs(d)<tol: drive(0,0); return True\n        s=4 if abs(d)<40 else 7\n        drive(-s,s) if d>0 else drive(s,-s)\n        time.sleep(0.15)\n    drive(0,0); return False\ndef pick(v,h,bias):\n    best,bs=None,-1e9\n    for k in range(16):\n        w=min(v[(k-1)%16],v[k],v[(k+1)%16])\n        if w<0.30: continue\n        sc=w*0.6-abs(angdiff((h+k*22.5)%360,bias))/180.0\n        if sc>bs: bs,best=sc,k\n    if best is None:\n        for k in range(16):\n            w=min(v[(k-1)%16],v[k],v[(k+1)%16])\n            if w>bs: bs,best=w,k\n    return (h+best*22.5)%360\nPOSE='/memory/pose.json'\nx,y=0.0,0.0\ntry:\n    with open(POSE) as f: p=json.load(f); x,y=p['x'],p['y']\nexcept Exception: pass\nlast=enc()\npf=open('/memory/points.csv','a',buffering=1)\nstep=0; lastsave=0\nlog('start pose',x,y)\nstuck=0; px,py=x,y\nwhile True:\n    step+=1\n    if goal():\n        drive(0,0); log('GOAL! pose',x,y)\n        with open('/memory/GOAL.txt','a') as f: f.write(f'GOAL by goto.py pose {x:.0f},{y:.0f}\\n')\n        break\n    try:\n        with open('/bot/target.json') as f: tg=json.load(f)\n        tx,ty=tg['x'],tg['y']\n    except Exception:\n        tx,ty=x,y\n    v=lid(); h=hdg()\n    e=enc()\n    if e and last:\n        d=((e[0]-last[0])+(e[1]-last[1]))/2.0\n        x+=d*math.cos(math.radians(h)); y+=d*math.sin(math.radians(h))\n    last=e\n    s=rdf(4)\n    if s is not None and step%3==0: pf.write(f'{x:.1f},{y:.1f},{s}\\n')\n    if time.time()-lastsave>5:\n        with open(POSE,'w') as f: json.dump({'x':x,'y':y},f)\n        lastsave=time.time()\n        log(f'pose ({x:.0f},{y:.0f}) s={s} tgt=({tx:.0f},{ty:.0f}) dist={math.hypot(tx-x,ty-y):.0f}')\n        # stuck detection\n        if math.hypot(x-px,y-py)<15: stuck+=1\n        else: stuck=0\n        px,py=x,y\n        if stuck>=2:\n            log('stuck! wall-follow escape 25s')\n            drive(-6,-6); time.sleep(1.0)\n            tesc=time.time()\n            while time.time()-tesc<25:\n                if goal():\n                    drive(0,0); log('GOAL during escape')\n                    open('/memory/GOAL.txt','a').write('GOAL during escape\\n')\n                    sys.exit(0)\n                vv=lid(); hh=hdg()\n                ee=enc()\n                if ee and last:\n                    dd=((ee[0]-last[0])+(ee[1]-last[1]))/2.0\n                    x+=dd*math.cos(math.radians(hh)); y+=dd*math.sin(math.radians(hh))\n                last=ee\n                fr=min(vv[15],vv[0],vv[1]); rt=min(vv[12],vv[13]); rf=vv[14]\n                if fr<0.22: drive(-5,5); time.sleep(0.25); continue\n                if rt>0.55 and rf>0.4: drive(6,2)\n                elif rt<0.16: drive(3,6)\n                elif rt>0.32: drive(6,3)\n                else: drive(6,6)\n                time.sleep(0.25)\n            stuck=0\n    if math.hypot(tx-x,ty-y)<60:\n        drive(0,0); log('ARRIVED at target'); time.sleep(2); continue\n    bias=math.degrees(math.atan2(ty-y,tx-x))%360\n    front=min(v[15],v[0],v[1])\n    dh=angdiff(bias,h)\n    if front>0.25 and abs(dh)<50:\n        steer=max(-2,min(2,dh/25))\n        l=min(v[1],v[2]); r=min(v[14],v[15])\n        if l<0.15: steer=min(steer,-1)\n        if r<0.15: steer=max(steer,1)\n        drive(6-steer,6+steer); time.sleep(0.3)\n    elif front>0.25:\n        turn_to(pick(v,h,bias))\n    else:\n        drive(-5,-5); time.sleep(0.6); drive(0,0)\n        turn_to(pick(lid(),hdg(),bias))\n","src_backup/hill.py":"import sys, time, math, random\nsys.path.insert(0,'/bot/src')\nfrom lib import *\nLOG=open('/bot/hill.log','a',buffering=1)\ndef log(*a): print(time.strftime('%H:%M:%S'),*a,file=LOG)\ndef angdiff(a,b):\n    d=(a-b)%360\n    return d-360 if d>180 else d\nprev=[0.5]*16\ndef lid():\n    global prev\n    v=lidar()\n    if v is None: return prev\n    v=[prev[i] if v[i]<0 else v[i] for i in range(16)]\n    prev=v; return v\ndef enc():\n    l=rdf(6); r=rdf(2)\n    return (l,r) if l is not None and r is not None else None\ndef med(n=10):\n    a=[]\n    for _ in range(n):\n        v=rdf(4)\n        if v is not None: a.append(v)\n        time.sleep(0.05)\n    a.sort(); return a[len(a)//2]\ndef turn_to(t,tol=12,tmax=9):\n    t0=time.time()\n    while time.time()-t0<tmax:\n        h=hdg(); d=angdiff(t,h)\n        if abs(d)<tol: drive(0,0); return True\n        s=4 if abs(d)<40 else 7\n        drive(-s,s) if d>0 else drive(s,-s)\n        time.sleep(0.15)\n    drive(0,0); return False\ndef chkgoal():\n    if goal():\n        drive(0,0); log('GOAL!')\n        open('/memory/GOAL.txt','a').write('GOAL by hill.py\\n')\n        sys.exit(0)\ndef openness(v,b,h):\n    k=int(((b-h)%360)/22.5+0.5)%16\n    return min(v[(k-1)%16],v[k],v[(k+1)%16])\nx,y=0.0,0.0\nlast=enc()\nbias=0.0\ns0=med()\nlog('start s',s0)\nleg=0\nwhile True:\n    chkgoal()\n    v=lid(); h=hdg()\n    # pick direction: candidates near bias that are open\n    cands=sorted(range(16), key=lambda k: abs(angdiff((h+k*22.5)%360,bias)))\n    tgt=None\n    for k in cands:\n        if min(v[(k-1)%16],v[k],v[(k+1)%16])>0.32:\n            tgt=(h+k*22.5)%360; break\n    if tgt is None:\n        k=max(range(16),key=lambda k:min(v[(k-1)%16],v[k],v[(k+1)%16]))\n        tgt=(h+k*22.5)%360\n    turn_to(tgt)\n    # drive a leg ~260 counts\n    sx,sy=x,y\n    dist=0; t0=time.time()\n    while dist<160 and time.time()-t0<14:\n        chkgoal()\n        v=lid(); h=hdg()\n        e=enc()\n        if e and last:\n            d=((e[0]-last[0])+(e[1]-last[1]))/2.0\n            dist+=abs(d)\n            x+=d*math.cos(math.radians(h)); y+=d*math.sin(math.radians(h))\n        last=e\n        fr=min(v[15],v[0],v[1])\n        if fr<0.20:\n            break\n        l=min(v[1],v[2]); r=min(v[14],v[15])\n        steer=0\n        if l<0.14: steer=-1\n        if r<0.14: steer=1\n        drive(6-steer,6+steer)\n        time.sleep(0.2)\n    drive(0,0)\n    s1=med()\n    db=math.degrees(math.atan2(y-sy,x-sx))%360 if dist>60 else bias\n    ds=s1-s0\n    leg+=1\n    log(f'leg{leg} moved {dist:.0f} brg {db:.0f} s {s0:.3f}->{s1:.3f} ds {ds:+.3f}')\n    if ds>0.004 and dist>60:\n        bias=db\n    elif ds<-0.004 or dist<=60:\n        bias=(db+180+random.uniform(-70,70))%360\n    # else keep bias\n    s0=s1\n","src_backup/hug.py":"import sys, time, math, json\nsys.path.insert(0,'/bot/src')\nfrom lib import *\nLOG=open('/bot/followL.log','a',buffering=1)\ndef log(*a): print(time.strftime('%H:%M:%S'),*a,file=LOG)\nprev=[0.5]*16\ndef lid():\n    global prev\n    v=lidar()\n    if v is None: return prev\n    v=[prev[i] if v[i]<0 else v[i] for i in range(16)]\n    prev=v; return v\nstep=0\nt0=time.time()\nsmax=0\nwhile True:\n    step+=1\n    if goal():\n        drive(0,0); log('GOAL!')\n        open('/memory/GOAL.txt','a').write('GOAL by followL\\n')\n        break\n    v=lid()\n    front=min(v[15],v[0],v[1])\n    left=min(v[3],v[4])\n    lfront=v[2]\n    s=rdf(4)\n    if s and step%8==0:\n        smax=max(smax,s)\n        log(f'step{step} s={s} smax={smax} front={front:.2f} left={left:.2f}')\n    if front<0.14:\n        drive(5,-5); time.sleep(0.25); continue  # turn right\n    if left>0.45 and lfront>0.35:\n        drive(3,6)   # arc left\n    elif left<0.10:\n        drive(6,4)\n    elif left>0.22:\n        drive(4,6)\n    else:\n        drive(6,6)\n    time.sleep(0.25)\n","src_backup/hugR.py":"import sys, time, math, json, os\nsys.path.insert(0,'/bot/src')\nfrom lib import *\nLOG=open('/bot/follow.log','a',buffering=1)\ndef log(*a): print(time.strftime('%H:%M:%S'),*a,file=LOG)\n\nprev=[0.5]*16\ndef lid():\n    global prev\n    v=lidar()\n    if v is None: return prev\n    v=[prev[i] if v[i]<0 else v[i] for i in range(16)]\n    prev=v; return v\ndef enc():\n    l=rdf(6); r=rdf(2)\n    return (l,r) if l is not None and r is not None else None\n\n# persistent pose\nPOSE='/memory/pose.json'\nx,y=0.0,0.0\ntry:\n    with open(POSE) as f: p=json.load(f); x,y=p['x'],p['y  if len(v)==16: return v\n        except Exception: pass\n        time.sleep(0.03)\n    return None\ndef hdg():\n    h=rdf(0)\n    return h if h is not None else 0.0\ndef goal():\n    s=rd(9)\n    return 'goal=1' in s\ndef drive(l,r): wr(3,l); wr(5,r)\n","src_backup/nav.py":"import sys, time, math, json, random, collections\nsys.path.insert(0,'/bot/src')\nfrom lib import *\nLOG=open('/bot/nav.log','a',buffering=1)\ndef log(*a): print(time.strftime('%H:%M:%S'),*a,file=LOG)\ndef angdiff(a,b):\n    d=(a-b)%360\n    return d-360 if d>180 else d\nprev=[0.5]*16\ndef lid():\n    global prev\n    v=lidar()\n    if v is None: return prev\n    v=[prev[i] if v[i]<0 else v[i] for i in range(16)]\n    prev=v; return v\ndef enc():\n    l=rdf(6); r=rdf(2)\n    return (l,r) if l is not None and r is not None else None\n\nSCALE=760.0   # counts per lidar unit\nCELL=120.0    # counts per grid cell\nMAXR=1.8      # trust lidar out to this many units\nfree=set(); wall=collections.Counter(); freec=collections.Counter()\nsamples=[]    # (x,y,s)\nx,y=0.0,0.0\nlast=enc()\ndef cell(px,py): return (int(math.floor(px/CELL)), int(math.floor(py/CELL)))\ndef update_map(v,h):\n    for i in range(16):\n        d=v[i]\n        if d<0: continue\n        b=math.radians((h+i*22.5)%360)\n        dd=min(d,MAXR)\n        # free along ray\n        steps=int(dd*SCALE/ (CELL*0.6))\n        for t in range(1,steps+1):\n            r=t*CELL*0.6\n            if r>dd*SCALE: break\n            c=cell(x+r*math.cos(b), y+r*math.sin(b))\n            freec[c]+=1\n        if d<MAXR:\n            c=cell(x+d*SCALE*math.cos(b), y+d*SCALE*math.sin(b))\n            wall[c]+=1\ndef is_free(c): return freec[c]>=2 and freec[c]>3*wall[c]\ndef is_wall(c): return wall[c]>=2 and not (freec[c]>3*wall[c])\n\ndef fit_goal():\n    if len(samples)<80: return None\n    data=samples[::max(1,len(samples)//400)]\n    best=None\n    xs=[p[0] for p in data]; ys=[p[1] for p in data]\n    cx,cy=sum(xs)/len(xs), sum(ys)/len(ys)\n    for gx in const $ = (s) => document.querySelector(s);
const css = (n) => getComputedStyle(document.documentElement)
  .getPropertyValue(n).trim();

/* header */
const st = D.stats, m = D.meta;
$("#subtitle").textContent =
  `episode ${m.episode} · arm ${m.arm} · labels ${m.labels} · ` +
  `${m.noise} · maze ${m.maze_hash} · ${m.model}`;
const chips = [
  st.live ? ["status", "IN PROGRESS", "state-live"]
          : st.solved ? ["status", "SOLVED", "state-solved"]
                      : ["status", (st.end_reason || "ended").toUpperCase(), ""],
  ["sim time", (st.final_tick / 50).toFixed(0) + " s", ""],
  st.solved && D.goal_tick ? ["solved at", (D.goal_tick / 50).toFixed(0) + " s", "state-solved"] : null,
  ["turns", st.turns, ""],
  ["output tokens", (st.tokens_out || 0).toLocaleString(), ""],
  ["collisions", st.collision_count, ""],
  (D.special && D.special.pickup_tick != null)
    ? ["key picked up", (D.special.pickup_tick / 50).toFixed(0) + " s",
       "state-solved"] : (D.maze.locked ? ["key", "not found", ""] : null),
  (D.special && D.special.unlock_tick != null)
    ? ["door unlocked", (D.special.unlock_tick / 50).toFixed(0) + " s",

];
$("#chips").innerHTML = chips.filter(Boolean).map(([k, v, cls]) =>
  `<span class="chip ${cls}">${k} <b>${v}</b></span>`).join("");

/* canvas replay */
const cv = $("#cv"), ctx = cv.getContext("2d");
const MZ = D.maze, P = D.poses;
let idx = P.length - 1, playing = false;
const collSet = new Set(D.collisions);

function draw() {
  const w = cv.width, h = cv.height;
  ctx.fillStyle = css("--surface");
  ctx.fillRect(0, 0, w, h);
  const worldW = MZ.width * MZ.cell_size, worldH = MZ.height * MZ.cell_size;
  const pad = 26;
  const sc = Math.min((w - 2 * pad) / worldW, (h - 2 * pad) / worldH);
  const X = (x) => pad + x * sc, Y = (y) => h - pad - y * sc;
  const cs = MZ.cell_size;

  ctx.globalAlpha = 0.16;
  ctx.fillStyle = css("--goal");
  ctx.fillRect(X(MZ.goal_cell[0] * cs), Y((MZ.goal_cell[1] + 1) * cs),
    cs * sc, cs * sc);
  ctx.fillStyle = css("--ink-3");
  ctx.fillRect(X(MZ.start_cell[0] * cs), Y((MZ.start_cell[1] + 1) * cs),
    cs * sc, cs * sc);
  ctx.globalAlpha = 1;
  ctx.fillStyle = css("--ink-2");
  ctx.font = `${Math.round(0.38 * cs * sc)}px Archivo, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("S", X((MZ.start_cell[0] + 0.5) * cs),
    Y((MZ.start_cell[1] + 0.5) * cs));
  ctx.fillText("G", X((MZ.goal_cell[0] + 0.5) * cs),
    Y((MZ.goal_cell[1] + 0.5) * cs));

  ctx.strokeStyle = css("--ink");
  ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath();
  for (const [x1, y1, x2, y2] of MZ.segments) {
    ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2));
  }
  ctx.stroke();
  const nowT = P.length ? P[Math.min(idx, P.length - 1)][0] : 0;
  const SP = D.special || {};
  if (MZ.locked && MZ.door_segments &&
      !(SP.unlock_tick != null && nowT >= SP.unlock_tick)) {
    ctx.strokeStyle = css("--hit");
    ctx.lineWidth = 5;
    ctx.beginPath();
    for (const [x1, y1, x2, y2] of MZ.door_segments) {
      ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2));
    }
    ctx.stroke();
  }
  if (MZ.locked && MZ.key_pos &&
      !(SP.pickup_tick != null && nowT >= SP.pickup_tick)) {
    ctx.save();
    ctx.translate(X(MZ.key_pos[0]), Y(MZ.key_pos[1]));
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = css("--robot");
    ctx.fillRect(-6, -6, 12, 12);
    ctx.restore();
  }

  if (!P.length) return;
  const upto = Math.min(idx, P.length - 1);
  ctx.strokeStyle = css("--trail");
  ctx.lineWidth = 1.7; ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(X(P[0][1]), Y(P[0][2]));
  for (let i = 1; i <= upto; i++) ctx.lineTo(X(P[i][1]), Y(P[i][2]));
  ctx.stroke();
  ctx.globalAlpha = 1;

  const [t, px, py, th, col] = P[upto];
  const rr = 0.09 * sc;
  if (col) {
    ctx.strokeStyle = css("--hit"); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(X(px), Y(py), rr + 5, 0, 7); ctx.stroke();
  }
  ctx.fillStyle = css("--robot");
  ctx.beginPath(); ctx.arc(X(px), Y(py), rr, 0, 7); ctx.fill();
  ctx.strokeStyle = css("--surface"); ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(X(px), Y(py));
  ctx.lineTo(X(px + 0.09 * Math.cos(th)), Y(py + 0.09 * Math.sin(th)));
  ctx.stroke();

  $("#clock").textContent =
    `tick ${t} · ${(t / 50).toFixed(1)} s`;
}

const scrub = $("#scrub");
scrub.max = Math.max(0, P.length - 1);
scrub.value = idx;
scrub.addEventListener("input", (e) => {
  idx = Number(e.target.value); stopPlay(); draw();
});
function stopPlay() { playing = false; $("#play").textContent = "PLAY"; }
$("#play").addEventListener("click", () => {
  playing = !playing;
  $("#play").textContent = playing ? "PAUSE" : "PLAY";
  if (playing) {
    if (idx >= P.length - 1) idx = 0;
    const stepN = Math.max(1, Math.round(P.length / 700));
    const tickFn = () => {
      if (!playing) return;
      idx = Math.min(idx + stepN, P.length - 1);
      scrub.value = idx;
      draw();
      if (idx >= P.length - 1) { stopPlay(); return; }
      requestAnimationFrame(tickFn);
    };
    requestAnimationFrame(tickFn);
  }
});
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target === document.body) {
    e.preventDefault(); $("#play").click();
  }
});

/* transcript */
const esc = (s) => { const d = document.createElement("i");
  d.textContent = s; return d.innerHTML; };
$("#feed").innerHTML = D.transcript.map((e) => {
  if (e.k === "agent") return `<div class="ev agent">${esc(e.t)}</div>`;
  if (e.k === "cmd") return `<div class="ev cmd">$ ${esc(e.t)}</div>`;
  if (e.k === "out") return `<div class="ev out">${esc(e.t)}</div>`;
  return `<div class="ev note">— ${esc(e.t)} —</div>`;
}).join("") || '<div class="empty">no transcript yet</div>';

$("#memlist").innerHTML = memNames.length
  ? memNames.map((p) =>
      `<details class="memfile"><summary>/memory/${esc(p)} ` +
      `(${D.memory[p].length}b)</summary><pre>${esc(D.memory[p])}` +
      `</pre></details>`).join("")
  : '<div class="empty">memory is empty so far</div>';

/* theme changes repaint the canvas */
matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement,
  { attributes: true, attributeFilter: ["data-theme"] });

draw();
</script>
