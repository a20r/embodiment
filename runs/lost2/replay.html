<title>Mazebot Long Haul</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #f7f6f3;
  --surface: #fcfcfb;
  --border: #e2e0da;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #8a897f;
  --robot: #2a78d6;
  --trail: #eb6834;
  --lidar: #1baf7a;
  --hit: #e34948;
  --goal: #008300;
  --chip: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141413;
    --surface: #1a1a19;
    --border: #33322e;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #8a897f;
    --robot: #3987e5;
    --trail: #d95926;
    --lidar: #199e70;
    --hit: #e66767;
    --goal: #35b135;
    --chip: #232320;
  }
}
:root[data-theme="dark"] {
  --ground: #141413;
  --surface: #1a1a19;
  --border: #33322e;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --ink-3: #8a897f;
  --robot: #3987e5;
  --trail: #d95926;
  --lidar: #199e70;
  --hit: #e66767;
  --goal: #35b135;
  --chip: #232320;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: Archivo, system-ui, sans-serif; font-size: 15px;
  line-height: 1.5;
}
header {
  padding: 20px 22px 14px; border-bottom: 1px solid var(--border);
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px;
}
h1 {
  font-family: "Martian Mono", monospace; font-size: 19px; margin: 0;
  letter-spacing: -0.02em;
}
.sub { color: var(--ink-2); font-size: 13.5px; }
.sub code { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 22px;
  border-bottom: 1px solid var(--border); }
.chip {
  background: var(--chip); border: 1px solid var(--border);
  border-radius: 4px; padding: 5px 11px; font-size: 12px;
  color: var(--ink-2); letter-spacing: 0.02em;
}
.chip b {
  font-family: "Martian Mono", monospace; font-size: 13px;
  color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums;
}
.chip.state-solved { border-color: var(--goal); color: var(--goal); }
.chip.state-live { border-color: var(--trail); color: var(--trail); }
main {
  display: grid; grid-template-columns: minmax(340px, 56%) 1fr;
  gap: 18px; padding: 18px 22px; align-items: start;
}
@media (max-width: 880px) { main { grid-template-columns: 1fr; } }
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
}
.panel-label {
  font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--ink-3); padding: 10px 14px 0;
}
#stage { padding: 8px 12px 4px; }
#cv { width: 100%; height: auto; display: block; }
.controls {
  display: flex; align-items: center; gap: 12px; padding: 8px 14px 14px;
}
button {
  font-family: "Martian Mono", monospace; font-size: 12px;
  background: var(--chip); color: var(--ink);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 7px 16px; cursor: pointer;
}
button:hover { border-color: var(--ink-3); }
button:focus-visible { outline: 2px solid var(--robot); outline-offset: 1px; }
input[type="range"] { flex: 1; accent-color: var(--trail); }
#clock {
  font-family: "Martian Mono", monospace; font-size: 12px;
  color: var(--ink-2); min-width: 150px; text-align: right;
  font-variant-numeric: tabular-nums;
}
.legend { display: flex; gap: 14px; padding: 0 14px 12px; flex-wrap: wrap;
  font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px;
  border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.col-right { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
#feed { max-height: 520px; overflow-y: auto; padding: 6px 14px 14px; }
.ev { margin: 10px 0; }
.ev.agent { font-size: 14px; }
.ev.agent::before {
  content: "AGENT"; display: block; font-size: 10px; letter-spacing: 0.09em;
  color: var(--ink-3); margin-bottom: 2px;
}
.ev.cmd, .ev.out {
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-word;
  padding: 7px 10px; border-radius: 4px;
}
.ev.cmd { background: var(--chip); border-left: 3px solid var(--robot); }
.ev.out { color: var(--ink-2); border-left: 3px solid var(--border);
  max-height: 150px; overflow-y: auto; }
.ev.note { color: var(--ink-3); font-style: italic; font-size: 13px;
  text-align: center; }
#memlist { padding: 6px 14px 14px; }
.memfile { margin: 8px 0; }
.memfile summary {
  font-family: "IBM Plex Mono", monospace; font-size: 12.5px;
  cursor: pointer; color: var(--ink); padding: 4px 0;
}
.memfile pre {
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-word; color: var(--ink-2);
  background: var(--chip); padding: 10px; border-radius: 4px; margin: 4px 0;
}
.empty { color: var(--ink-3); padding: 10px 14px 16px; font-size: 13px; }
footer { color: var(--ink-3); font-size: 12px; padding: 4px 22px 24px; }
</style>

<header>
  <h1>Mazebot Long Haul</h1>
  <span class="sub" id="subtitle"></span>
</header>
<div class="chips" id="chips"></div>
<main>
  <section class="panel">
    <div class="panel-label">Ground truth — top-down replay</div>
    <div id="stage"><canvas id="cv" width="960" height="960"></canvas></div>
    <div class="controls">
      <button id="play" aria-label="play or pause replay">PLAY</button>
      <input type="range" id="scrub" min="0" max="0" value="0"
        aria-label="replay position">
      <span id="clock"></span>
    </div>
    <div class="legend">
      <span><i style="background:var(--robot)"></i>robot</span>
      <span><i style="background:var(--trail)"></i>trail</span>
      <span><i style="background:var(--hit)"></i>collision</span>
      <span><i style="background:var(--goal)"></i>goal cell</span>
    </div>
  </section>
  <div class="col-right">
    <section class="panel">
      <div class="panel-label">Agent transcript</div>
      <div id="feed"></div>
    </section>
    <section class="panel">
      <div class="panel-label">/memory — what it left for its future self</div>
      <div id="memlist"></div>
    </section>
  </div>
</main>
<footer>
  Recorded by the Mazebot platform's ground-truth log. The agent never
  sees this view — inside its container the world is only
  <code>/dev/robot</code> device files.
</footer>

         fx,fy=nav.x+1.2*math.cos(ang), nav.y+1.2*math.sin(ang)\n            sc += 1.3 if visits[cell(fx,fy)]==0 else 0.15\n        if abs(wrap(22.5*i-180))<34: sc-=0.8\n        if abs(wrap(absang-lastdir))<25: sc+=0.3\n        sc+=random.uniform(0,0.05)\n        if sc>bestsc: bestsc,best,bestray=sc,i,s[i]\n    for k in dirpen: dirpen[k]*=0.6\n    if best is None:\n        L(f\"boxed ({nav.x:.2f},{nav.y:.2f})\"); nav.drive(-70,-70); time.sleep(0.8); nav.drive(0,0)\n        continue\n    tdir=(hd+22.5*best)%360\n    lastdir=tdir\n    if time.time()-lastlog>2:\n        lastlog=time.time()\n        L(f\"pos=({nav.x:.2f},{nav.y:.2f}) h={hd:.0f} ray{best} abs={tdir:.0f} sc={bestsc:.2f} d={bestray:.2f} v={visits[cell(nav.x,nav.y)]} d0={nav.p0.read()}\")\n    if best!=0: nav.turn_to(tdir)\n    r=nav.step(dist=min(max(0.3,bestray-0.3),0.8))\n    if r==\"goal\": L(\"GOAL!!!\"); break\n    if r in (\"bump\",\"blocked\"):\n        sect=int(tdir//22.5)%16\n        dirpen[sect]+=1.2\n        ang=math.radians(tdir)\n        visits[cell(nav.x+0.25*math.cos(ang),nav.y+0.25*math.sin(ang))]+=2\n    if time.time()-lastsave>30:\n        lastsave=time.time(); savev()\n    time.sleep(0.05)\nnav.drive(0,0); savev(); L(\"ctrl6 exit\")\n","ctrl7.out":"","ctrl7.py":"import nav, math, time, collections, json\n\nlog=open(\"/memory/run.log\",\"a\",buffering=1)\ndef L(*a): print(time.strftime(\"%H:%M:%S\"),*a,file=log)\n\nCELL=0.35\nvisits=collections.Counter()\ntry:\n    for k,v in json.load(open(\"/memory/visits.json\")).items():\n        a,b=k.split(\",\"); visits[(int(a),int(b))]=v\nexcept Exception: pass\ndef cell(px,py): return (round(px/CELL), round(py/CELL))\ndef savev():\n    json.dump({f\"{a},{b}\":v for (a,b),v in visits.items()}, open(\"/memory/visits.json\",\"w\"))\n    nav.save()\n\nL(f\"=== ctrl7 RH-wall-follower start ({nav.x:.2f},{nav.y:.2f})\")\nt0=time.time(); lastsave=0; lastlog=0\n# rightmost-first relative sector order (right-hand rule):\nORDER=[12,13,14,15,0,1,2,3,4,5,6,7,8]\nwhile time.time()-t0<3300:\n    nav.upd()\n    if nav.GOAL: L(\"GOAL!!!\"); break\n    s=nav.get_scan()\n    visits[cell(nav.x,nav.y)]+=1\n    hd=math.degrees(nav.H)\n    pick=None\n    for i in ORDER:\n        cone=min(s[(i-1)%16], s[i], s[(i+1)%16])\n        if s[i]>0.40 and cone>0.30:\n            pick=i; break\n    if pick is None:\n        for i in ORDER:\n            if s[i]>0.35 and min(s[(i-1)%16],s[i],s[(i+1)%16])>0.25:\n                pick=i; break\n    if pick is None:\n        L(f\"boxed ({nav.x:.2f},{nav.y:.2f}) scan={','.join('%.2f'%v for v in s)}\")\n        nav.drive(-70,-70); time.sleep(0.8); nav.drive(0,0)\n        continue\n    tdir=(hd+22.5*pick)%360\n    if time.time()-lastlog>2:\n        lastlog=time.time()\n        L(f\"RH pos=({nav.x:.2f},{nav.y:.2f}) h={hd:.0f} pick{pick} abs={tdir:.0f} d={s[pick]:.2f} d0={nav.p0.read()}\")\n    if pick!=0: nav.turn_to(tdir)\n    r=nav.step(dist=0.32)\n    if r==\"goal\": L(\"GOAL!!!\"); break\n    if time.time()-lastsave>30: lastsave=time.time(); savev()\n    time.sleep(0.04)\nnav.drive(0,0); savev(); L(\"ctrl7 exit\")\n","nav.py":"import os, time, math, json\n\nclass Port:\n    def __init__(self, n, mode):\n        p=f\"/dev/robot/d{n}\"\n        if mode=='r':\n            self.fd=os.open(p, os.O_RDONLY|os.O_NONBLOCK); self.buf=b\"\"; self.last=None\n        else:\n            self.fd=os.open(p, os.O_WRONLY|os.O_NONBLOCK)\n    def read(self):\n        try:\n            while True:\n                d=os.read(self.fd,65536)\n                if not d: break\n                self.buf+=d\n        except BlockingIOError: pass\n        if b\"\\n\" in self.buf:\n            ls=self.buf.split(b\"\\n\"); self.buf=ls[-1]; self.last=ls[-2].decode()\n        return self.last\n    def write(self,s):\n        try: os.write(self.fd,(s+\"\\n\").encode())\n        except (BlockingIOError, BrokenPipeError): pass\n\nlidar=Port(1,'r'); encA=Port(2,'r'); head=Port(3,'r'); stat=Port(4,'r')\nbump=Port(5,'r'); p0=Port(0,'r'); encB=Port(8,'r')\nmA=Port(6,'w'); mB=Port(7,'w')\n_lc=(None,None)\ndef drive(a,b):\n    global _lc\n    a,b=int(a),int(b)\n    if (a,b)!=_lc:\n        mA.write(str(a)); mB.write(str(b)); _lc=(a,b)\n\nSTATE_FILE=\"/memory/pose.json\"\ntry:\n    _s=json.load(open(STATE_FILE))\n    x,y=_s[\"x\"],_s[\"y\"]\nexcept Exception:\n    x=y=0.0\nea=eb=None; H=0.0\nUPC=0.00044\nprev=[0.5]*16\nGOAL=False\n\ndef get_scan():\n    global prev\n    s=lidar.read()\n    if s is None: return prev\n    v=[float(t) for t in s.split(\",\")]\n    prev=[prev[i] if t<0 else t for i,t in enumerate(v)]\n    return prev\n\ndef upd():\n    global x,y,ea,eb,H,GOAL\n    h=head.read()\n    if h is not None:\n        try: H=math.radians(float(h))\n        except: pass\n    st=stat.read() or \"\"\n    if \"goal=1\" in st:\n        drive(0,0)\n        open(\"/memory/GOAL.txt\",\"a\").write(time.strftime(\"%H:%M:%S\")+\" GOAL \"+st+f\" pos {x:.2f} {y:.2f}\\n\")\n        GOAL=True\n    a=encA.read(); b=encB.read()\n    try: na,nb=int(a),int(b)\n    except: return\n    global ea,eb\n    if ea is not None:\n        d=((na-ea)+(nb-eb))/2.0*UPC\n        x+=d*math.cos(H); y+=d*math.sin(H)\n    ea,eb=na,nb\n\ndef save():\n    json.dump({\"x\":x,\"y\":y}, open(STATE_FILE,\"w\"))\n\ndef wrap(a): return (a+180)%360-180\n\ndef turn_to(tdeg, tol=6, timeout=10):\n    t0=time.time()\n    while time.time()-t0<timeout:\n        upd()\n        if GOAL: return\n        err=wrap(tdeg-math.degrees(H))\n        if abs(err)<tol: break\n        sp=max(15,min(50,abs(err)))\n        drive(sp if err>0 else -sp, -sp if err>0 else sp)\n        time.sleep(0.04)\n    drive(0,0); time.sleep(0.15); upd()\n\n_trace=open(\"/memory/trace.txt\",\"a\",buffering=1)\ndef step(dist=0.3, timeout=8, fstop=0.16):\n    sx,sy=x,y; t0=time.time(); res=\"ok\"\n    n=0\n    while time.time()-t0<timeout:\n        upd()\n        if GOAL: return \"goal\"\n        s=get_scan()\n        z=p0.read()\n        if z not in (None,\"0\"):\n            _trace.write(f\"D0 {z} {x:.3f} {y:.3f}\\n\")\n        n+=1\n        if n%5==0:\n            _trace.write(f\"P {x:.3f} {y:.3f} {math.degrees(H):.1f} {' '.join('%.2f'%v for v in s)}\\n\")\n        if bump.read()==\"1\":\n            drive(-70,-70); time.sleep(0.4); drive(0,0); res=\"bump\"; break\n        f=min(s[0],s[1],s[15])\n        if f<fstop: res=\"blocked\"; break\n        if math.hypot(x-sx,y-sy)>=dist: break\n        corr=0\n        l=min(s[3],s[4]); r=min(s[12],s[13])\n        if l<0.3 and r<0.3: corr=max(-14,min(14,int((l-r)*90)))\n        elif l<0.14: corr=-12\n        elif r<0.14: corr=12\n        sp=95 if f>0.4 else 55\n        drive(sp+corr, sp-corr)\n        time.sleep(0.04)\n    drive(0,0); upd(); save()\n    return res\n\ndef survey(fn=\"/memory/cloud.txt\"):\n    # rotate ~370deg, log wall points in world frame\n    upd()\n    out=open(fn,\"a\")\n    h0=math.degrees(H); acc=0; lasth=h0\n    drive(22,-22)\n    t0=time.time()\n    while acc<370 and time.time()-t0<40:\n        upd()\n        if GOAL: break\n        s=get_scan()\n        hd=math.degrees(H)\n        d=wrap(hd-lasth); acc+=abs(d); lasth=hd\n        for i,dist in enumerate(s):\n            a=math.radians(hd+22.5*i)\n            typ = \"w\" if dist<1.45 else \"f\"\n            dd=min(dist,1.45)\n            out.write(f\"{x+dd*math.cos(a):.3f} {y+dd*math.sin(a):.3f} {typ}\\n\")\n        time.sleep(0.05)\n    drive(0,0); out.close(); save()\n\ndef goto(tx,ty,tol=0.18,timeout=60):\n    t0=time.time()\n    while time.time()-t0<timeout:\n        upd()\n        if GOAL: return \"goal\"\n        dx,dy=tx-x,ty-y\n        if math.hypot(dx,dy)<tol: return \"ok\"\n        tdeg=math.degrees(math.atan2(dy,dx))%360\n        if abs(wrap(tdeg-math.degrees(H)))>14: turn_to(tdeg)\n        r=step(min(0.3,math.hypot(dx,dy)), fstop=0.16)\n        if r in (\"bump\",\"blocked\"):\n            return r\n    return \"timeout\"\n","notes.md":"# Robot notes (episode 1)\n/dev/robot ports (FIFOs, ASCII lines):\n- d0: read, always 0 so far (unknown; maybe collision/goal-ish?)\n- d1: read, 16 lidar rays, floats ~0..1 (maybe max 1.0), -1 = dropout/no return.\n  Ray 0/1/15 decrease when driving forward -> ray0 ~ front.\n- d2: read, LEFT? wheel encoder (counts, increases when driving fwd)\n- d3: read, heading degrees 0-360, noisy +-2deg\n- d4: read, \"tick=N goal=0\" -- goal flag! tick ~145/s\n- d5: read, 0 normally, 1 when very close/pressed against wall (bump/prox)\n- d6: WRITE left wheel speed (e.g. \"10\")\n- d7: WRITE right wheel speed\n- d8: read, other wheel encoder\nWriting d6=x,d7=x drives; d6=5,d7=-5 spins (heading increased -> pos left, neg right = turn CCW? check).\nSpeed 10 both: encoders +~140 counts/s.\nGoal: make d4 goal=1 presumably.\n\n## Findings (later ep1)\n- FIFOs: keep persistent nonblocking fds, read all, keep last line. Works.\n- IMPORTANT: don't spam writes to d6/d7 -> buffer fills -> BlockingIOError. Dedupe cmds + try/except.\n- pkill -f <name> kills your own bash tool shell (cmdline match). Use pid files.\n- d6>d7 => heading (d3) INCREASES. heading+ direction = ray4 side. ray k = heading + k*22.5 deg.\n- Encoders: d2,d8, ~0.00044 units/count. cmd~linear 3.8 counts/s/unit, saturates ~250.\n- Bump d5=1 at ~0.10 front dist. Lidar range up to ~1.9+ seen. Corridors ~0.4-0.6 wide, walls at 0.2-0.3 side.\n- Maze does NOT look axis-aligned to compass (openings at ~140/320 deg at one spot).\n- tick in d4 ~100-200/s. goal=0 always so far. d0 always 0 so far (unknown).\n- Robot state persists across my scripts (sim keeps running; encoders keep counting).\n- ctrl5.py = stop-scan-pick-direction explorer w/ visit counts (works, slowish).\n\n## Ep1 later\n- Explored region bounded ~x[-0.6,3.3] y[-0.7,3.2] (odometry units, ctrl6 frame). Dense coverage, no goal flag.\n- All FIFOs opened RDWR by sim; can't detect actuators by open test. Wrote junk to d0: no visible effect.\n- ctrl7 = discrete right-hand wall follower (nav.py primitives: turn_to/step/survey/goto).\n- cloud.txt: wall const $ = (s) => document.querySelector(s);
const css = (n) => getComputedStyle(document.documentElement)
  .getPropertyValue(n).trim();

/* header */
const st = D.stats, m = D.meta;
$("#subtitle").textContent =
  `episode ${m.episode} · arm ${m.arm} · labels ${m.labels} · ` +
  `${m.noise} · maze ${m.maze_hash} · ${m.model}`;
const chips = [
  st.live ? ["status", "IN PROGRESS", "state-live"]
          : st.solved ? ["status", "SOLVED", "state-solved"]
                      : ["status", (st.end_reason || "ended").toUpperCase(), ""],
  ["sim time", (st.final_tick / 50).toFixed(0) + " s", ""],
  st.solved && D.goal_tick ? ["solved at", (D.goal_tick / 50).toFixed(0) + " s", "state-solved"] : null,
  ["turns", st.turns, ""],
  ["output tokens", (st.tokens_out || 0).toLocaleString(), ""],
  ["collisions", st.collision_count, ""],
  (D.special && D.special.pickup_tick != null)
    ? ["key picked up", (D.special.pickup_tick / 50).toFixed(0) + " s",
       "state-solved"] : (D.maze.locked ? ["key", "not found", ""] : null),
  (D.special && D.special.unlock_tick != null)
    ? ["door unlocked", (D.special.unlock_tick / 50).toFixed(0) + " s",
       "state-solved"] : (D.maze.locked ? ["door", "locked", ""] : null),
];
$("#chips").innerHTML = chips.filter(Boolean).map(([k, v, cls]) =>
  `<span class="chip ${cls}">${k} <b>${v}</b></span>`).join("");

/* canvas replay */
const cv = $("#cv"), ctx = cv.getContext("2d");
const MZ = D.maze, P = D.poses;
let idx = P.length - 1, playing = false;
const collSet = new Set(D.collisions);

function draw() {
  const w = cv.width, h = cv.height;
  ctx.fillStyle = css("--surface");
  ctx.fillRect(0, 0, w, h);
  const worldW = MZ.width * MZ.cell_size, worldH = MZ.height * MZ.cell_size;
  const pad = 26;
  const sc = Math.min((w - 2 * pad) / worldW, (h - 2 * pad) / worldH);
  const X = (x) => pad + x * sc, Y = (y) => h - pad - y * sc;
  const cs = MZ.cell_size;

  ctx.globalAlpha = 0.16;
  ctx.fillStyle = css("--goal");
  ctx.fillRect(X(MZ.goal_cell[0] * cs), Y((MZ.goal_cell[1] + 1) * cs),
    cs * sc, cs * sc);
  ctx.fillStyle = css("--ink-3");
  ctx.fillRect(X(MZ.start_cell[0] * cs), Y((MZ.start_cell[1] + 1) * cs),
    cs * sc, cs * sc);
  ctx.globalAlpha = 1;
  ctx.fillStyle = css("--ink-2");
  ctx.font = `${Math.round(0.38 * cs * sc)}px Archivo, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("S", X((MZ.start_cell[0] + 0.5) * cs),
    Y((MZ.start_cell[1] + 0.5) * cs));
  ctx.fillText("G", X((MZ.goal_cell[0] + 0.5) * cs),
    Y((MZ.goal_cell[1] + 0.5) * cs));

  ctx.strokeStyle = css("--ink");
  ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath();
  for (const [x1, y1, x2, y2] of MZ.segments) {
    ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2));
  }
  ctx.stroke();
  const nowT = P.length ? P[Math.min(idx, P.length - 1)][0] : 0;
  const SP = D.special || {};
  if (MZ.locked && MZ.door_segments &&
      !(SP.unlock_tick != null && nowT >= SP.unlock_tick)) {
    ctx.strokeStyle = css("--hit");
    ctx.lineWidth = 5;
    ctx.beginPath();
    for (const [x1, y1, x2, y2] of MZ.door_segments) {
      ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2));
    }
    ctx.stroke();
  }
  if (MZ.locked && MZ.key_pos &&
      !(SP.pickup_tick != null && nowT >= SP.pickup_tick)) {
    ctx.save();
    ctx.translate(X(MZ.key_pos[0]), Y(MZ.key_pos[1]));
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = css("--robot");
    ctx.fillRect(-6, -6, 12, 12);
    ctx.restore();
  }

  if (!P.length) return;
  const upto = Math.min(idx, P.length - 1);
  ctx.strokeStyle = css("--trail");
  ctx.lineWidth = 1.7; ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(X(P[0][1]), Y(P[0][2]));
  for (let i = 1; i <= upto; i++) ctx.lineTo(X(P[i][1]), Y(P[i][2]));
  ctx.stroke();
  ctx.globalAlpha = 1;

  const [t, px, py, th, col] = P[upto];
  const rr = 0.09 * sc;
  if (col) {
    ctx.strokeStyle = css("--hit"); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(X(px), Y(py), rr + 5, 0, 7); ctx.stroke();
  }
  ctx.fillStyle = css("--robot");
  ctx.beginPath(); ctx.arc(X(px), Y(py), rr, 0, 7); ctx.fill();
  ctx.strokeStyle = css("--surface"); ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(X(px), Y(py));
  ctx.lineTo(X(px + 0.09 * Math.cos(th)), Y(py + 0.09 * Math.sin(th)));
  ctx.stroke();

  $("#clock").textContent =
    `tick ${t} · ${(t / 50).toFixed(1)} s`;
}

const scrub = $("#scrub");
scrub.max = Math.max(0, P.length - 1);
scrub.value = idx;
scrub.addEventListener("input", (e) => {
  idx = Number(e.target.value); stopPlay(); draw();
});
function stopPlay() { playing = false; $("#play").textContent = "PLAY"; }
$("#play").addEventListener("click", () => {
  playing = !playing;
  $("#play").textContent = playing ? "PAUSE" : "PLAY";
  if (playing) {
    if (idx >= P.length - 1) idx = 0;
    const stepN = Math.max(1, Math.round(P.length / 700));
    const tickFn = () => {
      if (!playing) return;
      idx = Math.min(idx + stepN, P.length - 1);
      scrub.value = idx;
      draw();
      if (idx >= P.length - 1) { stopPlay(); return; }
      requestAnimationFrame(tickFn);
    };
    requestAnimationFrame(tickFn);
  }
});
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target === document.body) {
    e.preventDefault(); $("#play").click();
  }
});

/* transcript */
const esc = (s) => { const d = document.createElement("i");
  d.textContent = s; return d.innerHTML; };
$("#feed").innerHTML = D.transcript.map((e) => {
  if (e.k === "agent") return `<div class="ev agent">${esc(e.t)}</div>`;
  if (e.k === "cmd") return `<div class="ev cmd">$ ${esc(e.t)}</div>`;
  if (e.k === "out") return `<div class="ev out">${esc(e.t)}</div>`;
  return `<div class="ev note">— ${esc(e.t)} —</div>`;
}).join("") || '<div class="empty">no transcript yet</div>';

/* memory */
const memNames = Object.keys(D.memory);
$("#memlist").innerHTML = memNames.length
  ? memNames.map((p) =>
      `<details class="memfile"><summary>/memory/${esc(p)} ` +
      `(${D.memory[p].length}b)</summary><pre>${esc(D.memory[p])}` +
      `</pre></details>`).join("")
  : '<div class="empty">memory is empty so far</div>';

/* theme changes repaint the canvas */
matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement,
  { attributes: true, attributeFilter: ["data-theme"] });

draw();
</script>
