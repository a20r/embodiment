<title>Mazebot Shakedown</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #f7f6f3;
  --surface: #fcfcfb;
  --border: #e2e0da;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #8a897f;
  --robot: #2a78d6;
  --trail: #eb6834;
  --lidar: #1baf7a;
  --hit: #e34948;
  --goal: #008300;
  --chip: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141413;
    --surface: #1a1a19;
    --border: #33322e;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #8a897f;
    --robot: #3987e5;
    --trail: #d95926;
    --lidar: #199e70;
    --hit: #e66767;
    --goal: #35b135;
    --chip: #232320;
  }
}
:root[data-theme="dark"] {
  --ground: #141413;
  --surface: #1a1a19;
  --border: #33322e;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --ink-3: #8a897f;
  --robot: #3987e5;
  --trail: #d95926;
  --lidar: #199e70;
  --hit: #e66767;
  --goal: #35b135;
  --chip: #232320;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: Archivo, system-ui, sans-serif; font-size: 15px;
  line-height: 1.5;
}
header {
  padding: 20px 22px 14px; border-bottom: 1px solid var(--border);
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px;
}
h1 {
  font-family: "Martian Mono", monospace; font-size: 19px; margin: 0;
  letter-spacing: -0.02em;
}
.sub { color: var(--ink-2); font-size: 13.5px; }
.sub code { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 22px;
  border-bottom: 1px solid var(--border); }
.chip {
  background: var(--chip); border: 1px solid var(--border);
  border-radius: 4px; padding: 5px 11px; font-size: 12px;
  color: var(--ink-2); letter-spacing: 0.02em;
}
.chip b {
  font-family: "Martian Mono", monospace; font-size: 13px;
  color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums;
}
.chip.state-solved { border-color: var(--goal); color: var(--goal); }
.chip.state-live { border-color: var(--trail); color: var(--trail); }
main {
  display: grid; grid-template-columns: minmax(340px, 56%) 1fr;
  gap: 18px; padding: 18px 22px; align-items: start;
}
@media (max-width: 880px) { main { grid-template-columns: 1fr; } }
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
}
.panel-label {
  font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--ink-3); padding: 10px 14px 0;
}
#stage { padding: 8px 12px 4px; }
#cv { width: 100%; height: auto; display: block; }
.controls {
  display: flex; align-items: center; gap: 12px; padding: 8px 14px 14px;
}
button {
  font-family: "Martian Mono", monospace; font-size: 12px;
  background: var(--chip); color: var(--ink);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 7px 16px; cursor: pointer;
}
button:hover { border-color: var(--ink-3); }
button:focus-visible { outline: 2px solid var(--robot); outline-offset: 1px; }
input[type="range"] { flex: 1; accent-color: var(--trail); }
#clock {
  font-family: "Martian Mono", monospace; font-size: 12px;
  color: var(--ink-2); min-width: 150px; text-align: right;
  font-variant-numeric: tabular-nums;
}
.legend { display: flex; gap: 14px; padding: 0 14px 12px; flex-wrap: wrap;
  font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px;
  border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.col-right { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
#feed { max-height: 520px; overflow-y: auto; padding: 6px 14px 14px; }
.ev { margin: 10px 0; }
.ev.agent { font-size: 14px; }
.ev.agent::before {
  content: "AGENT"; display: block; font-size: 10px; letter-spacing: 0.09em;
  color: var(--ink-3); margin-bottom: 2px;
}
.ev.cmd, .ev.out {
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-word;
  padding: 7px 10px; border-radius: 4px;
}
.ev.cmd { background: var(--chip); border-left: 3px solid var(--robot); }
.ev.out { color: var(--ink-2); border-left: 3px solid var(--border);
  max-height: 150px; overflow-y: auto; }
.ev.note { color: var(--ink-3); font-style: italic; font-size: 13px;
  text-align: center; }
#memlist { padding: 6px 14px 14px; }
.memfile { margin: 8px 0; }
.memfile summary {
  font-family: "IBM Plex Mono", monospace; font-size: 12.5px;
  cursor: pointer; color: var(--ink); padding: 4px 0;
}
.memfile pre {
  font-family: "IBM Plex Mono", monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-word; color: var(--ink-2);
  background: var(--chip); padding: 10px; border-radius: 4px; margin: 4px 0;
}
.empty { color: var(--ink-3); padding: 10px 14px 16px; font-size: 13px; }
footer { color: var(--ink-3); font-size: 12px; padding: 4px 22px 24px; }
</style>

<header>
  <h1>Mazebot Shakedown</h1>
  <span class="sub" id="subtitle"></span>
</header>
<div class="chips" id="chips"></div>
<main>
  <section class="panel">
    <div class="panel-label">Ground truth — top-down replay</div>
    <div id="stage"><canvas id="cv" width="960" height="960"></canvas></div>
    <div class="controls">
      <button id="play" aria-label="play or pause replay">PLAY</button>
      <input type="range" id="scrub" min="0" max="0" value="0"
        aria-label="replay position">
      <span id="clock"></span>
    </div>
    <div class="legend">
      <span><i style="background:var(--robot)"></i>robot</span>
      <span><i style="background:var(--trail)"></i>trail</span>
      <span><i style="background:var(--hit)"></i>collision</span>
      <span><i style="background:var(--goal)"></i>goal cell</span>
    </div>
  </section>
  <div class="col-right">
    <section class="panel">
      <div class="panel-label">Agent transcript</div>
      <div id="feed"></div>
    </section>
    <section class="panel">
      <div class="panel-label">/memory — what it left for its future self</div>
      <div id="memlist"></div>
    </section>
  </div>
</main>
<footer>
  Recorded by the Mazebot platform's ground-truth log. The agent never
  sees this view — inside its container the world is only
  <code>/dev/robot</code> device files.
</footer>

eft',100); w('motor_right',100)\ntime.sleep(1.0)\nw('motor_left',0); w('motor_right',0)\ntime.sleep(0.3)\nprint('after', r('encoder_left'), r('encoder_right'), r"},{"k":"out","t":"before 1 0 358.7 0.741\nafter 261 246 355.2 0.609\n"},{"k":"cmd","t":"cd src; cat > probe2.py <<'EOF'\nimport time\ndef r(dev):\n    for _ in range(5):\n        try:\n            with open('/dev/robot/'+dev) as f:\n                s=f.read().strip()\n            if s: return s\n        except: pass\n        time.sleep(0.02)\n    return ''\ndef w(dev,v):\n    with open('/dev/robot/'+dev,'w') as f: f.write(str(v)+'\\n')\nprint('before', r('heading'), r('encoder_left'), r('encoder_right'))\nw('motor_left',-100); w('motor_right',100)\ntime.sleep(0.5)\nw('motor_left',0); w('motor_right',0)\ntime.sleep(0.3)\nprint('after', r('heading'), r('encoder_left'), r('encoder_right'))\nEOF\npython3"},{"k":"out","t":"before 357.8 262 247\nafter 45.1 132 368\n"},{"k":"agent","t":"Motors and sensors work. ~1900 ticks/m, PWM 100 \u2248 0.13 m/s, spin ~94\u00b0/s. Maze looks like 0.5 m grid cells. I'll write a left-hand wall follower with heading-closed-loop turns."},{"k":"cmd","t":"cd src; cat > drive.py <<'EOF'\nimport time, math, sys\n\ndef rdev(dev):\n    for _ in range(8):\n        try:\n            with open('/dev/robot/'+dev) as f:\n                s=f.read().strip()\n            if s: return s\n        except: pass\n        time.sleep(0.01)\n    return ''\n\ndef w(dev,v):\n    with open('/dev/robot/'+dev,'w') as f: f.write(str(int(v))+'\\n')\n\ndef stop(): w('motor_left',0); w('motor_right',0)\n\ndef heading():\n    s=rdev('heading')\n    return float(s) if s else None\n\ndef lidar():\n    s=rdev('lidar')\n    if not s: return None\n    v=[float(x) for x in s.split(',')]\n    return [9.9 if"},{"k":"out","t":"started 70\n"},{"k":"cmd","t":"sleep 20; tail -15 src/drive.out; timeout 2 cat /dev/robot/status"},{"k":"out","t":"tick=4949 goal=0\n"},{"k":"cmd","t":"ps aux | grep drive; tail -20 /memory/run.log umerate(lines) if l.startswith('start heading'))\nx=y=0; path=[(0,0)]\ndirs={0:(1,0),90:(0,1),180:(-1,0),270:(0,-1)}\nfor ln in lines[idx:]:\n    m=re.match(r'step \\d+ h (\\d+) F [\\d.]+ L [\\d.]+ R [\\d.]+ -> (\\w+)',ln)\n    if not m: continue\n    h=int(m.group(1)); c=m.group(2)\n    h={'left':(h+90)%360,'right':(h-90)%360,'back':(h+180"},{"k":"out","t":"# Episode 1 SOLVED via left-hand wall follow (135 steps, ~9 min)\nStart cell (0,0) facing heading 0 (+x). Goal cell: (5, 2)\nGrid: +x=heading0, +y=heading90(CCW/left). Cell=0.5m.\n\nShortest known path (17 moves) through mapped passages:\n[(0, 0), (1, 0), (1, -1), (1, -2), (1, -3), (1, -4), (1, -5), (2, -5), (2, -4), (2, -3), (2, -2), (2, -1), (2, 0), (3, 0), (4, 0), (5, 0), (5, 1), (5, 2)]\n\nNext episode: verify start heading ~0 and initial lidar F~0.75,L~0.24,R~0.24; then just follow this cell path with drive.py primitives (turn_to snapped heading, forward 0.5m). If early lidar readings mismatch run.log episode-1 step 0-3 pattern, maze/start may differ -> fall back to left-hand follower (/memory"},{"k":"cmd","t":"python3 - <<'EOF'\nadd=\"\"\"\n## IMPORTANT CAVEAT on coordinates\nThe (0,0) origin above is NOT the episode start! It is where run 2 of the\ncontroller began: mid-maze, after run 1 crashed (encoder parse bug) ~8 steps\nin, hit a wall, and the fixed script restarted facing 180. True episode start\nwas ~8 cells away (run 1 trace = first 9 'step' lines in run.log, starting\nsnap-heading 90, but note probes had already moved robot ~0.13m fwd and +47deg\nbefore run 1).\n=> Do NOT blindly replay the 17-move path from the episode start.\n\n## Recommended plan for next episode (15 min budget)\n1. Just run the prove"},{"k":"out","t":"saved. files:\n  drive.py 3347\n  replay.py 616\n  NOTES.md 1934\n  run.log 0\n  SOLUTION.md 1895\n  run_ep1.log 6807\n"},{"k":"agent","t":"Episode solved \u2014 goal reached after 135 steps (~9 minutes) of left-hand wall following.\n\nFinal state of `/memory` for my future self:\n- **NOTES.md** \u2014 hardware facts (16-beam lidar layout, ~1900 ticks/m, double-frame read bug, 0.5 m grid cells) and what strategy works.\n- **drive.py** \u2014 the proven, debugged left-hand wall follower (closed-loop 90\u00b0 turns, encoder-metered 0.5 m cell moves, bump recovery, exits on `goal=1`).\n- **SOLUTION.md** \u2014 goal location and shortest known path in the run-2 frame, with a clear caveat that the origin is not the episode start, plus a concrete plan: rerun the proven follower first, optionally speed it up, and localize against the episode-1 trace for a shortcut.\n- **run_ep1.log** \u2014 full step trace of this episode for map reconstruction via **replay.py**.\n\nPowering down."},{"k":"note","t":"summary"}],"memory":{"NOTES.md":"# MZB-1 maze robot \u2014 findings (episode 1)\n\n## Hardware facts\n- /dev/robot/{lidar,heading,encoder_left,encoder_right,bump_front,bump_rear,status} read; motor_left/motor_right write (-255..255, persists until replaced).\n- BUG: a device read may return TWO concatenated frames (\"123\\n124\") \u2014 always take last line. Also empty reads happen; retry.\n- Lidar: 16 beams, 22.5\u00b0 apart, beam0=forward, CCW. -1.000 = invalid (treat as far). beam4=left, beam8=back, beam12=right.\n- Encoders: ~1900 ticks/meter (both wheels). PWM 100 \u2248 0.13 m/s forward. Spin at \u00b1100 \u2248 94 deg/s.\n- Heading: degrees CCW, quite reliable; maze axes align to 0/90/180/270.\n- Maze: grid, cell \u2248 0.5 m; centered robot sees walls at ~0.25 m, next cell wall ~0.75.\n- status: \"tick=N goal=0|1\".\n\n## Strategy that works (src/drive.py)\n- Left-hand wall follow: at each cell, read lidar; open threshold 0.4 m on beams 4/0/12; prefer left,straight,right,else 180.\n- Closed-loop turn to absolute snapped heading (0/90/180/270) using heading device, speed ~ err*2.5 clamped 40..140.\n- Forward 0.5 m by encoder average, heading-hold corr=err*4 + lateral centering from side beams, base PWM 130; abort if front<0.20 or bump; on bump back up 0.8s and re-square.\n- Crash from double-frame encoder read killed run 1 (motors kept last cmd \u2192 drove into wall). Fixed.\n\n## Status this episode\n- Running left-hand follower; watch /memory/run.log for step trace and GOAL line.\n\n## If left-hand follow did NOT reach goal (see run.log for GOAL line)\n- Pure wall-following fails if goal cell is not adjacent to the followed wall network.\n- Next: implement grid mapper: track cell (x,y) from heading+0.5m steps, record walls from lidar each cell, do Tremaux/BFS to unexplored cells. run.log 'step' lines give full history: heading h and F/L/R readings each step; forward 0.5m after each decision line.\n- Start pose ep1: heading ~357 (facing 0), reconstruct with /memory/replay.py.\n","SOLUTION.md":"# Episode 1 SOLVED via left-hand wall follow (135 steps, ~9 min)\nStart cell (0,0) facing heading 0 (+x). Goal cell: (5, 2)\nGrid: +x=heading0, +y=heading90(CCW/left). Cell=0.5m.\n\nShortest known path (17 moves) through mapped passages:\n[(0, 0), (1, 0), (1, -1), (1, -2), (1, -3), (1, -4), (1, -5), (2, -5), (2, -4), (2, -3), (2, -2), (2, -1), (2, 0), (3, 0), (4, 0), (5, 0), (5, 1), (5, 2)]\n\nNext episode: verify start heading ~0 and initial lidar F~0.75,L~0.24,R~0.24; then just follow this cell path with drive.py primitives (turn_to snapped heading, forward 0.5m). If early lidar readings mismatch run.log episode-1 step 0-3 pattern, maze/start may differ -> fall back to left-hand follower (/memory/drive.py, WORKS).\n\n## IMPORTANT CAVEAT on coordinates\nThe (0,0) origin above is NOT the episode start! It is where run 2 of the\ncontroller began: mid-maze, after run 1 crashed (encoder parse bug) ~8 steps\nin, hit a wall, and the fixed script restarted facing 180. True episode start\nwas ~8 cells away (run 1 trace = first 9 'step' lines in run.log, starting\nsnap-heading 90, but note probes had already moved robot ~0.13m fwd and +47deg\nbefore run 1).\n=> Do NOT blindly replay the 17-move path from the episode start.\n\n## Recommended plan for next episode (15 min budget)\n1. Just run the proven left-hand follower: python3 -u /memory/drive.py\n   (copy to src/ first; it logs to /memory/run.log, exits on goal=1).\n   It solved from crash-position in ~9 min / 135 steps. From true start it\n   should be similar or less; budget fits.\n2. Optional speedup: raise base PWM 130->170 in forward(), turn speeds\n   40..140 -> 60..170. Test 2-3 steps before committing.\n3. While it runs, reconstruct map (see /memory/replay.py) and if you can match\n   the new trace's early F/L/R pattern to episode-1 run.log, you can localize\n   and cut over to the known shortest path to goal cell (5,2 in run-2 frame).\n","drive.py":"import time, math, sys\n\ndef rdev(dev):\n    for _ in range(8):\n        try:\n            with open('/dev/robot/'+dev) as f:\n                s=f.read().strip()\n            if s: return s.split('\\n')[-1].strip()\n        except: pass\n        time.sleep(0.01)\n    return ''\n\ndef w(dev,v):\n    with open('/dev/robot/'+dev,'w') as f: f.write(str(int(v))+'\\n')\n\ndef stop(): w('motor_left',0); w('motor_right',0)\n\ndef heading():\n    s=rdev('heading')\n    return float(s) if s else None\n\ndef lidar():\n    s=rdev('lidar')\n    if not s: return None\n    v=[float(x) for x in s.split(',')]\n    return [9.9 if x<0 else x for x in v]\n\ndef goal():\n    s=rdev('status')\n    return 'goal=1' in s\n\ndef angdiff(a,b):\n    d=(a-b)%360\n    if d>180: d-=360\n    return d\n\ndef turn_to(target):\n    # closed loop turn to absolute heading (deg, CCW positive)\n    for _ in range(200):\n        h=heading()\n        if h is None: continue\n        e=angdiff(target,h)\n        if abs(e)<4:\n            stop(); time.sleep(0.15)\n            h=heading(); e=angdiff(target,h)\n            if abs(e)<5: return True\n            continue\n        sp=max(40,min(140,abs(e)*2.5))\n        if e>0: w('motor_left',-sp); w('motor_right',sp)\n        else: w('motor_left',sp); w('motor_right',-sp)\n        time.sleep(0.05)\n    stop(); return False\n\nTICKS=1900  # per meter\ndef enc():\n    while True:\n        try:\n            l=rdev('encoder_left'); r=rdev('encoder_right')\n            return int(l), int(r)\n        except ValueError: pass\n\ndef forward(dist, target_h):\n    l0,r0=enc()\n    while True:\n        l,r=enc()\n        trav=((l-l0)+(r-r0))/2.0/TICKS\n        if trav>=dist: break\n        ld=lidar()\n        if ld and ld[0]<0.20: break\n        if rdev('bump_front')=='1':\n            w('motor_left',-80); w('motor_right',-80); time.sleep(0.3); break\n        h=heading()\n        e=angdiff(target_h,h) if h is not None else 0\n        # lateral centering using side beams\n        lat=0\n        if ld:\n            L,R=ld[4],ld[12]\n            if L<0.45 and R<0.45: lat=(L-R)*60\n            elif L<0.45: lat=(L-0.24)*60\n            elif R<0.45: lat=(0.24-R)*60\n        corr=e*4+lat\n        corr=max(-50,min(50,corr))\n        base=130\n        w('motor_left',base-corr); w('motor_right',base+corr)\n        time.sleep(0.04)\n    stop(); time.sleep(0.1)\n\nCELL=0.5\nlog=open('/memory/run.log','a')\ndef L(*a):\n    print(*a); log.write(' '.join(map(str,a))+'\\n'); log.flush()\n\n# snap heading to nearest 90\nh=heading()\ncur=round(h/90)%4*90\nturn_to(cur)\nL('start heading',h,'snap',cur)\nt0=time.time()\nsteps=0\nwhile time.time()-t0<600:\n    if goal():\n        L('GOAL after',steps,'steps'); stop(); sys.exit(0)\n    if rdev('bump_front')=='1':\n        w('motor_left',-90); w('motor_right',-90); time.sleep(0.8); stop(); time.sleep(0.2)\n        turn_to(cur)\n    ld=lidar()\n    if not ld: continue\n    F,Lft,R=ld[0],ld[4],ld[12]\n    if Lft>0.4: choice='left'\n    elif F>0.4: choice='straight'\n    elif R>0.4: choice='right'\n    else: choice='back'\n    L('step',steps,'h',cur,'F',F,'L',Lft,'R',R,'->',choice)\n    if choice=='left': cur=(cur+90)%360; turn_to(cur)\n    elif choice=='right': cur=(cur-90)%360; turn_to(cur)\n    elif choice=='back': cur=(cur+180)%360; turn_to(cur)\n    forward(CELL,cur)\n    steps+=1\n    if goal():\n        L('GOAL after',steps,'steps'); stop(); sys.exit(0)\nL('timeout, no goal')\nstop()\n","replay.py":"# Reconstruct visited cells from run.log step lines\nimport sys,re\nx=y=0; path=[(0,0)]\ndirs={0:(1,0),90:(0,1),180:(-1,0),270:(0,-1)}\nfor ln in open(sys.argv[1] if len(sys.argv)>1 else '/memory/run.log'):\n    m=re.match(r'step (\\d+) h (\\d+) F ([\\d.]+) L ([\\d.]+) R ([\\d.]+) -> (\\w+)',ln)\n    if not m: continue\n    h=int(m.group(2)); c=m.group(6)\n    h={'left':(h+90)%360,'right':(h-90)%360,'back':(h+180)%360,'straight':h}[c]\n    dx,dy=dirs[h]; x+=dx; y+=dy; path.append((x,y))\nprint(len(path),'cells, bbox',min(p[0] for p in path),max(p[0] for p in path),min(p[1] for p in path),max(p[1] for p in path))\nprint(path)\n","run.log":"","run_ep1.log":"start heading 45.5 snap 90\nstep 0 h 90 F 0.252 L 0.369 R 0.641 -> right\nstep 1 h 0 F 0.197 L 0.753 R 0.23 -> left\nstep 2 h 90 F 0.262 L 0.295 R 1.199 -> right\nstep 3 h 0 F 0.702 L 0.27 R 0.201 -> straight\nstep 4 h 0 F 0.216 L 1.3 R 0.224 -> left\nstep 5 h 90 F 0.79 L 0.267 R 0.21 -> straight\nstep 6 h 90 F 0.325 L 0.794 R 0.214 -> left\nstep 7 h 180 F 0.291 L 0.197 R 0.797 -> right\nstep 8 h 90 F 0.293 L 0.298 R 0.702 -> right\nstart heading 145.5 snap 180\nstep 0 h 180 F 0.201 L 0.647 R 1.364 -> left\nstep 1 h 270 F 0.172 L 0.802 R 0.19 -> left\nstep 2 h 0 F 0.315 L 0.311 R 0.684 -> right\nstep 3 h 270 F 0.212 L 0.31 R 0.693 -> right\nstep 4 h 180 F 0.199 L 0.723 R 0.281 -> left\nstep 5 h 270 F 0.235 L 0.821 R 0.2 -> left\nstep 6 h 0 F 0.327 L 0.271 R 1.23 -> right\nstep 7 h 270 F 0.719 L 0.297 R 0.176 -> straight\nstep 8 h 270 F 0.232 L 0.325 R 1.192 -> right\nstep 9 h 180 F 0.692 L 0.228 R 0.254 -> straight\nstep 10 h 180 F 0.209 L 0.756 R 0.241 -> left\nstep 11 h 270 F 0.256 L 0.286 R 0.704 -> right\nstep 12 h 180 F 0.203 L 0.28 R 0.204 -> back\nstep 13 h 0 F 0.292 L 0.738 R 0.267 -> left\nstep 14 h 90 F 9.9 L 0.221 R lision_count":22,"solved":true,"end_reason":"solved","live":false}};
const $ = (s) => document.querySelector(s);
const css = (n) => getComputedStyle(document.documentElement)
  .getPropertyValue(n).trim();

/* header */
const st = D.stats, m = D.meta;
$("#subtitle").textContent =
  `episode ${m.episode} · arm ${m.arm} · labels ${m.labels} · ` +
  `${m.noise} · maze ${m.maze_hash} · ${m.model}`;
const chips = [
  st.live ? ["status", "IN PROGRESS", "state-live"]
          : st.solved ? ["status", "SOLVED", "state-solved"]
                      : ["status", (st.end_reason || "ended").toUpperCase(), ""],
  ["sim time", (st.final_tick / 50).toFixed(0) + " s", ""],
  st.solved && D.goal_tick ? ["solved at", (D.goal_tick / 50).toFixed(0) + " s", "state-solved"] : null,
  ["turns", st.turns, ""],
  ["output tokens", (st.tokens_out || 0).toLocaleString(), ""],
  ["collisions", st.collision_count, ""],
  (D.special && D.special.pickup_tick != null)
    ? ["key picked up", (D.special.pickup_tick / 50).toFixed(0) + " s",
       "state-solved"] : (D.maze.locked ? ["key", "not found", ""] : null),
  (D.special && D.special.unlock_tick != null)
    ? ["door unlocked", (D.special.unlock_tick / 50).toFixed(0) + " s",
       "state-solved"] : (D.maze.locked ? ["door", "locked", ""] : null),
];
$("#chips").innerHTML = chips.filter(Boolean).map(([k, v, cls]) =>
  `<span class="chip ${cls}">${k} <b>${v}</b></span>`).join("");

/* canvas replay */
const cv = $("#cv"), ctx = cv.getContext("2d");
const MZ = D.maze, P = D.poses;
let idx = P.length - 1, playing = false;
const collSet = new Set(D.collisions);

function draw() {
  const w = cv.width, h = cv.height;
  ctx.fillStyle = css("--surface");
  ctx.fillRect(0, 0, w, h);
  const worldW = MZ.width * MZ.cell_size, worldH = MZ.height * MZ.cell_size;
  const pad = 26;
  const sc = Math.min((w - 2 * pad) / worldW, (h - 2 * pad) / worldH);
  const X = (x) => pad + x * sc, Y = (y) => h - pad - y * sc;
  const cs = MZ.cell_size;

  ctx.globalAlpha = 0.16;
  ctx.fillStyle = css("--goal");
  ctx.fillRect(X(MZ.goal_cell[0] * cs), Y((MZ.goal_cell[1] + 1) * cs),
    cs * sc, cs * sc);
  ctx.fillStyle = css("--ink-3");
  ctx.fillRect(X(MZ.start_cell[0] * cs), Y((MZ.start_cell[1] + 1) * cs),
    cs * sc, cs * sc);
  ctx.globalAlpha = 1;
  ctx.fillStyle = css("--ink-2");
  ctx.font = `${Math.round(0.38 * cs * sc)}px Archivo, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("S", X((MZ.start_cell[0] + 0.5) * cs),
    Y((MZ.start_cell[1] + 0.5) * cs));
  ctx.fillText("G", X((MZ.goal_cell[0] + 0.5) * cs),
    Y((MZ.goal_cell[1] + 0.5) * cs));

  ctx.strokeStyle = css("--ink");
  ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath();
  for (const [x1, y1, x2, y2] of MZ.segments) {
    ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2));
  }
  ctx.stroke();
  const nowT = P.length ? P[Math.min(idx, P.length - 1)][0] : 0;
  const SP = D.special || {};
  if (MZ.locked && MZ.door_segments &&
      !(SP.unlock_tick != null && nowT >= SP.unlock_tick)) {
    ctx.strokeStyle = css("--hit");
    ctx.lineWidth = 5;
    ctx.beginPath();
    for (const [x1, y1, x2, y2] of MZ.door_segments) {
      ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2));
    }
    ctx.stroke();
  }
  if (MZ.locked && MZ.key_pos &&
      !(SP.pickup_tick != null && nowT >= SP.pickup_tick)) {
    ctx.save();
    ctx.translate(X(MZ.key_pos[0]), Y(MZ.key_pos[1]));
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = css("--robot");
    ctx.fillRect(-6, -6, 12, 12);
    ctx.restore();
  }

  if (!P.length) return;
  const upto = Math.min(idx, P.length - 1);
  ctx.strokeStyle = css("--trail");
  ctx.lineWidth = 1.7; ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(X(P[0][1]), Y(P[0][2]));
  for (let i = 1; i <= upto; i++) ctx.lineTo(X(P[i][1]), Y(P[i][2]));
  ctx.stroke();
  ctx.globalAlpha = 1;

  const [t, px, py, th, col] = P[upto];
  const rr = 0.09 * sc;
  if (col) {
    ctx.strokeStyle = css("--hit"); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(X(px), Y(py), rr + 5, 0, 7); ctx.stroke();
  }
  ctx.fillStyle = css("--robot");
  ctx.beginPath(); ctx.arc(X(px), Y(py), rr, 0, 7); ctx.fill();
  ctx.strokeStyle = css("--surface"); ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(X(px), Y(py));
  ctx.lineTo(X(px + 0.09 * Math.cos(th)), Y(py + 0.09 * Math.sin(th)));
  ctx.stroke();

  $("#clock").textContent =
    `tick ${t} · ${(t / 50).toFixed(1)} s`;
}

const scrub = $("#scrub");
scrub.max = Math.max(0, P.length - 1);
scrub.value = idx;
scrub.addEventListener("input", (e) => {
  idx = Number(e.target.value); stopPlay(); draw();
});
function stopPlay() { playing = false; $("#play").textContent = "PLAY"; }
$("#play").addEventListener("click", () => {
  playing = !playing;
  $("#play").textContent = playing ? "PAUSE" : "PLAY";
  if (playing) {
    if (idx >= P.length - 1) idx = 0;
    const stepN = Math.max(1, Math.round(P.length / 700));
    const tickFn = () => {
      if (!playing) return;
      idx = Math.min(idx + stepN, P.length - 1);
      scrub.value = idx;
      draw();
      if (idx >= P.length - 1) { stopPlay(); return; }
      requestAnimationFrame(tickFn);
    };
    requestAnimationFrame(tickFn);
  }
});
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target === document.body) {
    e.preventDefault(); $("#play").click();
  }
});

/* transcript */
const esc = (s) => { const d = document.createElement("i");
  d.textContent = s; return d.innerHTML; };
$("#feed").innerHTML = D.transcript.map((e) => {
  if (e.k === "agent") return `<div class="ev agent">${esc(e.t)}</div>`;
  if (e.k === "cmd") return `<div class="ev cmd">$ ${esc(e.t)}</div>`;
  if (e.k === "out") return `<div class="ev out">${esc(e.t)}</div>`;
  return `<div class="ev note">— ${esc(e.t)} —</div>`;
}).join("") || '<div class="empty">no transcript yet</div>';

/* memory */
const memNames = Object.keys(D.memory);
$("#memlist").innerHTML = memNames.length
  ? memNames.map((p) =>
      `<details class="memfile"><summary>/memory/${esc(p)} ` +
      `(${D.memory[p].length}b)</summary><pre>${esc(D.memory[p])}` +
      `</pre></details>`).join("")
  : '<div class="empty">memory is empty so far</div>';

/* theme changes repaint the canvas */
matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement,
  { attributes: true, attributeFilter: ["data-theme"] });

draw();
</script>
